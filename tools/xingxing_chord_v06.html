<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星星 AI 吉他扒谱 v0.6</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--ok:#047857;--warn:#b45309;--danger:#b91c1c;--shadow:0 6px 20px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}.app{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.title{font-size:28px;font-weight:900;margin:8px 0 4px}.sub{font-size:13px;color:var(--muted);margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}@media(max-width:720px){.c12,.c8,.c6,.c4,.c3{grid-column:span 12}}label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:16px;background:#fff}textarea{min-height:150px;resize:vertical}button,a.btn{border:none;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--brand);color:#fff}.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.danger{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}button:disabled{opacity:.5;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chip{background:#eff6ff;color:#1e3a8a;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:800}.small{font-size:12px;color:var(--muted);line-height:1.6}.notice,.success,.error{padding:10px 12px;border-radius:12px;font-size:13px}.notice{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}audio{width:100%}.progress{height:9px;background:#eef2f7;border-radius:999px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:var(--brand);width:0}.sheet{margin-top:12px}.lyric-line{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;background:#fff;cursor:pointer}.lyric-line.active{border-color:var(--brand);background:#f8fbff}.chord-input{font-weight:900;color:#1d4ed8;font-size:18px;border:none!important;padding:0!important;background:transparent!important}.lyric-text{font-size:17px;line-height:1.7;margin-top:4px}.time{font-size:11px;color:var(--muted)}.recording{animation:pulse 1.2s infinite}@keyframes pulse{50%{opacity:.55}}
</style></head><body><div class="app">
<div class="top"><a class="btn ghost" href="./xingxing_toolbox.html?streamer=xingxing">← 回星星工具箱</a><span class="chip">v0.6 边播边扒</span></div>
<div class="title">🎸 星星 AI 吉他扒谱</div><div class="sub">在线音频 URL / 上传音档 / 边播放边录音｜歌词校正｜转调与 Capo</div>
<div class="card"><h3>1. 音讯来源</h3><div class="grid">
<div class="c8"><label>在线音频网址</label><input id="audioUrl" type="url" placeholder="可直接读取的 mp3 / m4a / wav"></div><div class="c4"><label>&nbsp;</label><button id="loadUrlBtn" class="ghost" style="width:100%">载入网址</button></div>
<div class="c8"><label>或上传音讯</label><input id="audioFile" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac,.ogg"></div><div class="c4"><label>&nbsp;</label><button id="analyzeBtn" class="primary" style="width:100%" disabled>🎧 自动扒和弦</button></div></div>
<div style="height:1px;background:var(--line);margin:14px 0"></div><h4 style="margin:0 0 8px">🎙️ 边播放边录音</h4><div class="row"><button id="captureTabBtn" class="ghost">录标签页 / 系统音讯</button><button id="captureMicBtn" class="ghost">录麦克风</button><button id="stopCaptureBtn" class="danger" disabled>停止并分析</button><span id="recordChip" class="chip">未录音</span></div><div class="small" style="margin-top:8px">桌机 Chrome / Edge 可优先选择“分享标签页并包含音讯”；若浏览器无法取得系统音轨，请改用麦克风。手机通常以麦克风路径为主。</div>
<div id="status" class="notice" style="margin-top:10px">三种来源择一即可。录音停止后会把整段音讯送进同一套本机分析流程。</div><div id="progressWrap" style="display:none"><div class="progress"><div id="progressBar"></div></div><div id="progressText" class="small"></div></div></div>
<div class="card"><h3>2. 播放器</h3><audio id="player" controls></audio><div class="row" style="margin-top:8px"><span class="chip" id="durationChip">长度：—</span><span class="chip" id="timeChip">目前：00:00</span><span class="chip" id="nowChord">和弦：—</span></div></div>
<div class="card"><h3>3. 歌曲与吉他调性</h3><div class="grid"><div class="c6"><label>歌名</label><input id="titleInput"></div><div class="c6"><label>歌手</label><input id="artistInput"></div><div class="c3"><label>原调</label><input id="originalKey" readonly></div><div class="c3"><label>目前调</label><input id="currentKey" readonly></div><div class="c3"><label>BPM</label><input id="bpmInput" readonly></div><div class="c3"><label>Capo</label><input id="capoInput" readonly></div></div><div class="row" style="margin-top:10px"><button id="keyDown" class="ghost">−1 Key</button><button id="keyReset" class="ghost">回原调</button><button id="keyUp" class="ghost">＋1 Key</button><span class="chip" id="shapeChip">建议指法：—</span></div></div>
<div class="card"><h3>4. 贴入歌词</h3><textarea id="lyricsInput" placeholder="逐行歌词或 LRC"></textarea><div class="row" style="margin-top:8px"><button id="buildLyricsBtn" class="primary">生成歌词弹唱谱</button><button id="clearLyricsBtn" class="ghost">清空歌词</button></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">5. 歌词弹唱谱</h3><div class="row"><button id="setLineNowBtn" class="ghost" disabled>当前歌词设为播放时间</button><button id="copySheetBtn" class="ghost">复制弹唱谱</button></div></div><div id="sheet" class="sheet"><div class="small">请先贴歌词并生成。</div></div></div>
</div><script>
const $=id=>document.getElementById(id),NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];let audioBuffer=null,objectUrl='',timeline=[],lyrics=[],selectedLine=-1,keyShift=0,detectedKey='',bpm=0,recorder=null,captureStream=null,captureChunks=[],captureStartedAt=0,captureTimer=null;
function fmt(sec){if(!Number.isFinite(sec))return'—';const s=Math.max(0,Math.floor(sec));return`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function status(text,kind='notice'){$('status').className=kind;$('status').textContent=text}function prog(p,t){$('progressWrap').style.display='block';$('progressBar').style.width=Math.max(0,Math.min(100,p))+'%';$('progressText').textContent=t}
async function decodeArrayBuffer(ab){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('浏览器不支持 Web Audio');const ctx=new AC();try{return await ctx.decodeAudioData(ab.slice(0))}finally{ctx.close()}}
function makeMono(buf,rate=8000){const ratio=buf.sampleRate/rate,n=Math.floor(buf.length/ratio),out=new Float32Array(n);for(let i=0;i<n;i++){const si=Math.floor(i*ratio);let v=0;for(let c=0;c<buf.numberOfChannels;c++)v+=buf.getChannelData(c)[si]||0;out[i]=v/buf.numberOfChannels}return{data:out,rate}}
function estimateBpm(x,rate){const hop=256,frame=512,e=[];for(let i=0;i+frame<x.length;i+=hop){let s=0;for(let j=0;j<frame;j++){const v=x[i+j];s+=v*v}e.push(Math.sqrt(s/frame))}const onset=e.map((v,i)=>i?Math.max(0,v-e[i-1]):0);let bb=90,bs=-1;for(let b=60;b<=180;b++){const lag=Math.round(60*rate/(b*hop));let s=0;for(let i=lag;i<onset.length;i++)s+=onset[i]*onset[i-lag];if(s>bs){bs=s;bb=b}}return bb}
function goertzel(frame,rate,f){const w=2*Math.PI*f/rate,coef=2*Math.cos(w);let s0=0,s1=0,s2=0;for(let i=0;i<frame.length;i++){s0=frame[i]+coef*s1-s2;s2=s1;s1=s0}return Math.max(0,s1*s1+s2*s2-coef*s1*s2)}
function chroma(frame,rate){const c=new Float64Array(12);for(let m=48;m<=83;m++){const f=440*Math.pow(2,(m-69)/12);c[m%12]+=goertzel(frame,rate,f)}const sum=c.reduce((a,b)=>a+b,0)||1;for(let i=0;i<12;i++)c[i]/=sum;return c}
function chordFrom(c){let best={chord:'N',score:-1};for(let r=0;r<12;r++)for(const min of[false,true]){const t=(r+(min?3:4))%12,f=(r+7)%12,score=c[r]*1.15+c[t]+c[f]*.95;if(score>best.score)best={chord:NOTES[r]+(min?'m':''),score}}return best.chord}
function estimateKey(sum){let bi=0,bv=-1;for(let i=0;i<12;i++)if(sum[i]>bv){bv=sum[i];bi=i}return NOTES[bi]}
function compress(raw){const out=[];for(const x of raw){if(out.length&&out[out.length-1].chord===x.chord)continue;out.push(x)}return out}
async function analyzeBuffer(){if(!audioBuffer)return;const mono=makeMono(audioBuffer);prog(15,'估算 BPM…');bpm=estimateBpm(mono.data,mono.rate);$('bpmInput').value=bpm;const raw=[],sum=new Float64Array(12),frame=2048,step=Math.round(mono.rate*1.5);for(let s=0;s+frame<mono.data.length;s+=step){const c=chroma(mono.data.subarray(s,s+frame),mono.rate);for(let i=0;i<12;i++)sum[i]+=c[i];raw.push({time:s/mono.rate,chord:chordFrom(c)});if(raw.length%12===0){prog(20+70*s/mono.data.length,'辨识和弦…');await new Promise(r=>setTimeout(r,0))}}timeline=compress(raw);detectedKey=estimateKey(sum);$('originalKey').value=detectedKey;$('currentKey').value=detectedKey;refreshCapo();remapLyrics();prog(100,'分析完成');status('分析完成，可播放核对并在歌词上校正和弦。','success')}
function splitChord(ch){const m=String(ch).match(/^([A-G])(#|b)?(.*)$/);if(!m)return null;const flats={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};let root=m[1]+(m[2]||''),idx=NOTES.indexOf(root);if(idx<0)idx=NOTES.indexOf(flats[root]);return idx<0?null:{idx,suffix:m[3]||''}}
function transposeChord(ch,n){const p=splitChord(ch);return p?NOTES[(p.idx+n+120)%12]+p.suffix:ch}function currentKey(){return detectedKey?transposeChord(detectedKey,keyShift):''}
function refreshCapo(){const k=currentKey();$('currentKey').value=k||'—';if(!k){$('capoInput').value='';return}const target=splitChord(k).idx,prefs=['G','C','D','A','E'];let best={capo:0,shape:k,score:99};for(const sh of prefs){const si=splitChord(sh).idx;for(let c=0;c<=7;c++)if((si+c)%12===target&&c<best.score)best={capo:c,shape:sh,score:c}}$('capoInput').value=best.capo;$('shapeChip').textContent=`建议指法：${best.shape}｜Capo ${best.capo}`;renderLyrics();updateNowChord()}
function parseLyrics(text){const rows=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const l=[];let lrc=false;for(const r of rows){const m=r.match(/^\[(\d{1,2}):(\d{2}(?:\.\d+)?)\]\s*(.*)$/);if(m){lrc=true;l.push({time:+m[1]*60+ +m[2],text:m[3],chords:'',manual:false})}else l.push({time:null,text:r,chords:'',manual:false})}if(lrc)return l.filter(x=>x.time!==null);const dur=$('player').duration||audioBuffer?.duration||rows.length*4;return l.map((x,i)=>({...x,time:dur*i/Math.max(1,l.length)}))}
function chordsFor(t,next){const arr=timeline.filter(x=>x.time>=t&&x.time<(next??Infinity));if(!arr.length){let p=null;for(const x of timeline){if(x.time<=t)p=x;else break}return p?transposeChord(p.chord,keyShift):''}return[...new Set(arr.map(x=>transposeChord(x.chord,keyShift)))].join('  ')}
function remapLyrics(){for(let i=0;i<lyrics.length;i++)if(!lyrics[i].manual)lyrics[i].chords=chordsFor(lyrics[i].time,lyrics[i+1]?.time);renderLyrics()}
function renderLyrics(){const s=$('sheet');if(!lyrics.length){s.innerHTML='<div class="small">请先贴歌词并生成。</div>';return}s.innerHTML=lyrics.map((l,i)=>`<div class="lyric-line ${i===selectedLine?'active':''}" data-i="${i}"><div class="time">${fmt(l.time)}</div><input class="chord-input" data-ci="${i}" value="${(l.chords||'').replaceAll('"','&quot;')}"><div class="lyric-text">${l.text.replaceAll('&','&amp;').replaceAll('<','&lt;')}</div></div>`).join('');s.querySelectorAll('.lyric-line').forEach(el=>el.onclick=e=>{if(e.target.classList.contains('chord-input'))return;selectedLine=+el.dataset.i;$('setLineNowBtn').disabled=false;$('player').currentTime=lyrics[selectedLine].time;renderLyrics()});s.querySelectorAll('.chord-input').forEach(inp=>inp.oninput=()=>{const i=+inp.dataset.ci;lyrics[i].chords=inp.value;lyrics[i].manual=true})}
function updateNowChord(){let c='—';for(const x of timeline){if(x.time<=$('player').currentTime)c=transposeChord(x.chord,keyShift);else break}$('nowChord').textContent='和弦：'+c}
async function loadBlob(blob,name){audioBuffer=await decodeArrayBuffer(await blob.arrayBuffer());if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(blob);$('player').src=objectUrl;$('analyzeBtn').disabled=false;$('durationChip').textContent='长度：'+fmt(audioBuffer.duration);if(!$('titleInput').value)$('titleInput').value=name.replace(/\.[^.]+$/,'')}
$('audioFile').onchange=async()=>{const f=$('audioFile').files[0];if(f){await loadBlob(f,f.name);status('音档已载入，可自动扒和弦。','success')}};
$('loadUrlBtn').onclick=async()=>{const u=$('audioUrl').value.trim();if(!u)return alert('请先输入网址');try{status('正在读取在线音频…');const r=await fetch(u,{mode:'cors'});if(!r.ok)throw new Error('HTTP '+r.status);const b=await r.blob();if(!b.size)throw new Error('没有取得音频内容');await loadBlob(b,'online-audio');status('在线音频已载入。','success')}catch(e){status('无法直接读取：'+e.message+'。若是音乐平台页面，请用边播边录。','error')}};
$('analyzeBtn').onclick=analyzeBuffer;
async function beginCapture(kind){try{let stream;if(kind==='display'){if(!navigator.mediaDevices?.getDisplayMedia)throw new Error('浏览器不支持系统音讯录制');stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});if(!stream.getAudioTracks().length){stream.getTracks().forEach(t=>t.stop());throw new Error('没有取得音轨，请分享“标签页”并勾选分享音讯，或改用麦克风')}}else{stream=await navigator.mediaDevices.getUserMedia({audio:true})}captureStream=stream;captureChunks=[];const opts=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?{mimeType:'audio/webm;codecs=opus'}:{};recorder=new MediaRecorder(stream,opts);recorder.ondataavailable=e=>{if(e.data.size)captureChunks.push(e.data)};recorder.onstop=async()=>{clearInterval(captureTimer);captureStream?.getTracks().forEach(t=>t.stop());const blob=new Blob(captureChunks,{type:recorder.mimeType||'audio/webm'});$('recordChip').classList.remove('recording');$('recordChip').textContent='录音完成';$('stopCaptureBtn').disabled=true;try{await loadBlob(blob,'live-capture.webm');status('录音完成，正在自动分析…','success');await analyzeBuffer()}catch(e){status('录音完成但无法解码：'+e.message,'error')}};recorder.start(1000);captureStartedAt=Date.now();$('recordChip').classList.add('recording');$('stopCaptureBtn').disabled=false;$('captureTabBtn').disabled=true;$('captureMicBtn').disabled=true;captureTimer=setInterval(()=>{$('recordChip').textContent='录音中 '+fmt((Date.now()-captureStartedAt)/1000)},500);status(kind==='display'?'正在录标签页/系统音讯…':'正在录麦克风…','success')}catch(e){status('无法开始录音：'+e.message,'error')}}
$('captureTabBtn').onclick=()=>beginCapture('display');$('captureMicBtn').onclick=()=>beginCapture('mic');$('stopCaptureBtn').onclick=()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();$('captureTabBtn').disabled=false;$('captureMicBtn').disabled=false};
$('buildLyricsBtn').onclick=()=>{lyrics=parseLyrics($('lyricsInput').value);remapLyrics()};$('clearLyricsBtn').onclick=()=>{$('lyricsInput').value='';lyrics=[];renderLyrics()};$('setLineNowBtn').onclick=()=>{if(selectedLine>=0){lyrics[selectedLine].time=$('player').currentTime;lyrics.sort((a,b)=>a.time-b.time);renderLyrics()}};$('keyDown').onclick=()=>{keyShift--;remapLyrics();refreshCapo()};$('keyUp').onclick=()=>{keyShift++;remapLyrics();refreshCapo()};$('keyReset').onclick=()=>{keyShift=0;remapLyrics();refreshCapo()};$('copySheetBtn').onclick=async()=>{const text=`${$('titleInput').value||'未命名'}｜Key ${currentKey()||'—'}｜Capo ${$('capoInput').value||0}\n\n`+lyrics.map(x=>`${x.chords}\n${x.text}`).join('\n\n');try{await navigator.clipboard.writeText(text)}catch{}alert('已复制弹唱谱')};$('player').ontimeupdate=()=>{$('timeChip').textContent='目前：'+fmt($('player').currentTime);updateNowChord();let idx=-1;for(let i=0;i<lyrics.length;i++){if(lyrics[i].time<=$('player').currentTime)idx=i;else break}if(idx!==selectedLine&&idx>=0){selectedLine=idx;renderLyrics()}};$('player').onloadedmetadata=()=>{$('durationChip').textContent='长度：'+fmt($('player').duration)};
</script></body></html>
