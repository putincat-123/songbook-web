<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>谜屿宠物小屋 V2 · 角色层验收</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
body{display:flex;justify-content:center;background:#a38ab8}
.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}
.scene-layer,.object-layer,.pet-layer,.ui-layer{position:absolute;inset:0}
.scene-layer{z-index:10}
.object-layer{z-index:20;pointer-events:none}
.pet-layer{z-index:30;pointer-events:none}
.ui-layer{z-index:40;pointer-events:none}
.scene-layer svg{display:block;width:100%;height:100%}
.pet-slot{position:absolute;left:54.1%;top:52%;width:14.4%;height:11.1%;transform:translateX(-50%);transform-origin:50% 100%}
.pet-slot img{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 3px 2px rgba(78,57,78,.18))}
.pet-shadow{position:absolute;left:50%;bottom:-1.5%;width:72%;height:8%;transform:translateX(-50%);border-radius:50%;background:rgba(79,58,83,.14);filter:blur(1px);z-index:-1}
.load-error{display:none;position:absolute;z-index:50;left:50%;top:56%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:12px;background:#fff9;color:#765d82;font-size:12px;font-weight:700}
@media(min-width:431px){body{padding:18px}.scene{height:auto;aspect-ratio:375/667;border-radius:24px;box-shadow:0 20px 55px #3e285755}}
</style>
</head>
<body>
<main class="scene" id="scene">
  <div class="scene-layer" id="scene-layer" aria-label="房间场景"></div>
  <div class="object-layer" id="object-layer" aria-hidden="true"></div>
  <div class="pet-layer" id="pet-layer" data-pet="ragdoll" data-stage="baby" data-action="idle">
    <div class="pet-slot" id="pet-slot">
      <span class="pet-shadow"></span>
      <img id="pet-sprite" src="/songbook-web/tools/assets/miyu_pet_room_v2/ragdoll_kitten_baby.webp?v=3" alt="布偶小奶猫">
    </div>
  </div>
  <div class="ui-layer" id="ui-layer" aria-hidden="true"></div>
  <div class="load-error" id="load-error">角色素材载入失败</div>
</main>
<script>
const state={pet:'ragdoll',stage:'baby',action:'idle'};
window.petState=state;
window.setPetAction=function(action){state.action=action;document.getElementById('pet-layer').dataset.action=action};

async function mountScene(){
  const host=document.getElementById('scene-layer');
  try{
    const html=await fetch('miyu_pet_room_v2.html?v=layer1-locked',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('scene '+r.status);return r.text()});
    const doc=new DOMParser().parseFromString(html,'text/html');
    const svg=doc.querySelector('svg.room');
    if(!svg)throw new Error('scene svg missing');
    const oldPet=svg.querySelector('#pet-character-layer');
    if(oldPet)oldPet.remove();
    svg.removeAttribute('class');
    svg.setAttribute('aria-hidden','true');
    host.replaceChildren(document.importNode(svg,true));

    const nav=doc.querySelector('nav.themes');
    if(nav){
      const cloned=document.importNode(nav,true);
      cloned.style.pointerEvents='auto';
      cloned.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
        const key=btn.dataset.theme;
        if(!key)return;
        const target=document.querySelector('#scene-layer svg');
        if(!target)return;
        const themes={purple:{body:'#a38ab8',w:['#aa8ac2','#c29bbd','#d5a6ae'],f:['#9b80b2','#bd8fae','#d9a493'],so:['#9eb5d7','#778bc2'],cab:['#9c75b8','#72589d'],cur:'#dba4d2',lamp:'#d77ba7',rug:['#f4b9bd','#f6d1c5'],g:'#ee819c',top:'#75d1cb'},muji:{body:'#d9d1bf',w:['#d8dfd4','#e8e2d5','#f2e7d7'],f:['#c9b28f','#d8c4a3','#ead8ba'],so:['#c8d6c8','#aebfae'],cab:['#c9a976','#a8875e'],cur:'#eee5d5',lamp:'#c9b47e',rug:['#e5d8bd','#f2ead8'],g:'#d2c4aa',top:'#a9bdb3'},sea:{body:'#8eb4b3',w:['#9fc6c5','#b9d5cf','#d7e4d7'],f:['#8eb8b5','#a7c8bd','#c6d7c2'],so:['#9ccdcc','#75aaa9'],cab:['#c8aa72','#a88b5c'],cur:'#bde2df',lamp:'#84b8ac',rug:['#d8dfc9','#f0ead6'],g:'#e58b72',top:'#73bbb9'}};
        const t=themes[key];if(!t)return;
        document.body.style.background=t.body;
        [['w1',t.w[0]],['w2',t.w[1]],['w3',t.w[2]],['f1',t.f[0]],['f2',t.f[1]],['f3',t.f[2]],['so1',t.so[0]],['so2',t.so[1]],['c1',t.cab[0]],['c2',t.cab[1]]].forEach(([id,c])=>target.querySelector('#'+id)?.setAttribute('stop-color',c));
        target.querySelector('#curL')?.setAttribute('fill',t.cur);target.querySelector('#curR')?.setAttribute('fill',t.cur);target.querySelector('#lamp')?.setAttribute('fill',t.lamp);target.querySelector('#rug1')?.setAttribute('fill',t.rug[0]);target.querySelector('#rug2')?.setAttribute('fill',t.rug[1]);target.querySelector('#gbody')?.setAttribute('fill',t.g);target.querySelector('#gtop')?.setAttribute('fill',t.top);
        cloned.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.theme===key));
        localStorage.setItem('miyu-v2-theme',key);
      }));
      document.getElementById('ui-layer').appendChild(cloned);
      const saved=localStorage.getItem('miyu-v2-theme')||'purple';
      cloned.querySelector(`[data-theme="${saved}"]`)?.click();
    }
  }catch(err){
    console.error(err);
    const box=document.getElementById('load-error');box.textContent='场景载入失败';box.style.display='block';
  }
}

const pet=document.getElementById('pet-sprite');
pet.addEventListener('error',()=>{const box=document.getElementById('load-error');box.textContent='角色素材载入失败';box.style.display='block'});
pet.addEventListener('load',()=>{document.getElementById('load-error').style.display='none'});
mountScene();
</script>
</body>
</html>
