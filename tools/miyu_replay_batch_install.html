<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miyu 批量回放｜安裝</title><style>body{margin:0;background:#f6f8fb;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 28px rgba(15,23,42,.07)}h1{margin:0 0 8px;font-size:28px}.muted{color:#6b7280;line-height:1.7}.btn{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;background:#2563eb;color:#fff}.code{margin-top:12px;padding:12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;max-height:90px;overflow:auto}ol{line-height:2}.ok{color:#047857;font-weight:700;margin-top:10px}</style></head><body><div class="wrap"><h1>🎧 Miyu 批量回放</h1><div class="muted">Chrome 可能會把拖曳的 JavaScript 書籤改成普通網頁，所以改用「複製 → 編輯書籤網址」安裝，最穩定。</div><div class="card"><button class="btn" id="copy">① 複製書籤程式碼</button><div class="code" id="code"></div><div id="status" class="ok"></div></div><div class="card"><b>② 安裝方式</b><ol><li>先把這個頁面加入書籤（⌘D）。</li><li>在書籤列找到它，右鍵 →「編輯」。</li><li>名稱改成「🎧 Miyu 批量回放」。</li><li>把「網址」欄全部刪掉，貼上剛才複製的程式碼。</li><li>儲存。</li></ol></div><div class="card"><b>③ 使用</b><ol><li>登入猫耳主播帳號。</li><li>打開主播「聲音」頁。</li><li>點書籤列的「🎧 Miyu 批量回放」。</li></ol><div class="muted">工具會在猫耳頁面內執行，因此沿用目前登入狀態，不保存帳號密碼。</div></div></div><script>const code=`javascript:(()=>{const s=document.createElement('script');s.src='https://putincat-123.github.io/songbook-web/tools/miyu_replay_batch_loader.js?v='+Date.now();document.body.appendChild(s)})()`;document.getElementById('code').textContent=code;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code);document.getElementById('status').textContent='✓ 已複製。現在去編輯書籤，把「網址」換成這段程式碼。'}catch(e){document.getElementById('status').textContent='複製失敗，請手動選取下方程式碼複製。'}};</script></body></html>
