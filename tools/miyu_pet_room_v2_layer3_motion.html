<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿宠物小屋 V2 · Layer 3 四向移动</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center;background:#a38ab8}.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}.scene-layer,.pet-layer,.ui-layer{position:absolute;inset:0}.scene-layer{z-index:10}.pet-layer{z-index:30;pointer-events:none}.ui-layer{z-index:40}.scene-layer svg{width:100%;height:100%;display:block}.pet-anchor{position:absolute;left:45%;top:78%;width:22%;aspect-ratio:96/120;transform:translate(-50%,-88.3%);will-change:left,top}.pixel-pet{width:100%;height:100%;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 4px 1px rgba(70,48,62,.18));transform-origin:50% 88.3%}.pixel-pet g{transform-box:fill-box}.pet-anchor[data-dir="left"] .pixel-pet{transform:scaleX(-1)}.pet-anchor.walking .motion-bob{animation:bob .44s steps(2,end) infinite}.pet-anchor.walking #arm-left{animation:armL .44s steps(2,end) infinite}.pet-anchor.walking #arm-right{animation:armR .44s steps(2,end) infinite}.pet-anchor.walking #leg-left{animation:legL .44s steps(2,end) infinite}.pet-anchor.walking #leg-right{animation:legR .44s steps(2,end) infinite}.pet-anchor.walking #pixel-tail{transform-origin:left center;animation:tail .44s steps(2,end) infinite}.pet-anchor.walking #back-tail{transform-origin:left center;animation:tail .44s steps(2,end) infinite}@keyframes bob{50%{transform:translateY(-1.5px)}}@keyframes armL{50%{transform:translate(1px,-1px)}}@keyframes armR{50%{transform:translate(-1px,0)}}@keyframes legL{50%{transform:translate(-1px,0)}}@keyframes legR{50%{transform:translate(1px,-1px)}}@keyframes tail{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}.pad{position:absolute;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));transform:translateX(-50%);display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:40px 40px 40px;gap:5px;padding:7px;background:#fff9;border:1px solid #fff8;border-radius:20px;backdrop-filter:blur(9px)}.pad button{border:0;border-radius:12px;background:#fff;color:#66546d;font-size:18px;font-weight:900}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .stop{grid-column:2;grid-row:2;font-size:11px}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}.pad button.active{background:#765d82;color:#fff}.status{position:absolute;left:50%;top:42%;transform:translateX(-50%);padding:5px 9px;border-radius:10px;background:#fff8;color:#6c5772;font-size:10px;font-weight:800;white-space:nowrap}.load-error{display:none;position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:12px;background:#fff;color:#765d82;font-size:12px;font-weight:700}</style></head><body><main class="scene"><div class="scene-layer" id="scene-layer"></div><div class="pet-layer"><div class="pet-anchor" id="petAnchor" data-dir="front"></div></div><div class="ui-layer" id="ui-layer"><div class="status" id="status">idle · front · 扩大地板动线</div><div class="pad"><button class="up" data-act="up">↑</button><button class="left" data-act="left">←</button><button class="stop" data-act="stop">停止</button><button class="right" data-act="right">→</button><button class="down" data-act="down">↓</button></div></div><div class="load-error" id="load-error">场景载入失败</div></main><script>async function getLockedCat(){const u='https://raw.githubusercontent.com/putincat-123/songbook-web/19568a5f92b268b14f93cd6eaa8e1696bbcf7067/tools/miyu_pet_room_v2_layer2_cat.html',h=await fetch(u,{cache:'no-store'}).then(r=>r.text()),d=new DOMParser().parseFromString(h,'text/html'),s=d.querySelector('.pixel-pet');if(!s)throw Error('cat');return document.importNode(s,true)}function makeBack(s){const N='http://www.w3.org/2000/svg';[...s.children].forEach(n=>{if(n.id!=='pixel-shadow')n.dataset.front='1'});const g=document.createElementNS(N,'g');g.id='back-sprite';g.classList.add('motion-bob');g.innerHTML='<g id="back-tail"><path d="M61 85c8 0 14-3 17-8 3-5 2-10-1-12-3-2-6 0-6 4 0 4-2 7-6 9-3 2-6 2-10 2l1 10c2-2 3-3 5-5z" fill="#67483d"/><path d="M62 83c6 0 10-3 12-6 2-3 2-6 0-7-1-1-2 1-2 3 0 4-3 7-8 8-2 1-5 1-8 0l1 6c2-1 3-2 5-4z" fill="#f0bc79"/><rect x="67" y="77" width="5" height="3" fill="#bd6c42"/></g><g id="back-legs"><path d="M31 91h15v7h-3v6h-4v2H29v-2h-3v-5h3v-4h2zM50 91h15v4h3v4h3v5h-3v2H58v-2h-4v-6h-4z" fill="#67483d"/><path d="M34 93h10v5h-3v4h-3v1h-7v-2h2v-4h1zM52 93h10v4h3v4h2v2h-7v-1h-4v-4h-4z" fill="#f0bc79"/></g><g id="back-body"><path d="M31 58h34v4h5v9h3v18h-4v8h-7v5H34v-5h-7v-8h-4V71h3v-9h5z" fill="#67483d"/><path d="M35 61h26v4h5v8h3v14h-4v7h-6v4H37v-4h-6v-7h-4V73h3v-8h5z" fill="#f0bc79"/><rect x="39" y="65" width="18" height="4" fill="#ffd89a"/><rect x="43" y="69" width="10" height="4" fill="#d98c53"/></g><g id="back-arms"><circle cx="27" cy="80" r="9" fill="#67483d"/><circle cx="27" cy="80" r="6" fill="#f0bc79"/><rect x="30" y="70" width="6" height="16" rx="3" fill="#f0bc79"/><circle cx="69" cy="80" r="9" fill="#67483d"/><circle cx="69" cy="80" r="6" fill="#f0bc79"/><rect x="60" y="70" width="6" height="16" rx="3" fill="#f0bc79"/></g><g id="back-head"><path d="M24 23h2V14h4v-4h5v3h5v9h-4v5H24zM56 13h5v-3h5v4h4v9h2v4H58v-5h-4v-9z" fill="#67483d"/><path d="M28 20h2v-5h4v2h3v7h-9zM59 17h3v-2h3v5h2v4h-8z" fill="#e99b91"/><path d="M34 20h28v2h6v3h5v5h4v17h-2v7h-5v5h-7v4H33v-4h-7v-5h-5v-7h-2V30h4v-5h5v-3h6z" fill="#67483d"/><path d="M35 22h26v2h6v4h4v5h3v13h-2v7h-5v4h-6v3H35v-3h-6v-4h-5v-7h-2V33h3v-5h4v-4h6z" fill="#f0bc79"/><path d="M38 24h20v2h6v4h4v5h2v10h-3v6h-5v4h-7v3H41v-3h-7v-4h-5v-6h-3V35h2v-5h4v-4h6z" fill="#ffd89a"/><rect x="47" y="24" width="3" height="11" fill="#bd6c42"/><rect x="40" y="27" width="4" height="8" fill="#bd6c42"/><rect x="54" y="27" width="4" height="8" fill="#bd6c42"/></g><g id="back-bib-tie"><rect x="35" y="58" width="26" height="3" fill="#d06f9d"/><rect x="44" y="59" width="8" height="6" fill="#c95889"/><rect x="36" y="59" width="9" height="7" fill="#f39ab9"/><rect x="51" y="59" width="9" height="7" fill="#f39ab9"/><rect x="39" y="61" width="5" height="3" fill="#ffd0df"/><rect x="52" y="61" width="5" height="3" fill="#ffd0df"/><rect x="45" y="65" width="3" height="8" fill="#f39ab9"/><rect x="49" y="65" width="3" height="8" fill="#e783aa"/></g>';s.appendChild(g)}function roundFrontPaws(s){[['#arm-left',29],['#arm-right',67]].forEach(([sel,cx])=>{const a=s.querySelector(sel);if(!a)return;const N='http://www.w3.org/2000/svg',c=document.createElementNS(N,'circle');c.setAttribute('cx',cx);c.setAttribute('cy','80');c.setAttribute('r','6');c.setAttribute('fill','#f0bc79');c.setAttribute('stroke','#67483d');c.setAttribute('stroke-width','3');a.appendChild(c)})}function face(s,d){const b=d==='back';s.querySelectorAll('[data-front="1"]').forEach(n=>n.style.display=b?'none':'');s.querySelector('#back-sprite').style.display=b?'':'none'}const THEMES={purple:{body:'#a38ab8',w:['#aa8ac2','#c29bbd','#d5a6ae'],f:['#9b80b2','#bd8fae','#d9a493'],so:['#9eb5d7','#778bc2'],cur:'#dba4d2',lamp:'#d77ba7'},muji:{body:'#d9d1bf',w:['#d8dfd4','#e8e2d5','#f2e7d7'],f:['#c9b28f','#d8c4a3','#ead8ba'],so:['#c8d6c8','#aebfae'],cur:'#eee5d5',lamp:'#c9b47e'},sea:{body:'#8eb4b3',w:['#9fc6c5','#b9d5cf','#d7e4d7'],f:['#8eb8b5','#a7c8bd','#c6d7c2'],so:['#9ccdcc','#75aaa9'],cur:'#bde2df',lamp:'#84b8ac'}};function applyTheme(k){const t=THEMES[k]||THEMES.purple,root=document.getElementById('scene-layer');document.body.style.background=t.body;[['w1',t.w[0]],['w2',t.w[1]],['w3',t.w[2]],['f1',t.f[0]],['f2',t.f[1]],['f3',t.f[2]],['so1',t.so[0]],['so2',t.so[1]]].forEach(([id,c])=>root.querySelector('#'+id)?.setAttribute('stop-color',c));root.querySelector('#curL')?.setAttribute('fill',t.cur);root.querySelector('#curR')?.setAttribute('fill',t.cur);root.querySelector('#lamp')?.setAttribute('fill',t.lamp);document.querySelectorAll('.themes button').forEach(b=>b.classList.toggle('on',b.dataset.theme===k));localStorage.setItem('miyu-v2-theme',k)}function expandFloor(r){const direct=[...r.children].filter(n=>n.tagName==='rect');const wall=direct.find(el=>el.getAttribute('width')==='375'&&el.getAttribute('height')==='410');const floor=direct.find(el=>el.getAttribute('y')==='405'&&el.getAttribute('width')==='375');const seam=direct.find(el=>el.getAttribute('y')==='401'&&el.getAttribute('height')==='8');if(wall)wall.setAttribute('height','350');if(floor){floor.setAttribute('y','345');floor.setAttribute('height','322')}if(seam)seam.setAttribute('y','341')}async function scene(){const h=await fetch('miyu_pet_room_v2.html?v=layer1-locked-cat',{cache:'no-store'}).then(r=>r.text()),d=new DOMParser().parseFromString(h,'text/html'),r=d.querySelector('svg.room');if(!r)throw Error('room');r.querySelector('#pet-character-layer')?.remove();const gacha=r.querySelector('#gbody')?.closest('g');if(gacha)gacha.remove();const rug=r.querySelector('#rug1')?.closest('g');if(rug)rug.remove();const cabinetSeed=[...r.querySelectorAll('rect')].find(el=>el.getAttribute('x')==='278'&&el.getAttribute('y')==='326');const cabinet=cabinetSeed?.closest('g');if(cabinet)cabinet.remove();expandFloor(r);r.removeAttribute('class');document.getElementById('scene-layer').replaceChildren(document.importNode(r,true));const n=d.querySelector('nav.themes');if(n){const nav=document.importNode(n,true);document.getElementById('ui-layer').prepend(nav);nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>applyTheme(b.dataset.theme)))}applyTheme(localStorage.getItem('miyu-v2-theme')||'purple')}const p=document.getElementById('petAnchor'),st=document.getElementById('status'),bs=[...document.querySelectorAll('.pad button')];let s,x=45,y=78,state='idle',dir='front',raf=0,last=0,vx=0,vy=0;const SX=9,SY=6.3,MINX=15,MAXX=85,MINY=54,MAXY=84,obs=[{name:'沙发',x1:5,x2:42,y1:58,y2:72.5},{name:'茶几',x1:13,x2:31,y1:68,y2:78},{name:'盆栽',x1:38,x2:46,y1:67,y2:76},{name:'篮子',x1:3,x2:27,y1:77,y2:86}];const hit=(a,b)=>obs.find(o=>a>o.x1&&a<o.x2&&b>o.y1&&b<o.y2);function setDir(d){dir=d;p.dataset.dir=d;face(s,d);st.textContent=(state==='walk'?'walk':'idle')+' · '+d+' · 扩大地板动线'}function stop(){vx=vy=0;state='idle';p.classList.remove('walking');bs.forEach(b=>b.classList.remove('active'));document.querySelector('[data-act="stop"]').classList.add('active');st.textContent='idle · '+dir+' · 扩大地板动线';if(raf){cancelAnimationFrame(raf);raf=0}}function move(d){setDir(d);vx=d==='left'?-SX:d==='right'?SX:0;vy=d==='back'?-SY:d==='front'?SY:0;state='walk';p.classList.add('walking');bs.forEach(b=>b.classList.remove('active'));const m={left:'left',right:'right',back:'up',front:'down'};document.querySelector('[data-act="'+m[d]+'"]').classList.add('active');if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}function tick(n){const dt=Math.min(.04,(n-last)/1000);last=n;const wx=Math.max(MINX,Math.min(MAXX,x+vx*dt)),wy=Math.max(MINY,Math.min(MAXY,y+vy*dt));let bl=null;if(vx){const h=hit(wx,y);h?bl=h:x=wx}if(vy){const h=hit(x,wy);h?bl=h:y=wy}p.style.left=x+'%';p.style.top=y+'%';st.textContent=bl?'blocked · '+bl.name+' · 可沿边移动':'walk · '+dir+' · 扩大地板动线';if((x<=MINX&&vx<0)||(x>=MAXX&&vx>0)||(y<=MINY&&vy<0)||(y>=MAXY&&vy>0))stop();else if(state==='walk')raf=requestAnimationFrame(tick)}bs.forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.act;a==='stop'?stop():move(a==='up'?'back':a==='down'?'front':a)}));(async()=>{try{await scene();s=await getLockedCat();s.id='petSvg';makeBack(s);roundFrontPaws(s);p.replaceChildren(s);face(s,'front');p.style.left=x+'%';p.style.top=y+'%';stop()}catch(e){console.error(e);document.getElementById('load-error').style.display='block'}})();</script></body></html>
