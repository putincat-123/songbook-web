<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿宠物小屋 V2 · 第3层移动</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center;background:#a38ab8}.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}.room,.pet-layer,.ui{position:absolute;inset:0}.room{z-index:10}.pet-layer{z-index:30;pointer-events:none}.ui{z-index:40}.room svg{width:100%;height:100%;display:block}.pet{position:absolute;left:50%;top:68%;width:18%;transform:translate(-50%,-100%);transform-origin:50% 100%;will-change:left,transform}.pet svg{width:100%;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 3px 1px rgba(70,48,62,.18))}.pet.face-left{transform:translate(-50%,-100%) scaleX(-1)}.pet.walking svg{animation:bob .34s steps(2,end) infinite}.pet.walking #arm-left{animation:armA .34s steps(2,end) infinite;transform-origin:30px 75px}.pet.walking #arm-right{animation:armB .34s steps(2,end) infinite;transform-origin:65px 75px}.pet.walking #leg-left{animation:legA .34s steps(2,end) infinite;transform-origin:39px 105px}.pet.walking #leg-right{animation:legB .34s steps(2,end) infinite;transform-origin:57px 105px}.pet.walking #pixel-tail{animation:tail .68s steps(2,end) infinite;transform-origin:66px 80px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}@keyframes armA{0%,100%{transform:translateY(1px)}50%{transform:translateY(-1px)}}@keyframes armB{0%,100%{transform:translateY(-1px)}50%{transform:translateY(1px)}}@keyframes legA{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}@keyframes legB{0%,100%{transform:translateX(1.5px)}50%{transform:translateX(-1.5px)}}@keyframes tail{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}.controls{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:7px;background:#fff9;border:1px solid #fff8;border-radius:18px;backdrop-filter:blur(8px);box-shadow:0 3px 14px #44334a25}.controls button{border:0;border-radius:13px;padding:9px 12px;background:#fff;color:#67566d;font-weight:800;font-size:12px}.status{position:absolute;left:50%;top:46%;transform:translateX(-50%);padding:5px 9px;border-radius:10px;background:#fff9;color:#67566d;font-size:11px;font-weight:800}.error{display:none;position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);background:#fff;padding:8px 12px;border-radius:12px;color:#765d82}</style></head><body><main class="scene"><div class="room" id="room"></div><div class="pet-layer"><div class="pet" id="pet"></div></div><div class="ui"><div class="status" id="status">idle · 脚底锚点固定</div><div class="controls"><button id="left">← 向左走</button><button id="stop">停止</button><button id="right">向右走 →</button></div></div><div class="error" id="error">载入失败</div></main><script>const pet=document.getElementById('pet'),status=document.getElementById('status');let x=50,target=50,raf=0,last=0,state='idle',dir=1;const SPEED=7.5;async function svgFrom(url,selector){const html=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});const d=new DOMParser().parseFromString(html,'text/html'),s=d.querySelector(selector);if(!s)throw Error(selector);return document.importNode(s,true)}function addLayer(svg,id,markup,before){const ns='http://www.w3.org/2000/svg',g=document.createElementNS(ns,'g'),tmp=document.createElementNS(ns,'svg');g.id=id;tmp.innerHTML=markup;while(tmp.firstChild)g.appendChild(tmp.firstChild);const a=before?svg.querySelector(before):null;a?svg.insertBefore(g,a):svg.appendChild(g)}function dressBaby(svg){svg.querySelector('#pixel-accessory')?.remove();addLayer(svg,'pixel-clothes','<path d="M35 59h26v3h4v13h-4v8h-5v5H40v-5h-5v-8h-4V62h4z" fill="#f5b4ca"/><path d="M39 62h18v3h4v9h-4v7h-4v4H43v-4h-4v-7h-4v-9h4z" fill="#ffd8e4"/>','#pixel-head');addLayer(svg,'pixel-accessory','<rect x="34" y="58" width="28" height="3" fill="#d06f9d"/><rect x="44" y="57" width="8" height="7" fill="#67483d"/><rect x="46" y="58" width="4" height="4" fill="#f2bd4e"/><rect x="27" y="18" width="5" height="8" fill="#f39ab9"/><rect x="35" y="18" width="5" height="8" fill="#f39ab9"/><rect x="31" y="20" width="5" height="4" fill="#d05f91"/>')}function setState(s){state=s;pet.classList.toggle('walking',s==='walk');status.textContent=s==='walk'?('walk '+(dir<0?'←':'→')+' · 小步循环'):'idle · 脚底锚点固定'}function face(d){dir=d;pet.classList.toggle('face-left',d<0)}function moveTo(t){target=Math.max(18,Math.min(82,t));face(target<x?-1:1);setState('walk');if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}function tick(now){const dt=Math.min(.04,(now-last)/1000);last=now;const delta=target-x;if(Math.abs(delta)<.25){x=target;pet.style.left=x+'%';setState('idle');raf=0;return}x+=Math.sign(delta)*Math.min(Math.abs(delta),SPEED*dt);pet.style.left=x+'%';raf=requestAnimationFrame(tick)}function stop(){target=x;if(raf){cancelAnimationFrame(raf);raf=0}setState('idle')}async function init(){try{const roomHtml=await fetch('miyu_pet_room_v2.html?v=layer1-locked-cat',{cache:'no-store'}).then(r=>r.text()),rd=new DOMParser().parseFromString(roomHtml,'text/html'),room=rd.querySelector('svg.room');room.querySelector('#pet-character-layer')?.remove();room.removeAttribute('class');document.getElementById('room').replaceChildren(document.importNode(room,true));const base='https://raw.githubusercontent.com/putincat-123/songbook-web/19568a5f92b268b14f93cd6eaa8e1696bbcf7067/tools/miyu_pet_room_v2_layer2_cat.html';const cat=await svgFrom(base,'.pixel-pet');dressBaby(cat);pet.replaceChildren(cat);document.getElementById('left').onclick=()=>moveTo(22);document.getElementById('right').onclick=()=>moveTo(78);document.getElementById('stop').onclick=stop}catch(e){console.error(e);document.getElementById('error').style.display='block'}}init();</script></body></html>
