<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿宠物小屋 V2 · Layer 3 四向移动</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center;background:#a38ab8}.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}.scene-layer,.pet-layer,.ui-layer{position:absolute;inset:0}.scene-layer{z-index:10}.pet-layer{z-index:30;pointer-events:none}.ui-layer{z-index:40}.scene-layer svg{width:100%;height:100%;display:block}.pet-anchor{position:absolute;left:50%;top:72%;width:22%;aspect-ratio:96/120;transform:translate(-50%,-88.3%);will-change:left,top}.pixel-pet{width:100%;height:100%;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 4px 1px rgba(70,48,62,.18));transform-origin:50% 88.3%}.pixel-pet g{transform-box:fill-box}.pet-anchor[data-dir="left"] .pixel-pet{transform:scaleX(-1)}.pet-anchor[data-dir="right"] .pixel-pet,.pet-anchor[data-dir="front"] .pixel-pet,.pet-anchor[data-dir="back"] .pixel-pet{transform:scaleX(1)}.pet-anchor.walking #pixel-head,.pet-anchor.walking #pixel-body,.pet-anchor.walking #pixel-clothes,.pet-anchor.walking #pixel-accessory,.pet-anchor.walking #back-overlay{animation:bob .44s steps(2,end) infinite}.pet-anchor.walking #arm-left{animation:armL .44s steps(2,end) infinite}.pet-anchor.walking #arm-right{animation:armR .44s steps(2,end) infinite}.pet-anchor.walking #leg-left{animation:legL .44s steps(2,end) infinite}.pet-anchor.walking #leg-right{animation:legR .44s steps(2,end) infinite}.pet-anchor.walking #pixel-tail{transform-origin:left center;animation:tail .44s steps(2,end) infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}@keyframes armL{0%,100%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}}@keyframes armR{0%,100%{transform:translate(0,-1px)}50%{transform:translate(-1px,0)}}@keyframes legL{0%,100%{transform:translate(1px,-1px)}50%{transform:translate(-1px,0)}}@keyframes legR{0%,100%{transform:translate(-1px,0)}50%{transform:translate(1px,-1px)}}@keyframes tail{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}.pad{position:absolute;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));transform:translateX(-50%);display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:40px 40px 40px;gap:5px;padding:7px;background:#fff9;border:1px solid #fff8;border-radius:20px;backdrop-filter:blur(9px);box-shadow:0 4px 18px #43334c2a}.pad button{border:0;border-radius:12px;background:#fff;color:#66546d;font-size:18px;font-weight:900}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .stop{grid-column:2;grid-row:2;font-size:11px}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}.pad button.active{background:#765d82;color:#fff}.status{position:absolute;left:50%;top:46%;transform:translateX(-50%);padding:5px 9px;border-radius:10px;background:#fff8;color:#6c5772;font-size:10px;font-weight:800;white-space:nowrap}.load-error{display:none;position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:12px;background:#fff;color:#765d82;font-size:12px;font-weight:700}</style></head><body><main class="scene"><div class="scene-layer" id="scene-layer"></div><div class="pet-layer"><div class="pet-anchor" id="petAnchor" data-dir="front" data-action="idle"></div></div><div class="ui-layer" id="ui-layer"><div class="status" id="status">idle · front · 2D 脚底坐标</div><div class="pad"><button class="up" data-act="up">↑</button><button class="left" data-act="left">←</button><button class="stop" data-act="stop">停止</button><button class="right" data-act="right">→</button><button class="down" data-act="down">↓</button></div></div><div class="load-error" id="load-error">场景载入失败</div></main><script>const themes={purple:{body:'#a38ab8',w:['#aa8ac2','#c29bbd','#d5a6ae'],f:['#9b80b2','#bd8fae','#d9a493'],so:['#9eb5d7','#778bc2'],cab:['#9c75b8','#72589d'],cur:'#dba4d2',lamp:'#d77ba7',rug:['#f4b9bd','#f6d1c5'],g:'#ee819c',top:'#75d1cb'},muji:{body:'#d9d1bf',w:['#d8dfd4','#e8e2d5','#f2e7d7'],f:['#c9b28f','#d8c4a3','#ead8ba'],so:['#c8d6c8','#aebfae'],cab:['#c9a976','#a8875e'],cur:'#eee5d5',lamp:'#c9b47e',rug:['#e5d8bd','#f2ead8'],g:'#d2c4aa',top:'#a9bdb3'},sea:{body:'#8eb4b3',w:['#9fc6c5','#b9d5cf','#d7e4d7'],f:['#8eb8b5','#a7c8bd','#c6d7c2'],so:['#9ccdcc','#75aaa9'],cab:['#c8aa72','#a88b5c'],cur:'#bde2df',lamp:'#84b8ac',rug:['#d8dfc9','#f0ead6'],g:'#e58b72',top:'#73bbb9'}};function applyTheme(k,nav){const s=document.querySelector('#scene-layer svg'),t=themes[k];if(!s||!t)return;document.body.style.background=t.body;[['w1',t.w[0]],['w2',t.w[1]],['w3',t.w[2]],['f1',t.f[0]],['f2',t.f[1]],['f3',t.f[2]],['so1',t.so[0]],['so2',t.so[1]],['c1',t.cab[0]],['c2',t.cab[1]]].forEach(([id,c])=>s.querySelector('#'+id)?.setAttribute('stop-color',c));s.querySelector('#curL')?.setAttribute('fill',t.cur);s.querySelector('#curR')?.setAttribute('fill',t.cur);s.querySelector('#lamp')?.setAttribute('fill',t.lamp);s.querySelector('#rug1')?.setAttribute('fill',t.rug[0]);s.querySelector('#rug2')?.setAttribute('fill',t.rug[1]);s.querySelector('#gbody')?.setAttribute('fill',t.g);s.querySelector('#gtop')?.setAttribute('fill',t.top);nav?.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.theme===k));localStorage.setItem('miyu-v2-theme',k)}async function getLockedCat(){const url='https://raw.githubusercontent.com/putincat-123/songbook-web/19568a5f92b268b14f93cd6eaa8e1696bbcf7067/tools/miyu_pet_room_v2_layer2_cat.html';const html=await fetch(url,{cache:'no-store'}).then(r=>r.text());const d=new DOMParser().parseFromString(html,'text/html'),svg=d.querySelector('.pixel-pet');if(!svg)throw Error('cat');return document.importNode(svg,true)}function addBackOverlay(svg){const ns='http://www.w3.org/2000/svg',g=document.createElementNS(ns,'g');g.id='back-overlay';g.innerHTML='<path d="M30 29h36v4h7v21h-5v7h-8v3H36v-3h-8v-7h-5V33h7z" fill="#f0bc79"/><path d="M34 31h28v3h6v17h-5v6h-7v3H40v-3h-7v-6h-5V34h6z" fill="#ffd89a"/><rect x="46" y="31" width="4" height="10" fill="#bd6c42"/><rect x="39" y="33" width="4" height="7" fill="#bd6c42"/><rect x="53" y="33" width="4" height="7" fill="#bd6c42"/>';svg.appendChild(g);const face=svg.querySelector('#pixel-face'),eyes=svg.querySelector('#pixel-eyes');if(face)face.dataset.front='1';if(eyes)eyes.dataset.front='1'}function setFacing(svg,dir){const back=svg.querySelector('#back-overlay');const frontOnly=svg.querySelectorAll('[data-front="1"]');const isBack=dir==='back';if(back)back.style.display=isBack?'':'none';frontOnly.forEach(n=>n.style.display=isBack?'none':'');const tail=svg.querySelector('#pixel-tail');if(tail)tail.style.opacity=isBack?'1':'.96'}async function mountScene(){const html=await fetch('miyu_pet_room_v2.html?v=layer1-locked-cat',{cache:'no-store'}).then(r=>r.text()),d=new DOMParser().parseFromString(html,'text/html'),room=d.querySelector('svg.room');if(!room)throw Error('room');room.querySelector('#pet-character-layer')?.remove();room.removeAttribute('class');document.getElementById('scene-layer').replaceChildren(document.importNode(room,true));const navSrc=d.querySelector('nav.themes');if(navSrc){const nav=document.importNode(navSrc,true);nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>applyTheme(b.dataset.theme,nav)));document.getElementById('ui-layer').prepend(nav);applyTheme(localStorage.getItem('miyu-v2-theme')||'purple',nav)}}const pet=document.getElementById('petAnchor'),status=document.getElementById('status'),buttons=[...document.querySelectorAll('.pad button')];let svg,x=50,y=72,state='idle',dir='front',raf=0,last=0,vx=0,vy=0;const SPEED_X=9,SPEED_Y=6.3,MIN_X=19,MAX_X=82,MIN_Y=62,MAX_Y=82;const table={x1:13,x2:31,y1:63,y2:72};function collides(nx,ny){return nx>table.x1&&nx<table.x2&&ny>table.y1&&ny<table.y2}function setDir(d){dir=d;pet.dataset.dir=d;setFacing(svg,d);status.textContent=(state==='walk'?'walk':'idle')+' · '+d+' · 2D 脚底坐标'}function setState(s){state=s;pet.dataset.action=s;pet.classList.toggle('walking',s==='walk');buttons.forEach(b=>b.classList.remove('active'));if(s==='idle')document.querySelector('[data-act="stop"]').classList.add('active');status.textContent=(s==='walk'?'walk':'idle')+' · '+dir+' · 2D 脚底坐标';if(s==='walk'&&!raf){last=performance.now();raf=requestAnimationFrame(tick)}if(s==='idle'&&raf){cancelAnimationFrame(raf);raf=0}}function move(d){setDir(d);vx=d==='left'?-SPEED_X:d==='right'?SPEED_X:0;vy=d==='back'?-SPEED_Y:d==='front'?SPEED_Y:0;setState('walk');const map={left:'left',right:'right',back:'up',front:'down'};document.querySelector('[data-act="'+map[d]+'"]').classList.add('active')}function tick(now){const dt=Math.min(.04,(now-last)/1000);last=now;let nx=Math.max(MIN_X,Math.min(MAX_X,x+vx*dt)),ny=Math.max(MIN_Y,Math.min(MAX_Y,y+vy*dt));if(collides(nx,ny)){if(vx<0)nx=table.x2+.5;else if(vx>0)nx=table.x1-.5;if(vy<0)ny=table.y2+.5;else if(vy>0)ny=table.y1-.5}x=nx;y=ny;pet.style.left=x+'%';pet.style.top=y+'%';if((x===MIN_X&&vx<0)||(x===MAX_X&&vx>0)||(y===MIN_Y&&vy<0)||(y===MAX_Y&&vy>0))setState('idle');else if(state==='walk')raf=requestAnimationFrame(tick)}buttons.forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.act;if(a==='stop'){vx=vy=0;setState('idle')}else if(a==='left')move('left');else if(a==='right')move('right');else if(a==='up')move('back');else if(a==='down')move('front')}));(async()=>{try{await mountScene();svg=await getLockedCat();svg.id='petSvg';addBackOverlay(svg);pet.replaceChildren(svg);setFacing(svg,'front');pet.style.left=x+'%';pet.style.top=y+'%';setState('idle')}catch(e){console.error(e);document.getElementById('load-error').style.display='block'}})();</script></body></html>
