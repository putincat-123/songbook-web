<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿宠物小屋 V2 · Layer 3 四向移动</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center;background:#a38ab8}.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}.scene-layer,.pet-layer,.ui-layer{position:absolute;inset:0}.scene-layer{z-index:10}.pet-layer{z-index:30;pointer-events:none}.ui-layer{z-index:40}.scene-layer svg{width:100%;height:100%;display:block}.pet-anchor{position:absolute;left:45%;top:78%;width:22%;aspect-ratio:96/120;transform:translate(-50%,-88.3%);will-change:left,top}.pixel-pet{width:100%;height:100%;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 4px 1px rgba(70,48,62,.18));transform-origin:50% 88.3%}.pixel-pet g{transform-box:fill-box}.pet-anchor[data-dir="left"] .pixel-pet{transform:scaleX(-1)}.pet-anchor.walking .motion-bob{animation:bob .44s steps(2,end) infinite}.pet-anchor.walking #arm-left{animation:armL .44s steps(2,end) infinite}.pet-anchor.walking #arm-right{animation:armR .44s steps(2,end) infinite}.pet-anchor.walking #leg-left{animation:legL .44s steps(2,end) infinite}.pet-anchor.walking #leg-right{animation:legR .44s steps(2,end) infinite}.pet-anchor.walking #pixel-tail{transform-origin:left center;animation:tail .44s steps(2,end) infinite}@keyframes bob{50%{transform:translateY(-1.5px)}}@keyframes armL{50%{transform:translate(1px,-1px)}}@keyframes armR{50%{transform:translate(-1px,0)}}@keyframes legL{50%{transform:translate(-1px,0)}}@keyframes legR{50%{transform:translate(1px,-1px)}}@keyframes tail{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}.pad{position:absolute;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));transform:translateX(-50%);display:grid;grid-template-columns:48px 48px 48p etch('miyu_pet_room_v2.html?v=layer1-locked-cat',{cache:'no-store'}).then(r=>r.text()),d=new DOMParser().parseFromString(h,'text/html'),r=d.querySelector('svg.room');if(!r)throw Error('room');r.querySelector('#pet-character-layer')?.remove();r.removeAttribute('class');document.getElementById('scene-layer').replaceChildren(document.importNode(r,true));const n=d.querySelector('nav.themes');if(n)document.getElementById('ui-layer').prepend(document.importNode(n,true))}const p=document.getElementById('petAnchor'),st=document.getElementById('status'),bs=[...document.querySelectorAll('.pad button')];let s,x=45,y=78,state='idle',dir='front',raf=0,last=0,vx=0,vy=0;const SX=9,SY=6.3,MINX=15,MAXX=85,MINY=61,MAXY=84,obs=[{name:'沙发',x1:5,x2:42,y1:62,y2:72.5},{name:'茶几',x1:13,x2:31,y1:68,y2:78},{name:'盆栽',x1:38,x2:46,y1:71,y2:76},{name:'柜子',x1:72,x2:96,y1:57,y2:72.5},{name:'扭蛋机',x1:49,x2:77,y1:68,y2:84},{name:'篮子',x1:3,x2:27,y1:77,y2:86}];const hit=(a,b)=>obs.find(o=>a>o.x1&&a<o.x2&&b>o.y1&&b<o.y2);function setDir(d){dir=d;p.dataset.dir=d;face(s,d);st.textContent=(state==='walk'?'walk':'idle')+' · '+d+' · 可滑动碰撞'}function stop(){vx=vy=0;state='idle';p.classList.remove('walking');bs.forEach(b=>b.classList.remove('active'));document.querySelector('[data-act="stop"]').classList.add('active');st.textContent='idle · '+dir+' · 可滑动碰撞';if(raf){cancelAnimationFrame(raf);raf=0}}function move(d){setDir(d);vx=d==='left'?-SX:d==='right'?SX:0;vy=d==='back'?-SY:d==='front'?SY:0;state='walk';p.classList.add('walking');bs.forEach(b=>b.classList.remove('active'));const m={left:'left',right:'right',back:'up',front:'down'};document.querySelector('[data-act="'+m[d]+'"]').classList.add('active');if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}function tick(n){const dt=Math.min(.04,(n-last)/1000);last=n,wx=Math.max(MINX,Math.min(MAXX,x+vx*dt)),wy=Math.max(MINY,Math.min(MAXY,y+vy*dt));let bl=null;if(vx){const h=hit(wx,y);h?bl=h:x=wx}if(vy){const h=hit(x,wy);h?bl=h:y=wy}p.style.left=x+'%';p.style.top=y+'%';st.textContent=bl?'blocked · '+bl.name+' · 可沿边移动':'walk · '+dir+' · 可滑动碰撞';if((x<=MINX&&vx<0)||(x>=MAXX&&vx>0)||(y<=MINY&&vy<0)||(y>=MAXY&&vy>0))stop();else if(state==='walk')raf=requestAnimationFrame(tick)}bs.forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.act;a==='stop'?stop():move(a==='up'?'back':a==='down'?'front':a)}));(async()=>{try{await scene();s=await getLockedCat();s.id='petSvg';makeBack(s);p.replaceChildren(s);face(s,'front');p.style.left=x+'%';p.style.top=y+'%';stop()}catch(e){console.error(e);document.getElementById('load-error').style.display='block'}})();</script></body></html>
