<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿宠物小屋 V2 · Layer 3 移动验收</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center;background:#a38ab8}.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}.scene-layer,.pet-layer,.ui-layer{position:absolute;inset:0}.scene-layer{z-index:10}.pet-layer{z-index:30;pointer-events:none}.ui-layer{z-index:40}.scene-layer svg{width:100%;height:100%;display:block}.pet-anchor{position:absolute;left:50%;top:67.2%;width:22%;aspect-ratio:96/120;transform:translate(-50%,-88.3%);will-change:left,top}.pixel-pet{width:100%;height:100%;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 4px 1px rgba(70,48,62,.18));transform:scaleX(var(--dir,1));transform-origin:50% 88.3%}.pixel-pet g{transform-box:fill-box}.pet-anchor.walking #pixel-head,.pet-anchor.walking #pixel-body,.pet-anchor.walking #pixel-clothes,.pet-anchor.walking #pixel-accessory{animation:bob .44s steps(2,end) infinite}.pet-anchor.walking #arm-left{animation:armL .44s steps(2,end) infinite}.pet-anchor.walking #arm-right{animation:armR .44s steps(2,end) infinite}.pet-anchor.walking #leg-left{animation:legL .44s steps(2,end) infinite}.pet-anchor.walking #leg-right{animation:legR .44s steps(2,end) infinite}.pet-anchor.walking #pixel-tail{transform-origin:left center;animation:tail .44s steps(2,end) infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}@keyframes armL{0%,100%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}}@keyframes armR{0%,100%{transform:translate(0,-1px)}50%{transform:translate(-1px,0)}}@keyframes legL{0%,100%{transform:translate(1px,-1px)}50%{transform:translate(-1px,0)}}@keyframes legR{0%,100%{transform:translate(-1px,0)}50%{transform:translate( <button data-act="left">← 左走</button><button data-act="stop">■ 停止</button><button data-act="right">右走 →</button><button data-act="turn">↔ 转向</button></div></div><div class="load-error" id="load-error">场景载入失败</div></main><script>const themes={purple:{body:'#a38ab8',w:['#aa8ac2','#c29bbd','#d5a6ae'],f:['#9b80b2','#bd8fae','#d9a493'],so:['#9eb5d7','#778bc2'],cab:['#9c75b8','#72589d'],cur:'#dba4d2',lamp:'#d77ba7',rug:['#f4b9bd','#f6d1c5'],g:'#ee819c',top:'#75d1cb'},muji:{body:'#d9d1bf',w:['#d8dfd4','#e8e2d5','#f2e7d7'],f:['#c9b28f','#d8c4a3','#ead8ba'],so:['#c8d6c8','#aebfae'],cab:['#c9a976','#a8875e'],cur:'#eee5d5',lamp:'#c9b47e',rug:['#e5d8bd','#f2ead8'],g:'#d2c4aa',top:'#a9bdb3'},sea:{body:'#8eb4b3',w:['#9fc6c5','#b9d5cf','#d7e4d7'],f:['#8eb8b5','#a7c8bd','#c6d7c2'],so:['#9ccdcc','#75aaa9'],cab:['#c8aa72','#a88b5c'],cur:'#bde2df',lamp:'#84b8ac',rug:['#d8dfc9','#f0ead6'],g:'#e58b72',top:'#73bbb9'}};function applyTheme(k,nav){const s=document.querySelector('#scene-layer svg'),t=themes[k];if(!s||!t)return;document.body.style.background=t.body;[['w1',t.w[0]],['w2',t.w[1]],['w3',t.w[2]],['f1',t.f[0]],['f2',t.f[1]],['f3',t.f[2]],['so1',t.so[0]],['so2',t.so[1]],['c1',t.cab[0]],['c2',t.cab[1]]].forEach(([id,c])=>s.querySelector('#'+id)?.setAttribute('stop-color',c));s.querySelector('#curL')?.setAttribute('fill',t.cur);s.querySelector('#curR')?.setAttribute('fill',t.cur);s.querySelector('#lamp')?.setAttribute('fill',t.lamp);s.querySelector('#rug1')?.setAttribute('fill',t.rug[0]);s.querySelector('#rug2')?.setAttribute('fill',t.rug[1]);s.querySelector('#gbody')?.setAttribute('fill',t.g);s.querySelector('#gtop')?.setAttribute('fill',t.top);nav?.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.theme===k));localStorage.setItem('miyu-v2-theme',k)}async function mountScene(){try{const html=await fetch('miyu_pet_room_v2.html?v=layer1-locked-cat',{cache:'no-store'}).then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');const svg=doc.querySelector('svg.room');if(!svg)throw 0;svg.querySelector('#pet-character-layer')?.remove();svg.removeAttribute('class');document.getElementById('scene-layer').replaceChildren(document.importNode(svg,true));const sourceNav=doc.querySelector('nav.themes');if(sourceNav){const nav=document.importNode(sourceNav,true);nav.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>applyTheme(btn.dataset.theme,nav)));document.getElementById('ui-layer').prepend(nav);applyTheme(localStorage.getItem('miyu-v2-theme')||'purple',nav)}}catch(e){document.getElementById('load-error').style.display='block'}}mountScene();const pet=document.getElementById('petAnchor'),svg=document.getElementById('petSvg'),status=document.getElementById('status'),buttons=[...document.querySelectorAll('.motion-controls button')];let x=50,dir=1,state='idle',raf=0,last=0;const SPEED=8.5,MIN_X=27,MAX_X=73;function groundY(px){if(px<=34)return 72.4;if(px>=45)return 67.2;const t=(px-34)/(45-34);return 72.4+(67.2-72.4)*t}function syncPosition(){pet.style.left=x+'%';pet.style.top=groundY(x)+'%'}function setDir(next){dir=next;pet.dataset.direction=dir===1?'right':'left';svg.style.setProperty('--dir',dir);pet.classList.add('turning');clearTimeout(window._turnTimer);window._turnTimer=setTimeout(()=>pet.classList.remove('turning'),180)}function setState(next){state=next;pet.dataset.action=state;pet.classList.toggle('walking',state==='walk');buttons.forEach(b=>b.classList.toggle('active',(b.dataset.act==='left'&&state==='walk'&&dir===-1)||(b.dataset.act==='right'&&state==='walk'&&dir===1)||(b.dataset.act==='stop'&&state==='idle')));status.textContent=(state==='walk'?'walk':'idle')+' · '+(dir===1?'向右':'向左')+' · 地板路径避开家具';if(state==='walk'){last=performance.now();if(!raf)raf=requestAnimationFrame(tick)}else{cancelAnimationFrame(raf);raf=0}}function tick(now){const dt=Math.min(.04,(now-last)/1000);last=now;x+=dir*SPEED*dt;if(x<=MIN_X){x=MIN_X;setDir(1)}else if(x>=MAX_X){x=MAX_X;setDir(-1)}syncPosition();if(state==='walk')raf=requestAnimationFrame(tick);else raf=0}buttons.forEach(btn=>btn.addEventListener('click',()=>{const a=btn.dataset.act;if(a==='left'){setDir(-1);setState('walk')}else if(a==='right'){setDir(1);setState('walk')}else if(a==='stop'){setState('idle')}else if(a==='turn'){setDir(dir*-1);setState('idle')}}));syncPosition();setDir(1);setState('idle');</script></body></html>
