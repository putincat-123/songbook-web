<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿宠物小屋 V2 · Layer 3 四向移动</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center;background:#a38ab8}.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}.scene-layer,.pet-layer,.ui-layer{position:absolute;inset:0}.scene-layer{z-index:10}.pet-layer{z-index:30;pointer-events:none}.ui-layer{z-index:40}.scene-layer svg{width:100%;height:100%;display:block}.pet-anchor{position:absolute;left:50%;top:72%;width:22%;aspect-ratio:96/120;transform:translate(-50%,-88.3%);will-change:left,top}.pixel-pet{width:100%;height:100%;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 4px 1px rgba(70,48,62,.18));transform-origin:50% 88.3%}.pixel-pet g{transform-box:fill-box}.pet-anchor[data-dir="left"] .pixel-pet{transform:scaleX(-1)}.pet-anchor.walking .motion-bob{animation:bob .44s steps(2,end) infinite}.pet-anchor.walking #arm-left{animation:armL .44s steps(2,end) infinite}.pet-anchor.walking #arm-right{animation:armR .44s steps(2,end) infinite}.pet-anchor.walking #leg-left{animation:legL .44s steps(2,end) infinite}.pet-anchor.walking #leg-right{animation:legR .44s steps(2,end) infinite}.pet-anchor.walking #pixel-tail{transform-origin:left center;animation:tail .44s steps(2,end) infinite}@keyframes bob{50%{transform:translateY(-1.5px)}}@keyframes armL{50%{transform:translate(1px,-1px)}}@keyframes armR{50%{transform:translate(-1px,0)}}@keyframes legL{50%{transform:translate(-1px,0)}}@keyframes legR{50%{transform:translate(1px,-1px)}}@keyframes tail{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}.pad{position:absolute;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));transform:translateX(-50%);display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:40px 40px 40px;gap:5px;padding:7px;background:#fff9;border:1px solid #fff8;border-radius:20px;backdrop-filter:blur(9px)}.pad button{border:0;border-radius:12px;background:#fff;color:#66546d;font-size:18px;font-weight:900}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .stop{grid-column:2;grid-row:2;font-size:11px}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}.pad button.active{background:#765d82;color:#fff}.status{position:absolute;left:50%;top:46%;transform:translateX(-50%);padding:5px 9px;border-radius:10px;background:#fff8;color:#6c5772;font-size:10px;font-weight:800;white-space:nowrap}.load-error{display:none;position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:12px;background:#fff;color:#765d82;font-size:12px;font-weight:700}</style></head><body><main class="scene"><div class="scene-layer" id="scene-layer"></div><div class="pet-layer"><div class="pet-anchor" id="petAnchor" data-dir="front" data-action="idle"></div></div><div class="ui-layer" id="ui-layer"><div class="status" id="status">idle · front · 全房碰撞</div><div class="pad"><button class="up" data-act="up">↑</button><button class="left" data-act="left">←</button><button class="stop" data-act="stop">停止</button><button class="right" data-act="right">→</button><button class="down" data-act="down">↓</button></div></div><div class="load-error" id="load-error">场景载入失败</div></main><script>async function getLockedCat(){const url='https://raw.githubusercontent.com/putincat-123/songbook-web/19568a5f92b268b14f93cd6eaa8e1696bbcf7067/tools/miyu_pet_room_v2_layer2_cat.html';const html=await fetch(url,{cache:'no-store'}).then(r=>r.text());const d=new DOMParser().parseFromString(html,'text/html'),svg=d.querySelector('.pixel-pet');if(!svg)throw Error('cat');return document.importNode(svg,true)}function makeBack(svg){const ns='http://www.w3.org/2000/svg';[...svg.children].forEach(n=>{if(n.id!=='pixel-shadow'&&n.id!=='pixel-tail')n.dataset.front='1'});const g=document.createElementNS(ns,'g');g.id='back-sprite';g.classList.add('motion-bob');g.innerHTML='<g id="back-legs"><path d="M31 91h15v7h-3v6h-4v2H29v-2h-3v-5h3v-4h2z" fill="#67483d"/><path d="M34 93h10v5h-3v4h-3v1h-7v-2h2v-4h1z" fill="#f0bc79"/><path d="M50 91h15v4h3v4h3v5h-3v2H58v-2h-4v-6h-4z" fill="#67483d"/><path d="M52 93h10v4h3v4h2v2h-7v-1h-4v-4h-4z" fill="#f0bc79"/></g><g id="back-body"><path d="M31 58h34v4h5v9h3v18h-4v8h-7v5H34v-5h-7v-8h-4V71h3v-9h5z" fill="#67483d"/><path d="M35 61h26v4h5v8h3v14h-4v7h-6v4H37v-4h-6v-7h-4V73h3v-8h5z" fill="#f0bc79"/><rect x="39" y="65" width="18" height="4" fill="#ffd89a"/><rect x="43" y="69" width="10" height="4" fill="#d98c53"/><path d="M32 66h5v25h-4v5h-6v-5h-3V73h3v-5h5z" fill="#f0bc79"/><path d="M64 66h5v2h4v5h3v18h-3v5h-6v-5h-4V66z" fill="#f0bc79"/></g><g id="back-clothes"><path d="M34 59h28v4h4v23h-5v9h-7v4H42v-4h-7v-9h-5V63h4z" fill="#f5b4ca"/><path d="M39 63h18v4h4v17h-4v7h-5v4h-8v-4h-5v-7h-4V67h4z" fill="#ffd8e4"/><rect x="34" y="59" width="28" height="3" fill="#d06f9d"/></g><g id="back-head"><path d="M24 23h2V14h4v-4h5v3h5v9h-4v5H24z" fill="#67483d"/><path d="M56 13h5v-3h5v4h4v9h2v4H58v-5h-4v-9z" fill="#67483d"/><path d="M28 20h2v-5h4v2h3v7h-9z" fill="#e99b91"/><path d="M59 17h3v-2h3v5h2v4h-8z" fill="#e99b91"/><path d="M34 20h28v2h6v3h5v5h4v17h-2v7h-5v5h-7v4H33v-4h-7v-5h-5v-7h-2V30h4v-5h5v-3h6z" fill="#67483d"/><path d="M35 22h26v2h6v4h4v5h3v13h-2v7h-5v4h-6v3H35v-3h-6v-4h-5v-7h-2V33h3v-5h4v-4h6z" fill="#f0bc79"/><path d="M38 24h20v2h6v4h4v5h2v10h-3v6h-5v4h-7v3H41v-3h-7v-4h-5v-6h-3V35h2v-5h4v-4h6z" fill="#ffd89a"/><rect x="47" y="24" width="3" height="11" fill="#bd6c42"/><rect x="40" y="27" width="4" height="8" fill="#bd6c42"/><rect x="54" y="27" width="4" height="8" fill="#bd6c42"/><rect x="31" y="38" width="6" height="3" fill="#dc9055"/><rect x="60" y="38" width="6" height="3" fill="#dc9055"/></g><g id="back-accessory"><rect x="27" y="18" width="5" height="8" fill="#f39ab9"/><rect x="35" y="18" width="5" height="8" fill="#f39ab9"/><rect x="31" y="20" width="5" height="4" fill="#d05f91"/></g>';svg.appendChild(g)}function setFacing(svg,d){const back=d==='back';svg.querySelectorAll('[data-front="1"]').forEach(n=>n.style.display=back?'none':'');svg.querySelector('#back-sprite').style.display=back?'':'none';svg.querySelector('#pixel-tail').style.opacity='1'}async function mountScene(){const html=await fetch('miyu_pet_room_v2.html?v=layer1-locked-cat',{cache:'no-store'}).then(r=>r.text()),d=new DOMParser().parseFromString(html,'text/html'),room=d.querySelector('svg.room');if(!room)throw Error('room');room.querySelector('#pet-character-layer')?.remove();room.removeAttribute('class');document.getElementById('scene-layer').replaceChildren(document.importNode(room,true));const nav=d.querySelector('nav.themes');if(nav){const n=document.importNode(nav,true);document.getElementById('ui-layer').prepend(n)}}const pet=document.getElementById('petAnchor'),status=document.getElementById('status'),buttons=[...document.querySelectorAll('.pad button')];let svg,x=50,y=72,state='idle',dir='front',raf=0,last=0,vx=0,vy=0;const SX=9,SY=6.3,MINX=15,MAXX=85,MINY=61,MAXY=84;const obstacles=[{name:'沙发',x1:5,x2:42,y1:62,y2:72.5},{name:'茶几',x1:13,x2:31,y1:68,y2:78},{name:'盆栽',x1:35,x2:49,y1:66,y2:75},{name:'柜子',x1:72,x2:96,y1:57,y2:72.5},{name:'扭蛋机',x1:49,x2:77,y1:68,y2:84},{name:'篮子',x1:3,x2:27,y1:77,y2:86}];function hit(nx,ny){return obstacles.find(o=>nx>o.x1&&nx<o.x2&&ny>o.y1&&ny<o.y2)}function setDir(d){dir=d;pet.dataset.dir=d;setFacing(svg,d);status.textContent=(state==='walk'?'walk':'idle')+' · '+d+' · 全房碰撞'}function stop(){vx=vy=0;state='idle';pet.classList.remove('walking');buttons.forEach(b=>b.classList.remove('active'));document.querySelector('[data-act="stop"]').classList.add('active');status.textContent='idle · '+dir+' · 全房碰撞';if(raf){cancelAnimationFrame(raf);raf=0}}function move(d){setDir(d);vx=d==='left'?-SX:d==='right'?SX:0;vy=d==='back'?-SY:d==='front'?SY:0;state='walk';pet.classList.add('walking');buttons.forEach(b=>b.classList.remove('active'));const map={left:'left',right:'right',back:'up',front:'down'};document.querySelector('[data-act="'+map[d]+'"]').classList.add('active');if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}function tick(now){const dt=Math.min(.04,(now-last)/1000);last=now;let nx=Math.max(MINX,Math.min(MAXX,x+vx*dt)),ny=Math.max(MINY,Math.min(MAXY,y+vy*dt));const o=hit(nx,ny);if(o){nx=x;ny=y;status.textContent='blocked · '+o.name+' · '+dir}else{x=nx;y=ny;pet.style.left=x+'%';pet.style.top=y+'%'}if((x<=MINX&&vx<0)||(x>=MAXX&&vx>0)||(y<=MINY&&vy<0)||(y>=MAXY&&vy>0))stop();else if(state==='walk')raf=requestAnimationFrame(tick)}buttons.forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.act;if(a==='stop')stop();else move(a==='up'?'back':a==='down'?'front':a)}));(async()=>{try{await mountScene();svg=await getLockedCat();svg.id='petSvg';makeBack(svg);pet.replaceChildren(svg);setFacing(svg,'front');pet.style.left=x+'%';pet.style.top=y+'%';stop()}catch(e){console.error(e);document.getElementById('load-error').style.display='block'}})();</script></body></html>
