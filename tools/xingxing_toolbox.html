<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星星工具箱</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--line:#e6eaf0;--brand:#2563eb;--brand-soft:#eff6ff;--danger:#dc2626;--shadow:0 8px 24px rgba(15,23,42,.06)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1120px;margin:0 auto;padding:20px 16px 40px}.hero{padding:8px 2px 18px}.eyebrow{font-size:12px;font-weight:800;color:var(--brand);letter-spacing:.08em}.title{font-size:30px;font-weight:950;margin:4px 0 6px}.subtitle{color:var(--muted);font-size:14px}.section-title{font-size:18px;font-weight:900;margin:0 0 10px}.section-note{font-size:12px;color:var(--muted);margin:-4px 0 12px}
.tool-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:20px}.tool-card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);transition:.16s}.tool-card:hover{transform:translateY(-1px);border-color:#bfdbfe}.tool-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.tool-icon{font-size:30px}.tool-name{font-size:18px;font-weight:950;margin:10px 0 4px}.tool-desc{font-size:13px;color:var(--muted);line-height:1.6}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:11px;font-weight:900}.arrow{font-size:20px;color:#94a3b8}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-body{padding:16px 18px}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px}.stat-label{font-size:11px;color:var(--muted);font-weight:800}.stat-value{font-size:20px;font-weight:950;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.col-8{grid-column:span 8}.col-4{grid-column:span 4}.col-12{grid-column:span 12}label{display:block;font-size:12px;color:var(--muted);font-weight:800;margin-bottom:6px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;background:#fff}button{border:none;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:850;cursor:pointer}.primary{background:var(--brand);color:#fff}.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:not-allowed}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag-row{display:flex;gap:8px;flex-wrap:wrap}.tag-pill,.filter-btn,.tag-btn{border-radius:999px;padding:7px 10px;font-size:13px;font-weight:800}.tag-pill{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}.filter-btn{background:#fff;color:#475569;border:1px solid #cbd5e1}.filter-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}.tag-btn{background:#f8fafc;color:#334155;border:1px solid #cbd5e1}.tag-btn.active{background:#fff7ed;color:#c2410c;border-color:#fdba74}.song-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;margin-bottom:10px}.song-title{font-size:16px;font-weight:900}.song-meta{font-size:12px;color:var(--muted);margin-top:3px}.dirty{color:var(--danger);font-size:12px;font-weight:800;margin-top:6px}.empty{padding:20px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;background:#fff}.pager{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0}.chip{background:var(--brand-soft);color:#1e3a8a;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800}.sticky-save{position:sticky;bottom:10px;z-index:3;margin-top:12px}.sticky-save button{width:100%;box-shadow:0 8px 20px rgba(37,99,235,.18)}
@media(max-width:760px){.tool-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.col-8,.col-4,.col-12{grid-column:span 12}.app{padding:14px 12px 32px}.title{font-size:26px}.panel-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="eyebrow">XINGXING TOOLBOX</div>
    <div class="title">⭐ 星星工具箱</div>
    <div class="subtitle">常用直播工具與曲庫管理集中在這裡</div>
  </div>

  <div class="section-title">常用工具</div>
  <div class="tool-grid">
    <a class="tool-card" href="./xingxing_chord.html?streamer=xingxing">
      <div class="tool-head"><div><div class="tool-icon">🎸</div><div class="tool-name">AI 吉他扒譜 <span class="badge">NEW</span></div></div><div class="arrow">›</div></div>
      <div class="tool-desc">音頻網址／上傳音檔／邊播邊錄，自動分析 Key、BPM、和弦；支援歌詞彈唱譜、轉調與 Capo 建議。</div>
    </a>
    <a class="tool-card" href="./dayu_export.html?streamer=xingxing&lock=1">
      <div class="tool-head"><div><div class="tool-icon">🐟</div><div class="tool-name">大魚直播助手匯出</div></div><div class="arrow">›</div></div>
      <div class="tool-desc">將星星自己的線上曲庫快速匯出為大魚直播助手可使用的「歌名 歌手」格式。</div>
    </a>
  </div>

  <div class="section-title">曲庫管理</div>
  <div class="section-note">搜尋、分類與標籤集中在同一區，變更完成後一次儲存。</div>

  <div class="panel">
    <div class="panel-head"><strong>曲庫概況</strong><button class="ghost" id="reloadBtn">重新載入</button></div>
    <div class="panel-body"><div class="stats" id="poolSummary"><div class="stat"><div class="stat-label">狀態</div><div class="stat-value" style="font-size:15px">載入中…</div></div></div></div>
  </div>

  <div class="panel">
    <div class="panel-head"><strong>搜尋與分類</strong></div>
    <div class="panel-body">
      <div class="grid">
        <div class="col-12"><label>搜尋歌名 / 歌手 / 標籤</label><input id="searchInput" placeholder="例如：周杰倫、甜歌、開嗓" /></div>
        <div class="col-12"><label>歌曲分類</label><div id="categoryFilterWrap" class="tag-row"></div></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><strong>自訂標籤</strong><span class="chip">點 × 可移除</span></div>
    <div class="panel-body">
      <div id="tagPoolWrap" class="tag-row"><div class="empty">尚未建立標籤池</div></div>
      <div class="grid" style="margin-top:12px"><div class="col-8"><label>新增標籤</label><input id="newTagInput" placeholder="例如：熱歌、拿手、甜歌、開嗓" /></div><div class="col-4"><label>&nbsp;</label><button class="ghost" id="addTagBtn" style="width:100%">＋ 新增標籤</button></div></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><strong>歌曲清單</strong><span class="chip" id="resultChip">—</span></div>
    <div class="panel-body">
      <div class="pager"><button class="ghost" id="prevPageBtn">上一頁</button><span class="chip" id="pageInfo"></span><button class="ghost" id="nextPageBtn">下一頁</button></div>
      <div id="songList"></div>
      <div class="pager"><button class="ghost" id="prevPageBtnBottom">上一頁</button><span class="chip" id="pageInfoBottom"></span><button class="ghost" id="nextPageBtnBottom">下一頁</button></div>
      <div class="sticky-save"><button class="primary" id="saveBtn">儲存變更到 Supabase</button></div>
    </div>
  </div>
</div>
<script>
const API_BASE_URL='https://streamer-songbook.vercel.app',STREAMER=new URLSearchParams(location.search).get('streamer')||'xingxing',$=id=>document.getElementById(id);let songPool=[],tagPool=[],activeCategoryTag='__ALL__',currentPage=1;const PAGE_SIZE=100,dirtySongIds=new Set();
function esc(s=''){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function normalizeSong(s,i){return{id:s.id||'',seq:s.seq??i+1,songName:s.songName||s.name||s.displayName||s.display_name||s.sharedName||'',artist:s.artist||s.displayArtist||s.display_artist||s.sharedArtist||'',customTags:Array.isArray(s.customTags)?s.customTags:Array.isArray(s.custom_tags)?s.custom_tags:[]}}
async function loadSongs(){dirtySongIds.clear();currentPage=1;for(const path of [`../data/${STREAMER}/songs.json?v=${Date.now()}`,`./data/${STREAMER}/songs.json?v=${Date.now()}`]){try{const r=await fetch(path);if(!r.ok)continue;const d=await r.json();if(!Array.isArray(d))continue;songPool=d.map(normalizeSong).filter(x=>x.id&&x.songName);tagPool=[...new Set(songPool.flatMap(x=>x.customTags||[]))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));renderAll();return}catch(e){console.warn(e)}}$('poolSummary').innerHTML='<div class="stat"><div class="stat-label">狀態</div><div class="stat-value" style="font-size:15px">曲庫載入失敗</div></div>'}
function renderAll(){const artists=new Set(songPool.map(x=>x.artist).filter(Boolean)),tagged=songPool.filter(x=>x.customTags.length).length;$('poolSummary').innerHTML=`<div class="stat"><div class="stat-label">主播</div><div class="stat-value" style="font-size:16px">${esc(STREAMER)}</div></div><div class="stat"><div class="stat-label">歌曲</div><div class="stat-value">${songPool.length}</div></div><div class="stat"><div class="stat-label">歌手</div><div class="stat-value">${artists.size}</div></div><div class="stat"><div class="stat-label">已標籤</div><div class="stat-value">${tagged}</div></div><div class="stat"><div class="stat-label">待儲存</div><div class="stat-value">${dirtySongIds.size}</div></div>`;$('tagPoolWrap').innerHTML=tagPool.length?tagPool.map(t=>`<button class="tag-pill" data-action="delete" data-tag="${esc(t)}">${esc(t)} ×</button>`).join(''):'<div class="empty">尚未建立標籤池</div>';$('categoryFilterWrap').innerHTML=`<button class="filter-btn ${activeCategoryTag==='__ALL__'?'active':''}" data-action="filter" data-tag="__ALL__">全部</button>${tagPool.map(t=>`<button class="filter-btn ${activeCategoryTag===t?'active':''}" data-action="filter" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}<button class="filter-btn ${activeCategoryTag==='__UNTAGGED__'?'active':''}" data-action="filter" data-tag="__UNTAGGED__">未標籤</button>`;renderSongList()}
function filtered(){const k=$('searchInput').value.trim().toLowerCase();return songPool.filter(s=>{const tags=s.customTags||[],cat=activeCategoryTag==='__ALL__'||(activeCategoryTag==='__UNTAGGED__'?tags.length===0:tags.includes(activeCategoryTag));return cat&&(!k||[s.songName,s.artist,...tags].join(' ').toLowerCase().includes(k))})}
function renderSongList(){const f=filtered(),pages=Math.max(1,Math.ceil(f.length/PAGE_SIZE));currentPage=Math.min(Math.max(1,currentPage),pages);const start=(currentPage-1)*PAGE_SIZE,list=f.slice(start,start+PAGE_SIZE),info=`第 ${currentPage} / ${pages} 頁｜共 ${f.length} 首`;$('pageInfo').textContent=info;$('pageInfoBottom').textContent=info;$('resultChip').textContent=`${f.length} 首`;$('prevPageBtn').disabled=$('prevPageBtnBottom').disabled=currentPage<=1;$('nextPageBtn').disabled=$('nextPageBtnBottom').disabled=currentPage>=pages;$('songList').innerHTML=list.map(s=>`<div class="song-card"><div class="song-title">${esc(s.seq)}. ${esc(s.songName)}</div><div class="song-meta">歌手：${esc(s.artist||'未知歌手')}</div>${dirtySongIds.has(s.id)?'<div class="dirty">● 尚未儲存</div>':''}<div class="tag-row" style="margin-top:10px">${tagPool.map(t=>`<button class="tag-btn ${(s.customTags||[]).includes(t)?'active':''}" data-action="toggle" data-id="${esc(s.id)}" data-tag="${esc(t)}">${(s.customTags||[]).includes(t)?'✓ ':'+ '}${esc(t)}</button>`).join('')}</div></div>`).join('')||'<div class="empty">查無符合歌曲</div>'}
function addTag(){const t=$('newTagInput').value.trim();if(!t)return;if(!tagPool.includes(t))tagPool.push(t);$('newTagInput').value='';renderAll()}
async function save(){for(const id of [...dirtySongIds]){const s=songPool.find(x=>x.id===id);const r=await fetch(`${API_BASE_URL}/api/admin/pool-songs/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({custom_tags:s.customTags||[]})});if(!r.ok)throw new Error(`PATCH failed ${r.status}`)}dirtySongIds.clear();renderAll();alert('已儲存變更')}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='filter'){activeCategoryTag=b.dataset.tag;currentPage=1;renderAll()}else if(a==='toggle'){const s=songPool.find(x=>x.id===b.dataset.id);const t=b.dataset.tag;s.customTags=(s.customTags||[]).includes(t)?s.customTags.filter(x=>x!==t):[...(s.customTags||[]),t];dirtySongIds.add(s.id);renderAll()}else if(a==='delete'){const t=b.dataset.tag;tagPool=tagPool.filter(x=>x!==t);songPool.forEach(s=>{if((s.customTags||[]).includes(t)){s.customTags=s.customTags.filter(x=>x!==t);dirtySongIds.add(s.id)}});renderAll()}});
$('addTagBtn').onclick=addTag;$('newTagInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTag()});$('searchInput').oninput=()=>{currentPage=1;renderSongList()};$('reloadBtn').onclick=loadSongs;$('saveBtn').onclick=()=>save().catch(e=>alert(e.message));$('prevPageBtn').onclick=$('prevPageBtnBottom').onclick=()=>{currentPage--;renderSongList()};$('nextPageBtn').onclick=$('nextPageBtnBottom').onclick=()=>{currentPage++;renderSongList()};loadSongs();
</script>
</body>
</html>
