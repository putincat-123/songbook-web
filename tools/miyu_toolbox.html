<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>miyu工具箱</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--soft:#eff6ff;--shadow:0 6px 20px rgba(15,23,42,.08);--purple:#7c3aed}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1080px;margin:0 auto;padding:16px 16px 50px}.title{font-size:28px;font-weight:900;margin:6px 0 4px}.subtitle{font-size:13px;color:var(--muted);margin-bottom:14px}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:9px 0 11px;background:rgba(246,248,251,.96);backdrop-filter:blur(8px);-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
button{font:inherit}.tab-btn,.sub-btn,.tool-btn,.artist-chip{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}.tab-btn.active,.sub-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.card h2{font-size:19px;margin:0}.hint{font-size:13px;color:var(--muted);line-height:1.6}.subtabs,.artist-chips,.blind-actions{display:flex;gap:8px;overflow-x:auto;flex-wrap:wrap}.frame-wrap{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}iframe{display:block;width:100%;border:0;min-height:760px;background:#fff}.search-frame{min-height:900px}
.daily-hero{background:linear-gradient(135deg,#eff6ff,#fff 62%);border-color:#bfdbfe}.daily-date{font-size:12px;font-weight:900;color:#2563eb;letter-spacing:.08em}.daily-groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.daily-group{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}.daily-group-head{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:#f8fafc;border-bottom:1px solid var(--line);font-weight:900}.daily-count{font-size:12px;color:var(--muted)}.daily-song{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 11px;border-bottom:1px solid #f1f5f9}.daily-song:last-child{border-bottom:none}.daily-num{font-size:12px;color:#94a3b8;font-weight:900}.daily-name{font-size:14px;font-weight:900;line-height:1.35;word-break:break-word}.daily-artist{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:600}.daily-copy{border:1px solid #bae6fd;background:#f0f9ff;color:#0284c7;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;cursor:pointer}.daily-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.daily-empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;background:#fff}
.artist-box{background:linear-gradient(135deg,#f5f3ff,#fff 62%);border-color:#ddd6fe}.artist-form{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin-top:12px}.artist-form input{min-width:0;width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:16px;outline:none}.artist-form input:focus{border-color:#c4b5fd;box-shadow:0 0 0 3px rgba(196,181,253,.28)}.tool-btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.tool-btn.soft{background:#f5f3ff;border-color:#ddd6fe;color:#6d28d9}.artist-chip{padding:7px 11px;font-size:13px}.artist-chip:hover{border-color:#c4b5fd;background:#faf5ff}.artist-status{margin-top:10px;font-size:13px;font-weight:800;color:#6d28d9}.artist-result{display:none;margin-top:12px;padding:18px;border:1px dashed #c4b5fd;border-radius:18px;text-align:center;background:#fff}.artist-result.show{display:block}.artist-result .song{font-size:27px;font-weight:950;line-height:1.3;word-break:break-word}.artist-result .singer{margin-top:6px;color:var(--muted);font-size:14px}.artist-result .round{margin-top:7px;color:#7c3aed;font-size:12px;font-weight:800}.blind-actions{justify-content:center;margin-top:14px}.copy-note{font-size:12px;color:var(--muted);margin-top:9px}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:9999;background:rgba(15,23,42,.92);color:#fff;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:820px){.daily-groups{grid-template-columns:1fr}}
@media(max-width:720px){.app{padding:12px 10px 80px}.title{font-size:24px}.tabs{margin:0 -2px}.tab-btn,.sub-btn{padding:9px 12px;font-size:13px}.card{padding:12px}.frame-wrap{border-radius:14px}iframe{min-height:820px}.search-frame{min-height:1000px}.artist-form{grid-template-columns:1fr}.artist-form button{width:100%;min-height:46px}.artist-result .song{font-size:24px}.daily-song{grid-template-columns:24px minmax(0,1fr) auto}}
</style>
</head>
<body>
<div class="app">
  <div class="title">miyu工具箱</div>
  <div class="subtitle">点歌与直播辅助工具</div>
  <nav class="tabs" aria-label="工具分类">
    <button class="tab-btn active" data-tab="overview">点歌概况</button><button class="tab-btn" data-tab="daily">每日推荐</button><button class="tab-btn" data-tab="songSearch">曲库查询</button><button class="tab-btn" data-tab="blind">盲盒点歌</button><button class="tab-btn" data-tab="hot">热门推荐</button><button class="tab-btn" data-tab="data">资料工具</button>
  </nav>
  <section id="overview" class="panel active">
    <div class="card"><div class="card-head"><div><h2>点歌概况</h2><div class="hint">把日常歌单维护与点歌统计收在一起，需要时再展开。</div></div></div><div class="subtabs"><button class="sub-btn active" data-overview="importPanel">歌单汇入</button><button class="sub-btn" data-overview="dashboardPanel">Dashboard</button></div></div>
    <div class="frame-wrap"><iframe id="overviewFrame" src="./miyu_toolbox_legacy.html?embed=1" title="点歌概况"></iframe></div>
  </section>
  <section id="daily" class="panel">
    <div class="card daily-hero">
      <div class="card-head"><div><div class="daily-date" id="dailyDate">TODAY</div><h2>🎧 今日推荐歌单</h2><div class="hint">每天从主播曲库自动挑选约 10 首，尽量分布在 2–3 种不同曲风。同一天推荐固定，隔天自动换一组。</div></div></div>
      <div class="daily-tools"><button class="tool-btn primary" id="copyDailyBtn">复制全部歌名</button><span class="hint" id="dailySummary">正在载入今日推荐…</span></div>
    </div>
    <div id="dailyGroups" class="daily-groups"><div class="daily-empty">正在从曲库准备今日推荐…</div></div>
  </section>
  <section id="songSearch" class="panel">
    <div class="card"><div class="card-head"><div><h2>曲库查询</h2><div class="hint">与小耳朵使用的歌曲查询共用同一套歌单与筛选方式；工具箱内的复制只复制歌名，方便直接贴到播放器。</div></div></div></div>
    <div class="frame-wrap"><iframe id="searchFrame" class="search-frame" src="../?streamer=miyu&toolbox=1" title="曲库查询"></iframe></div>
  </section>
  <section id="blind" class="panel">
    <div class="card artist-box">
      <div class="card-head"><div><h2>🎤 歌手盲盒</h2><div class="hint">选一个歌手开盒；同一轮不会重复，抽完才重新洗牌。也可以让系统先随机歌手，再开歌曲盒。</div></div></div>
      <div class="artist-chips" id="artistChips"><span class="hint">正在载入常用歌手…</span></div>
      <div class="artist-form"><input id="artistBoxInput" list="artistOptions" placeholder="输入歌手，例如：周杰伦" autocomplete="off"><datalist id="artistOptions"></datalist><button class="tool-btn primary" id="artistOpenBtn">🎁 开盒</button><button class="tool-btn soft" id="randomArtistBtn">✨ 随机歌手</button></div>
      <div class="artist-status" id="artistBoxStatus">曲库载入中…</div>
      <div class="artist-result" id="artistBoxResult"><div class="song" id="artistBoxSong">—</div><div class="singer" id="artistBoxSinger"></div><div class="round" id="artistBoxRound"></div><div class="blind-actions"><button class="tool-btn primary" id="artistAgainBtn">🎲 再抽一首</button><button class="tool-btn soft" id="artistCopyBtn">复制歌名</button><button class="tool-btn" id="artistChangeBtn">换歌手</button></div><div class="copy-note">复制内容仅包含歌名，不附加「点歌」或歌手。</div></div>
    </div>
    <div class="frame-wrap"><iframe id="blindFrame" src="./miyu_toolbox_legacy.html?embed=1#blindPanel" title="盲盒点歌"></iframe></div>
  </section>
  <section id="hot" class="panel"><div class="frame-wrap"><iframe id="hotFrame" src="./miyu_toolbox_legacy.html?embed=1#hotRecommendPanel" title="热门推荐"></iframe></div></section>
  <section id="data" class="panel"><div class="frame-wrap"><iframe id="dataFrame" src="./miyu_toolbox_legacy.html?embed=1#dataPanel" title="资料工具"></iframe></div></section>
</div>
<div id="toast" class="toast"></div>
<script>
(() => {
  const qs=new URLSearchParams(location.search),streamer=qs.get('streamer')||'miyu';
  const tabs=[...document.querySelectorAll('.tab-btn')],panels=[...document.querySelectorAll('.panel')];
  const legacyMap={blindFrame:'blindPanel',hotFrame:'hotRecommendPanel',dataFrame:'dataPanel'};
  const $=id=>document.getElementById(id);
  function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.remove('show'),1400)}
  async function copyName(name){name=String(name||'').replace(/^点歌\s*/,'').trim();if(!name)return;try{await navigator.clipboard.writeText(name)}catch(e){const ta=document.createElement('textarea');ta.value=name;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast('✅ 已复制：'+name)}
  async function copyPlain(text,msg){if(!text)return;try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}toast(msg||'✅ 已复制')}
  function showMain(id){tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===id));panels.forEach(p=>p.classList.toggle('active',p.id===id));const u=new URL(location.href);u.searchParams.set('streamer',streamer);id==='overview'?u.searchParams.delete('tool'):u.searchParams.set('tool',id);history.replaceState({},'',u);const frame=document.querySelector('#'+id+' iframe');if(frame)setTimeout(()=>resizeFrame(frame),80)}
  tabs.forEach(b=>b.addEventListener('click',()=>showMain(b.dataset.tab)));
  function baseClean(doc){const app=doc.querySelector('.app');if(app){app.style.maxWidth='none';app.style.padding='12px'}const title=doc.querySelector('.title');if(title)title.style.display='none';const subtitle=doc.querySelector('.subtitle');if(subtitle)subtitle.style.display='none';const t=doc.querySelector('.tabs');if(t)t.style.display='none';doc.body.style.background='#fff'}
  function frameCopyButton(doc,titleEl){if(!titleEl||!titleEl.textContent.trim())return;let btn=titleEl.parentElement&&titleEl.parentElement.querySelector(':scope > .toolbox-copy-name');if(!btn){btn=doc.createElement('button');btn.type='button';btn.className='toolbox-copy-name';btn.textContent='复制歌名';btn.style.cssText='margin-left:8px;border:1px solid #bae6fd;background:#f0f9ff;color:#0284c7;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;cursor:pointer;vertical-align:middle';titleEl.insertAdjacentElement('afterend',btn);btn.addEventListener('click',()=>copyName(btn.dataset.song||''))}btn.dataset.song=titleEl.textContent.trim().replace(/^点歌\s*/,'')}
  function decorateFrame(frame){try{const doc=frame.contentDocument;if(!doc)return;doc.querySelectorAll('.copy-btn[data-copy]').forEach(btn=>{btn.dataset.copy=String(btn.dataset.copy||'').replace(/^点歌\s*/,'').trim();btn.textContent='复制歌名'});doc.querySelectorAll('#numberSong,.hot-title,.preview-title').forEach(el=>frameCopyButton(doc,el));doc.querySelectorAll('#topSongs tbody tr td:first-child,#topSongs tr td:first-child').forEach(el=>frameCopyButton(doc,el));}catch(e){}}
  function showLegacyPanel(frame,panelId,{hideBlindExtras=false}={}){try{const doc=frame.contentDocument,targetBtn=doc.querySelector('.tab-btn[data-tab="'+panelId+'"]');if(targetBtn)targetBtn.click();baseClean(doc);doc.querySelectorAll('.panel').forEach(p=>{p.classList.remove('active');p.style.display='none'});const panel=doc.getElementById(panelId);if(panel){panel.classList.add('active');panel.style.display='block'}if(hideBlindExtras&&panel){panel.querySelectorAll('.card').forEach(card=>{const h=card.querySelector('h3');const text=h?h.textContent.trim():'';if(text.includes('曲庫搜尋')||text.includes('歌手盲盒'))card.style.display='none'})}decorateFrame(frame);resizeFrame(frame);observeFrame(frame)}catch(e){console.warn('embed panel failed',e)}}
  function cleanSearchFrame(frame){try{const doc=frame.contentDocument,app=doc.querySelector('.app');if(app){app.style.maxWidth='none';app.style.padding='12px'}const hero=doc.querySelector('.hero');if(hero){const link=doc.getElementById('liveLink');if(link)link.style.display='none'}const footer=doc.querySelector('.footer');if(footer)footer.style.display='none';doc.body.style.background='#fff';decorateFrame(frame);resizeFrame(frame);observeFrame(frame)}catch(e){console.warn('search embed failed',e)}}
  function resizeFrame(frame){try{const h=Math.max(720,frame.contentDocument.documentElement.scrollHeight,frame.contentDocument.body.scrollHeight);frame.style.height=(h+12)+'px'}catch(e){}}
  function observeFrame(frame){try{if(frame._observer)return;let busy=false;const obs=new MutationObserver(()=>{if(busy)return;busy=true;requestAnimationFrame(()=>{decorateFrame(frame);resizeFrame(frame);busy=false})});obs.observe(frame.contentDocument.body,{subtree:true,childList:true,characterData:true});frame._observer=obs;frame.contentWindow.addEventListener('resize',()=>resizeFrame(frame))}catch(e){}}
  const overviewFrame=$('overviewFrame');let overviewPanel='importPanel';overviewFrame.addEventListener('load',()=>showLegacyPanel(overviewFrame,overviewPanel));document.querySelectorAll('.sub-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.sub-btn').forEach(x=>x.classList.toggle('active',x===btn));overviewPanel=btn.dataset.overview;showLegacyPanel(overviewFrame,overviewPanel)}));
  Object.entries(legacyMap).forEach(([frameId,panelId])=>{const frame=$(frameId);frame.addEventListener('load',()=>showLegacyPanel(frame,panelId,{hideBlindExtras:panelId==='blindPanel'}))});
  const searchFrame=$('searchFrame');searchFrame.src='../?streamer='+encodeURIComponent(streamer)+'&toolbox=1';searchFrame.addEventListener('load',()=>cleanSearchFrame(searchFrame));

  let songPool=[],artistMap=new Map(),artistBags=new Map(),activeArtists=[],activeKey='',currentSong=null,dailySongs=[];
  function unwrap(raw){return Array.isArray(raw)?raw:(raw&&Array.isArray(raw.songs)?raw.songs:(raw&&Array.isArray(raw.data)?raw.data:[]))}
  function normSong(s,i){const name=String(s.name||s.songName||s.title||'').trim(),artist=String(s.artist||s.singer||s.artistName||'').trim(),style=String(s.style||'').trim();return name?{id:String(s.id||i),name,artist,style}:null}
  function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function seedFrom(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
  function seededShuffle(arr,seed){arr=[...arr];let x=seed>>>0;const rnd=()=>{x+=0x6D2B79F5;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
  function localDateKey(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
  function splitStyles(v){return String(v||'').split(/[，,、/|]+/).map(x=>x.trim()).filter(Boolean)}
  function buildDaily(){const dateKey=localDateKey();$('dailyDate').textContent=dateKey.replaceAll('-',' / ');const styleMap=new Map();songPool.forEach(s=>splitStyles(s.style).forEach(st=>{if(!styleMap.has(st))styleMap.set(st,[]);styleMap.get(st).push(s)}));let candidates=[...styleMap.entries()].filter(([,arr])=>arr.length>=3);if(candidates.length<2){$('dailyGroups').innerHTML='<div class="daily-empty">目前曲风标签不足，至少需要 2 种有足够歌曲的曲风才能生成每日推荐。</div>';$('dailySummary').textContent='曲风标签不足';dailySongs=[];return}candidates=seededShuffle(candidates,seedFrom(streamer+'|styles|'+dateKey));const styleCount=candidates.length>=3?3:2,chosen=candidates.slice(0,styleCount),targets=styleCount===3?[4,3,3]:[5,5],used=new Set(),groups=[];chosen.forEach(([style,arr],gi)=>{const pool=seededShuffle(arr,seedFrom(streamer+'|'+dateKey+'|'+style));const picks=[];for(const s of pool){if(!used.has(s.id)){picks.push(s);used.add(s.id)}if(picks.length>=targets[gi])break}groups.push({style,picks})});let total=groups.reduce((n,g)=>n+g.picks.length,0);if(total<10){const fallback=seededShuffle(songPool,seedFrom(streamer+'|fallback|'+dateKey));for(const s of fallback){if(total>=10)break;if(used.has(s.id))continue;let g=groups.slice().sort((a,b)=>a.picks.length-b.picks.length)[0];g.picks.push(s);used.add(s.id);total++}}dailySongs=groups.flatMap(g=>g.picks);$('dailySummary').textContent=groups.map(g=>g.style+' '+g.picks.length+' 首').join(' · ')+' · 共 '+dailySongs.length+' 首';$('dailyGroups').innerHTML=groups.map(g=>'<section class="daily-group"><div class="daily-group-head"><span>'+escapeHtml(g.style)+'</span><span class="daily-count">'+g.picks.length+' 首</span></div>'+g.picks.map((s,i)=>'<div class="daily-song"><span class="daily-num">'+String(i+1).padStart(2,'0')+'</span><div><div class="daily-name">'+escapeHtml(s.name)+'</div><span class="daily-artist">'+escapeHtml(s.artist||'—')+'</span></div><button class="daily-copy" type="button" data-daily-copy="'+escapeAttr(s.name)+'">复制</button></div>').join('')+'</section>').join('');$('dailyGroups').querySelectorAll('[data-daily-copy]').forEach(b=>b.addEventListener('click',()=>copyName(b.dataset.dailyCopy)))}
  function escapeHtml(v){return String(v==null?'':v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
  function escapeAttr(v){return escapeHtml(v).replaceAll('\n',' ')}
  function buildArtists(){artistMap=new Map();songPool.forEach(s=>{if(!s.artist)return;const parts=s.artist.split(/[、,&，/]+/).map(x=>x.trim()).filter(Boolean);(parts.length?parts:[s.artist]).forEach(a=>{if(!artistMap.has(a))artistMap.set(a,[]);artistMap.get(a).push(s)})});const sorted=[...artistMap.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'zh-Hans-CN'));$('artistOptions').innerHTML=sorted.map(([a])=>'<option value="'+a.replaceAll('&','&amp;').replaceAll('"','&quot;')+'"></option>').join('');const quick=sorted.filter(([,arr])=>arr.length>=3).slice(0,10);$('artistChips').innerHTML=quick.map(([a,arr])=>'<button class="artist-chip" type="button" data-artist="'+a.replaceAll('&','&amp;').replaceAll('"','&quot;')+'">'+a+' · '+arr.length+'</button>').join('')||'<span class="hint">暂无可快捷选择的歌手</span>';$('artistChips').querySelectorAll('[data-artist]').forEach(b=>b.addEventListener('click',()=>{$('artistBoxInput').value=b.dataset.artist;prepareArtist(b.dataset.artist)}));$('artistBoxStatus').textContent='已载入 '+songPool.length+' 首歌 · '+artistMap.size+' 位歌手'}
  function resolveArtists(term){term=String(term||'').trim();if(!term)return[];if(artistMap.has(term))return[term];const low=term.toLowerCase();return[...artistMap.keys()].filter(a=>a.toLowerCase().includes(low)).slice(0,8)}
  function prepareArtist(term){const names=resolveArtists(term);if(!names.length){activeArtists=[];activeKey='';$('artistBoxStatus').textContent='找不到这个歌手，可以换个关键词试试';return false}activeArtists=names;activeKey=names.sort().join('|');const total=[...new Map(names.flatMap(a=>artistMap.get(a)||[]).map(s=>[s.id,s])).values()].length;const bag=artistBags.get(activeKey);$('artistBoxStatus').textContent=(names.length===1?names[0]:names.join(' / '))+' · 曲库 '+total+' 首 · 本轮剩 '+(bag?bag.length:total)+' 首';return true}
  function artistSongs(){return[...new Map(activeArtists.flatMap(a=>artistMap.get(a)||[]).map(s=>[s.id,s])).values()]}
  function drawArtistSong(){if(!prepareArtist($('artistBoxInput').value))return;const pool=artistSongs();if(!pool.length)return;let bag=artistBags.get(activeKey);if(!bag||!bag.length)bag=shuffle(pool.map((_,i)=>i));const idx=bag.pop();artistBags.set(activeKey,bag);currentSong=pool[idx];$('artistBoxSong').textContent=currentSong.name;$('artistBoxSinger').textContent=currentSong.artist||activeArtists.join(' / ');$('artistBoxRound').textContent='本轮剩余 '+bag.length+' / '+pool.length+' 首';$('artistBoxResult').classList.add('show');$('artistBoxStatus').textContent=(activeArtists.length===1?activeArtists[0]:activeArtists.join(' / '))+' · 曲库 '+pool.length+' 首 · 本轮剩 '+bag.length+' 首'}
  async function loadSongPool(){try{const res=await fetch('../data/'+encodeURIComponent(streamer)+'/songs.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);songPool=unwrap(await res.json()).map(normSong).filter(Boolean);buildArtists();buildDaily()}catch(e){console.error(e);$('artistBoxStatus').textContent='曲库载入失败，请稍后刷新重试';$('artistChips').innerHTML='<span class="hint">曲库载入失败</span>';$('dailySummary').textContent='曲库载入失败';$('dailyGroups').innerHTML='<div class="daily-empty">曲库载入失败，请稍后刷新重试。</div>'}}
  $('artistOpenBtn').addEventListener('click',drawArtistSong);$('artistAgainBtn').addEventListener('click',drawArtistSong);$('artistCopyBtn').addEventListener('click',()=>currentSong&&copyName(currentSong.name));$('artistChangeBtn').addEventListener('click',()=>{$('artistBoxInput').value='';$('artistBoxInput').focus();$('artistBoxResult').classList.remove('show');activeArtists=[];activeKey='';$('artistBoxStatus').textContent='请选择或输入一个歌手'});$('randomArtistBtn').addEventListener('click',()=>{const candidates=[...artistMap.entries()].filter(([,arr])=>arr.length>=3);if(!candidates.length)return;const [name]=candidates[Math.floor(Math.random()*candidates.length)];$('artistBoxInput').value=name;prepareArtist(name);drawArtistSong()});$('artistBoxInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();drawArtistSong()}});$('copyDailyBtn').addEventListener('click',()=>copyPlain(dailySongs.map(s=>s.name).join('\n'),'✅ 今日推荐歌名已全部复制'));
  loadSongPool();const initial=qs.get('tool');if(initial&&document.getElementById(initial))showMain(initial);
})();
</script>
</body>
