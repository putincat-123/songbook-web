<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>miyu工具箱</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--soft:#eff6ff;--shadow:0 6px 20px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1080px;margin:0 auto;padding:16px 16px 50px}.title{font-size:28px;font-weight:900;margin:6px 0 4px}.subtitle{font-size:13px;color:var(--muted);margin-bottom:14px}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:9px 0 11px;background:rgba(246,248,251,.96);backdrop-filter:blur(8px);-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
.tab-btn,.sub-btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:10px 14px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}.tab-btn.active,.sub-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.card h2{font-size:19px;margin:0}.hint{font-size:13px;color:var(--muted);line-height:1.6}.subtabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.frame-wrap{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}iframe{display:block;width:100%;border:0;min-height:760px;background:#fff}
.search-frame{min-height:900px}
@media(max-width:720px){.app{padding:12px 10px 80px}.title{font-size:24px}.tabs{margin:0 -2px}.tab-btn,.sub-btn{padding:9px 12px;font-size:13px}.card{padding:12px}.frame-wrap{border-radius:14px}iframe{min-height:820px}.search-frame{min-height:1000px}}
</style>
</head>
<body>
<div class="app">
  <div class="title">miyu工具箱</div>
  <div class="subtitle">点歌与直播辅助工具</div>

  <nav class="tabs" aria-label="工具分类">
    <button class="tab-btn active" data-tab="overview">点歌概况</button>
    <button class="tab-btn" data-tab="songSearch">曲库查询</button>
    <button class="tab-btn" data-tab="blind">盲盒点歌</button>
    <button class="tab-btn" data-tab="hot">热门推荐</button>
    <button class="tab-btn" data-tab="data">资料工具</button>
  </nav>

  <section id="overview" class="panel active">
    <div class="card">
      <div class="card-head"><div><h2>点歌概况</h2><div class="hint">把日常歌单维护与点歌统计收在一起，需要时再展开。</div></div></div>
      <div class="subtabs">
        <button class="sub-btn active" data-overview="importPanel">歌单汇入</button>
        <button class="sub-btn" data-overview="dashboardPanel">Dashboard</button>
      </div>
    </div>
    <div class="frame-wrap"><iframe id="overviewFrame" src="./miyu_toolbox_legacy.html?embed=1" title="点歌概况"></iframe></div>
  </section>

  <section id="songSearch" class="panel">
    <div class="card">
      <div class="card-head"><div><h2>曲库查询</h2><div class="hint">与小耳朵使用的歌曲查询共用同一套歌单与筛选方式，包含近期新增、曲风、搜索与随机点歌。</div></div></div>
    </div>
    <div class="frame-wrap"><iframe id="searchFrame" class="search-frame" src="../?streamer=miyu&toolbox=1" title="曲库查询"></iframe></div>
  </section>

  <section id="blind" class="panel">
    <div class="frame-wrap"><iframe id="blindFrame" src="./miyu_toolbox_legacy.html?embed=1#blindPanel" title="盲盒点歌"></iframe></div>
  </section>

  <section id="hot" class="panel">
    <div class="frame-wrap"><iframe id="hotFrame" src="./miyu_toolbox_legacy.html?embed=1#hotRecommendPanel" title="热门推荐"></iframe></div>
  </section>

  <section id="data" class="panel">
    <div class="frame-wrap"><iframe id="dataFrame" src="./miyu_toolbox_legacy.html?embed=1#dataPanel" title="资料工具"></iframe></div>
  </section>
</div>
<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const streamer = qs.get('streamer') || 'miyu';
  const tabs = [...document.querySelectorAll('.tab-btn')];
  const panels = [...document.querySelectorAll('.panel')];
  const legacyMap = { blindFrame:'blindPanel', hotFrame:'hotRecommendPanel', dataFrame:'dataPanel' };

  function showMain(id){
    tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
    panels.forEach(p=>p.classList.toggle('active',p.id===id));
    const u = new URL(location.href); u.searchParams.set('streamer',streamer); id==='overview'?u.searchParams.delete('tool'):u.searchParams.set('tool',id); history.replaceState({},'',u);
    const frame = document.querySelector('#'+id+' iframe'); if(frame) setTimeout(()=>resizeFrame(frame),80);
  }
  tabs.forEach(b=>b.addEventListener('click',()=>showMain(b.dataset.tab)));

  function baseClean(doc){
    const app=doc.querySelector('.app'); if(app){app.style.maxWidth='none';app.style.padding='12px';}
    const title=doc.querySelector('.title'); if(title) title.style.display='none';
    const subtitle=doc.querySelector('.subtitle'); if(subtitle) subtitle.style.display='none';
    const tabs=doc.querySelector('.tabs'); if(tabs) tabs.style.display='none';
    doc.body.style.background='#fff';
  }

  function showLegacyPanel(frame,panelId,{hidePoolSearch=false}={}){
    try{
      const doc=frame.contentDocument;baseClean(doc);
      doc.querySelectorAll('.panel').forEach(p=>{p.classList.remove('active');p.style.display='none'});
      const panel=doc.getElementById(panelId);if(panel){panel.classList.add('active');panel.style.display='block'}
      if(hidePoolSearch && panel){
        panel.querySelectorAll('.card').forEach(card=>{const h=card.querySelector('h3');if(h && h.textContent.trim().includes('曲庫搜尋')) card.style.display='none'});
      }
      resizeFrame(frame);
      observeFrame(frame);
    }catch(e){console.warn('embed panel failed',e)}
  }

  function cleanSearchFrame(frame){
    try{
      const doc=frame.contentDocument;
      const app=doc.querySelector('.app');if(app){app.style.maxWidth='none';app.style.padding='12px'}
      const hero=doc.querySelector('.hero');if(hero){const link=doc.getElementById('liveLink');if(link)link.style.display='none'}
      const footer=doc.querySelector('.footer');if(footer)footer.style.display='none';
      doc.body.style.background='#fff';
      resizeFrame(frame);observeFrame(frame);
    }catch(e){console.warn('search embed failed',e)}
  }

  function resizeFrame(frame){
    try{const h=Math.max(720,frame.contentDocument.documentElement.scrollHeight,frame.contentDocument.body.scrollHeight);frame.style.height=(h+12)+'px'}catch(e){}
  }
  function observeFrame(frame){
    try{
      if(frame._observer)return;
      const obs=new MutationObserver(()=>resizeFrame(frame));obs.observe(frame.contentDocument.body,{subtree:true,childList:true,attributes:true});frame._observer=obs;
      frame.contentWindow.addEventListener('resize',()=>resizeFrame(frame));
    }catch(e){}
  }

  const overviewFrame=document.getElementById('overviewFrame');
  let overviewPanel='importPanel';
  overviewFrame.addEventListener('load',()=>showLegacyPanel(overviewFrame,overviewPanel));
  document.querySelectorAll('.sub-btn').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.sub-btn').forEach(x=>x.classList.toggle('active',x===btn));
    overviewPanel=btn.dataset.overview;showLegacyPanel(overviewFrame,overviewPanel);
  }));

  Object.entries(legacyMap).forEach(([frameId,panelId])=>{
    const frame=document.getElementById(frameId);
    frame.addEventListener('load',()=>showLegacyPanel(frame,panelId,{hidePoolSearch:panelId==='blindPanel'}));
  });
  const searchFrame=document.getElementById('searchFrame');searchFrame.src='../?streamer='+encodeURIComponent(streamer)+'&toolbox=1';searchFrame.addEventListener('load',()=>cleanSearchFrame(searchFrame));

  const initial=qs.get('tool');if(initial && document.getElementById(initial)) showMain(initial);
})();
</script>
</body>
</html>
