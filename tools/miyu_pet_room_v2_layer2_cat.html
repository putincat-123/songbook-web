 fill="#9a5d3c"/><rect x="41" y="7" width="5" height="12" fill="#9a5d3c"/><rect x="18" y="12" width="4" height="8" fill="#efad9f"/><rect x="42" y="12" width="4" height="8" fill="#efad9f"/></g><rect x="17" y="15" width="30" height="23" fill="#9d5f40"/><rect x="14" y="20" width="36" height="13" fill="#e9a96d"/><rect x="18" y="16" width="28" height="22" fill="#f4c48d"/><rect x="21" y="18" width="22" height="20" fill="#ffd7a0"/><rect x="23" y="32" width="18" height="7" fill="#fff1d9"/><g id="pixel-stripes" fill="#b76b45"><rect x="31" y="17" width="2" height="6"/><rect x="27" y="18" width="2" height="5"/><rect x="35" y="18" width="2" height="5"/><rect x="20" y="25" width="4" height="2"/><rect x="40" y="25" width="4" height="2"/></g><g id="pixel-eyes"><rect x="22" y="24" width="7" height="7" fill="#5b443e"/><rect x="35" y="24" width="7" height="7" fill="#5b443e"/><rect x="23" y="25" width="5" height="5" fill="#30292a"/><rect x="36" y="25" width="5" height="5" fill="#30292a"/><rect x="23" y="25" width="2" height="2" fill="#fff7e9"/><rect x="36" y="25" width="2" height="2" fill="#fff7e9"/><rect x="27" y="29" width="1" height="1" fill="#9b786c"/><rect x="40" y="29" width="1" height="1" fill="#9b786c"/></g><g id="pixel-face"><rect x="30" y="30" width="4" height="2" fill="#df8f8f"/><rect x="31" y="32" width="2" height="2" fill="#855d5d"/><rect x="27" y="34" width="4" height="1" fill="#855d5d"/><rect x="33" y="34" width="4" height="1" fill="#855d5d"/><rect x="18" y="31" width="7" height="1" fill="#b88a72"/><rect x="39" y="31" width="7" height="1" fill="#b88a72"/><rect x="17" y="34" width="8" height="1" fill="#b88a72"/><rect x="39" y="34" width="8" height="1" fill="#b88a72"/></g></g><g id="pixel-accessory"><rect x="22" y="38" width="20" height="2" fill="#d97ca3"/><rect x="30" y="38" width="5" height="4" fill="#f0b84e"/><rect x="31" y="39" width="3" height="2" fill="#ffe18a"/></g></svg></div></div><div class="ui-layer" id="ui-layer"></div><div class="load-error" id="load-error">场景载入失败</div></main><script>const themes={purple:{body:'#a38ab8',w:['#aa8ac2','#c29bbd','#d5a6ae'],f:['#9b80b2','#bd8fae','#d9a493'],so:['#9eb5d7','#778bc2'],cab:['#9c75b8','#72589d'],cur:'#dba4d2',lamp:'#d77ba7',rug:['#f4b9bd','#f6d1c5'],g:'#ee819c',top:'#75d1cb'},muji:{body:'#d9d1bf',w:['#d8dfd4','#e8e2d5','#f2e7d7'],f:['#c9b28f','#d8c4a3','#ead8ba'],so:['#c8d6c8','#aebfae'],cab:['#c9a976','#a8875e'],cur:'#eee5d5',lamp:'#c9b47e',rug:['#e5d8bd','#f2ead8'],g:'#d2c4aa',top:'#a9bdb3'},sea:{body:'#8eb4b3',w:['#9fc6c5','#b9d5cf','#d7e4d7'],f:['#8eb8b5','#a7c8bd','#c6d7c2'],so:['#9ccdcc','#75aaa9'],cab:['#c8aa72','#a88b5c'],cur:'#bde2df',lamp:'#84b8ac',rug:['#d8dfc9','#f0ead6'],g:'#e58b72',top:'#73bbb9'}};function applyTheme(k,nav){const s=document.querySelector('#scene-layer svg'),t=themes[k];if(!s||!t)return;document.body.style.background=t.body;[['w1',t.w[0]],['w2',t.w[1]],['w3',t.w[2]],['f1',t.f[0]],['f2',t.f[1]],['f3',t.f[2]],['so1',t.so[0]],['so2',t.so[1]],['c1',t.cab[0]],['c2',t.cab[1]]].forEach(([id,c])=>s.querySelector('#'+id)?.setAttribute('stop-color',c));s.querySelector('#curL')?.setAttribute('fill',t.cur);s.querySelector('#curR')?.setAttribute('fill',t.cur);s.querySelector('#lamp')?.setAttribute('fill',t.lamp);s.querySelector('#rug1')?.setAttribute('fill',t.rug[0]);s.querySelector('#rug2')?.setAttribute('fill',t.rug[1]);s.querySelector('#gbody')?.setAttribute('fill',t.g);s.querySelector('#gtop')?.setAttribute('fill',t.top);nav?.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.theme===k));localStorage.setItem('miyu-v2-theme',k)}async function mountScene(){try{const html=await fetch('miyu_pet_room_v2.html?v=layer1-locked-cat',{cache:'no-store'}).then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');const svg=doc.querySelector('svg.room');if(!svg)throw 0;svg.querySelector('#pet-character-layer')?.remove();svg.removeAttribute('class');document.getElementById('scene-layer').replaceChildren(document.importNode(svg,true));const sourceNav=doc.querySelector('nav.themes');if(sourceNav){const nav=document.importNode(sourceNav,true);nav.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>applyTheme(btn.dataset.theme,nav)));document.getElementById('ui-layer').appendChild(nav);applyTheme(localStorage.getItem('miyu-v2-theme')||'purple',nav)}}catch(e){document.getElementById('load-error').style.display='block'}}mountScene();window.petParts={head:()=>document.getElementById('pixel-head'),eyes:()=>document.getElementById('pixel-eyes'),body:()=>document.getElementById('pixel-body'),leftArm:()=>document.getElementById('arm-left'),rightArm:()=>document.getElementById('arm-right'),leftLeg:()=>document.getElementById('leg-left'),rightLeg:()=>document.getElementById('leg-right'),tail:()=>document.getElementById('pixel-tail'),accessories:()=>document.getElementById('pixel-accessory')};</script></body></html>
