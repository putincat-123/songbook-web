<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿宠物小屋 V2 · 三阶段对比</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center;background:#a38ab8}.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}.scene-layer,.compare-layer,.ui-layer{position:absolute;inset:0}.scene-layer{z-index:10}.compare-layer{z-index:30;pointer-events:none}.ui-layer{z-index:40}.scene-layer svg{width:100%;height:100%;display:block}.compare-ground{position:absolute;left:7%;right:7%;top:68%;height:1px;background:rgba(93,73,105,.18)}.stage{position:absolute;bottom:29%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}.stage.baby{left:31%;width:18%}.stage.teen{left:51%;width:20%}.stage.adult{left:73%;width:22%}.pet-box{width:100%;display:flex;align-items:flex-end;justify-content:center}.stage.baby .pet-box{aspect-ratio:96/120}.stage.teen .pet-box{aspect-ratio:96/128}.stage.adult .pet-box{aspect-ratio:96/136}.pet-box svg{width:100%;height:100%;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 3px 1px rgba(70,48,62,.18))}.label{margin-top:4px;padding:3px 6px;border-radius:8px;background:#fff9;color:#654f70;font-size:10px;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px #503d5a22}.themes{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;padding:5px;background:#fff9;border:1px solid #fff8;border-radius:18px;backdrop-filter:blur(8px);box-shadow:0 3px 14px #44334a25}.themes button{border:0;border-radius:13px;padding:7px 10px;font-size:12px;font-weight:700;color:#554b54;background:#fff9}.themes button.on{background:#fff;color:#765d82;box-shadow:0 2px 8px #5e46632a}.note{position:absolute;left:50%;top:48%;transform:translateX(-50%);padding:5px 9px;border-radius:10px;background:#fff8;color:#6c5772;font-size:10px;font-weight:700;white-space:nowrap}.error{display:none;position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:12px;background:#fff;color:#765d82;font-size:12px;font-weight:700}</style></head><body><main class="scene"><div class="scene-layer" id="scene-layer"></div><div class="compare-layer"><div class="note">同一地板基准 · 真实 Sprite code</div><div class="compare-ground"></div><div class="stage baby"><div class="pet-box" id="baby"></div><div class="label">幼年期</div></div><div class="stage teen"><div class="pet-box" id="teen"></div><div class="label">青少年期</div></div><div class="stage adult"><div class="pet-box" id="adult"></div><div class="label">成年期</div></div></div><div class="ui-layer" id="ui-layer"></div><div class="error" id="error">比较页载入失败</div></main><script>const themes={purple:{body:'#a38ab8',w:['#aa8ac2','#c29bbd','#d5a6ae'],f:['#9b80b2','#bd8fae','#d9a493'],so:['#9eb5d7','#778bc2'],cab:['#9c75b8','#72589d'],cur:'#dba4d2',lamp:'#d77ba7',rug:['#f4b9bd','#f6d1c5'],g:'#ee819c',top:'#75d1cb'},muji:{body:'#d9d1bf',w:['#d8dfd4','#e8e2d5','#f2e7d7'],f:['#c9b28f','#d8c4a3','#ead8ba'],so:['#c8d6c8','#aebfae'],cab:['#c9a976','#a8875e'],cur:'#eee5d5',lamp:'#c9b47e',rug:['#e5d8bd','#f2ead8'],g:'#d2c4aa',top:'#a9bdb3'},sea:{body:'#8eb4b3',w:['#9fc6c5','#b9d5cf','#d7e4d7'],f:['#8eb8b5','#a7c8bd','#c6d7c2'],so:['#9ccdcc','#75aaa9'],cab:['#c8aa72','#a88b5c'],cur:'#bde2df',lamp:'#84b8ac',rug:['#d8dfc9','#f0ead6'],g:'#e58b72',top:'#73bbb9'}};function applyTheme(k,nav){const s=document.querySelector('#scene-layer svg'),t=themes[k];if(!s||!t)return;document.body.style.background=t.body;[['w1',t.w[0]],['w2',t.w[1]],['w3',t.w[2]],['f1',t.f[0]],['f2',t.f[1]],['f3',t.f[2]],['so1',t.so[0]],['so2',t.so[1]],['c1',t.cab[0]],['c2',t.cab[1]]].forEach(([id,c])=>s.querySelector('#'+id)?.setAttribute('stop-color',c));s.querySelector('#curL')?.setAttribute('fill',t.cur);s.querySelector('#curR')?.setAttribute('fill',t.cur);s.querySelector('#lamp')?.setAttribute('fill',t.lamp);s.querySelector('#rug1')?.setAttribute('fill',t.rug[0]);s.querySelector('#rug2')?.setAttribute('fill',t.rug[1]);s.querySelector('#gbody')?.setAttribute('fill',t.g);s.querySelector('#gtop')?.setAttribute('fill',t.top);nav?.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.theme===k))}async function getSvg(url){const html=await fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()});const doc=new DOMParser().parseFromString(html,'text/html');const svg=doc.querySelector('.pixel-pet');if(!svg)throw Error('no svg');return document.importNode(svg,true)}async function init(){try{const roomHtml=await fetch('miyu_pet_room_v2.html?v=layer1-locked-cat',{cache:'no-store'}).then(r=>r.text());const roomDoc=new DOMParser().parseFromString(roomHtml,'text/html');const room=roomDoc.querySelector('svg.room');if(!room)throw Error('room');room.querySelector('#pet-character-layer')?.remove();room.removeAttribute('class');document.getElementById('scene-layer').replaceChildren(document.importNode(room,true));const navSrc=roomDoc.querySelector('nav.themes');if(navSrc){const nav=document.importNode(navSrc,true);nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>applyTheme(b.dataset.theme,nav)));document.getElementById('ui-layer').appendChild(nav);applyTheme('purple',nav)}const base='https://raw.githubusercontent.com/putincat-123/songbook-web/';const [baby,teen,adult]=await Promise.all([getSvg(base+'19568a5f92b268b14f93cd6eaa8e1696bbcf7067/tools/miyu_pet_room_v2_layer2_cat.html'),getSvg(base+'d96af6e4e33c9f9735b646bc1b0e079f6a31014b/tools/miyu_pet_room_v2_layer2_cat.html'),getSvg(base+'90ede5ca9e50b037f5cdbbc982cebbcd731c9d5a/tools/miyu_pet_room_v2_layer2_cat.html')]);document.getElementById('baby').replaceChildren(baby);document.getElementById('teen').replaceChildren(teen);document.getElementById('adult').replaceChildren(adult)}catch(e){document.getElementById('error').style.display='block'}}init();</script></body></html>
