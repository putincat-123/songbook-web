<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿宠物小屋 V2 · 原创小奶猫</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center;background:#a38ab8}.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}.scene-layer,.pet-layer,.ui-layer{position:absolute;inset:0}.scene-layer{z-index:10}.pet-layer{z-index:30;pointer-events:none}.ui-layer{z-index:40}.scene-layer svg{width:100%;height:100%;display:block}.pet-slot{position:absolute;left:54%;top:51.5%;width:18%;height:15%;transform:translateX(-50%)}.pet-rig{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 3px 2px rgba(78,57,78,.18))}.themes{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;padding:5px;background:#fff9;border:1px solid #fff8;border-radius:18px;backdrop-filter:blur(8px);box-shadow:0 3px 14px #44334a25}.themes button{border:0;border-radius:13px;padding:7px 10px;font-size:12px;font-weight:700;color:#554b54;background:#fff9}.themes button.on{background:#fff;color:#765d82;box-shadow:0 2px 8px #5e46632a}.load-error{display:none;position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:12px;background:#fff9;color:#765d82;font-size:12px;font-weight:700}@media(min-width:431px){body{padding:18px}.scene{height:auto;aspect-ratio:375/667;border-radius:24px;box-shadow:0 20px 55px #3e285755}}</style></head><body><main class="scene"><div class="scene-layer" id="scene-layer"></div><div class="pet-layer" id="pet-layer" data-pet="cream-tabby" data-stage="baby" data-action="idle"><div class="pet-slot"><svg class="pet-rig" viewBox="0 0 100 130" role="img" aria-label="原创小奶猫"><defs><linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe9c9"/><stop offset= :'#a9bdb3'},sea:{body:'#8eb4b3',w:['#9fc6c5','#b9d5cf','#d7e4d7'],f:['#8eb8b5','#a7c8bd','#c6d7c2'],so:['#9ccdcc','#75aaa9'],cab:['#c8aa72','#a88b5c'],cur:'#bde2df',lamp:'#84b8ac',rug:['#d8dfc9','#f0ead6'],g:'#e58b72',top:'#73bbb9'}};function applyTheme(k,nav){const s=document.querySelector('#scene-layer svg'),t=themes[k];if(!s||!t)return;document.body.style.background=t.body;[['w1',t.w[0]],['w2',t.w[1]],['w3',t.w[2]],['f1',t.f[0]],['f2',t.f[1]],['f3',t.f[2]],['so1',t.so[0]],['so2',t.so[1]],['c1',t.cab[0]],['c2',t.cab[1]]].forEach(([id,c])=>s.querySelector('#'+id)?.setAttribute('stop-color',c));s.querySelector('#curL')?.setAttribute('fill',t.cur);s.querySelector('#curR')?.setAttribute('fill',t.cur);s.querySelector('#lamp')?.setAttribute('fill',t.lamp);s.querySelector('#rug1')?.setAttribute('fill',t.rug[0]);s.querySelector('#rug2')?.setAttribute('fill',t.rug[1]);s.querySelector('#gbody')?.setAttribute('fill',t.g);s.querySelector('#gtop')?.setAttribute('fill',t.top);nav?.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.theme===k));localStorage.setItem('miyu-v2-theme',k)}async function mountScene(){try{const html=await fetch('miyu_pet_room_v2.html?v=layer1-locked-cat',{cache:'no-store'}).then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');const svg=doc.querySelector('svg.room');if(!svg)throw 0;svg.querySelector('#pet-character-layer')?.remove();svg.removeAttribute('class');document.getElementById('scene-layer').replaceChildren(document.importNode(svg,true));const sourceNav=doc.querySelector('nav.themes');if(sourceNav){const nav=document.importNode(sourceNav,true);nav.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>applyTheme(btn.dataset.theme,nav)));document.getElementById('ui-layer').appendChild(nav);applyTheme(localStorage.getItem('miyu-v2-theme')||'purple',nav)}}catch(e){document.getElementById('load-error').style.display='block'}}mountScene();window.petParts={head:()=>document.getElementById(
