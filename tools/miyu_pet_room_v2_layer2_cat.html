]],['w2',t.w[1]],['w3',t.w[2]],['f1',t.f[0]],['f2',t.f[1]],['f3',t.f[2]],['so1',t.so[0]],['so2',t.so[1]],['c1',t.cab[0]],['c2',t.cab[1]]].forEach(([id,c])=>s.querySelector('#'+id)?.setAttribute('stop-color',c));s.querySelector('#curL')?.setAttribute('fill',t.cur);s.querySelector('#curR')?.setAttribute('fill',t.cur);s.querySelector('#lamp')?.setAttribute('fill',t.lamp);s.querySelector('#rug1')?.setAttribute('fill',t.rug[0]);s.querySelector('#rug2')?.setAttribute('fill',t.rug[1]);s.querySelector('#gbody')?.setAttribute('fill',t.g);s.querySelector('#gtop')?.setAttribute('fill',t.top);nav?.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.theme===k));localStorage.setItem('miyu-v2-theme',k)}async function mountScene(){try{const html=await fetch('miyu_pet_room_v2.html?v=layer1-locked-cat',{cache:'no-store'}).then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');const svg=doc.querySelector('svg.room');if(!svg)throw 0;svg.querySelector('#pet-character-layer')?.remove();svg.removeAttribute('class');document.getElementById('scene-layer').replaceChildren(document.importNode(svg,true));const sourceNav=doc.querySelector('nav.themes');if(sourceNav){const nav=document.importNode(sourceNav,true);nav.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>applyTheme(btn.dataset.theme,nav)));document.getElementById('ui-layer').appendChild(nav);applyTheme(localStorage.getItem('miyu-v2-theme')||'purple',nav)}}catch(e){document.getElementById('load-error').style.display='block'}}mountScene();window.petParts={head:()=>document.getElementById('pixel-head'),eyes:()=>document.getElementById('pixel-eyes'),body:()=>document.getElementById('pixel-body'),leftArm:()=>document.getElementById('arm-left'),rightArm:()=>document.getElementById('arm-right'),leftLeg:()=>document.getElementById('leg-left'),rightLeg:()=>document.getElementById('leg-right'),tail:()=>document.getElementById('pixel-tail'),accessories:()=>document.getElementById(
