-head'),eyes:()=>document.getElementById('pixel-eyes'),body:()=>document.getElementById('pixel-body'),leftArm:()=>document.getElementById('arm-left'),rightArm:()=>document.getElementById('arm-right'),leftLeg:()=>document.getElementById('leg-left'),rightLeg:()=>document.getElementById('leg-right'),tail:()=>document.getElementById('pixel-tail'),accessories:()=>document.getElementById('pixel-accessory')};</script></body></html>
