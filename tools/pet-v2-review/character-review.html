<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>谜屿宠物小屋 V2 · 三阶段正背面验收</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{background:#eee8f2;color:#5d5065}main{width:min(760px,100%);margin:0 auto;padding:18px 14px 28px}h1{margin:0;font-size:20px}.sub{margin:6px 0 16px;font-size:12px;line-height:1.6;color:#776b7f}.stage{margin:0 0 14px;padding:14px;border-radius:18px;background:#fff;box-shadow:0 6px 20px #5f4f6b18}.stage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.stage-title{font-size:15px;font-weight:800}.stage-note{font-size:11px;color:#8c8093}.faces{display:grid;grid-template-columns:1fr 1fr;gap:10px}.face{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px 8px 9px;border-radius:14px;background:linear-gradient(#f8f5fa,#eee5f1);border:1px solid #ece4ef}.sprite{width:118px;height:154px;display:flex;align-items:flex-end;justify-content:center}.sprite svg{width:100%;height:100%;display:block;shape-rendering:crispEdges;filter:drop-shadow(0 4px 1px rgba(70,48,62,.16))}.stage[data-stage="teen"] .sprite{width:124px;height:162px}.stage[data-stage="adult"] .sprite{width:132px;height:170px}.label{margin-top:5px;font-size:12px;font-weight:800}.checks{margin-top:10px;padding-top:9px;border-top:1px dashed #ded4e2;font-size:11px;line-height:1.7;color:#766a7d}.error{display:none;padding:12px;border-radius:12px;background:#fff0f0;color:#9a5454;font-size:12px}@media(max-width:420px){main{padding-left:10px;padding-right:10px}.face{min-height:194px}.sprite{width:102px;height:138px}.stage[data-stage="teen"] .sprite{width:108px;height:145px}.stage[data-stage="adult"] .sprite{width:114px;height:152px}}
  </style>
</head>
<body>
  <main>
    <h1>三阶段角色正背面验收</h1>
    <p class="sub">这页只看角色，不测试移动。先确认 Baby / Teen / Adult 六个静态面全部成立，再进入动作层。</p>
    <section class="stage" data-stage="baby"><div class="stage-head"><div class="stage-title">Baby · 幼年期</div><div class="stage-note">蝴蝶结／围兜／铃铛</div></div><div class="faces"><div class="face"><div class="sprite" id="baby-front"></div><div class="label">正面</div></div><div class="face"><div class="sprite" id="baby-back"></div><div class="label">背面</div></div></div><div class="checks">验收：头部蝴蝶结只在正面可见；围兜正面完整、背面只剩后颈绑带；尾巴必须在身体后层。</div></section>
    <section class="stage" data-stage="teen"><div class="stage-head"><div class="stage-title">Teen · 青少年期</div><div class="stage-note">蓝色上衣／斜背小包</div></div><div class="faces"><div class="face"><div class="sprite" id="teen-front"></div><div class="label">正面</div></div><div class="face"><div class="sprite" id="teen-back"></div><div class="label">背面</div></div></div><div class="checks">验收：斜背带正背方向连续；包包位置在背面合理转位；身形比 Baby 略成熟但仍是同一只猫。</div></section>
    <section class="stage" data-stage="adult"><div class="stage-head"><div class="stage-title">Adult · 成年期</div><div class="stage-note">深蓝背心／金色细节</div></div><div class="faces"><div class="face"><div class="sprite" id="adult-front"></div><div class="label">正面</div></div><div class="face"><div class="sprite" id="adult-back"></div><div class="label">背面</div></div></div><div class="checks">验收：背心有真正的背面结构；成年比例更稳重；毛色、头纹、尾巴与前两阶段保持一致。</div></section>
    <div class="error" id="error">角色载入失败，请重新整理页面。</div>
  </main>
  <script type="module">
    import { STAGES, loadStageFace } from './stage-sprites.js?rev=13';
    function addFistOutlines(svg){
      ['#arm-left','#arm-right'].forEach(selector=>{
        const arm=svg.querySelector(selector);if(!arm)return;
        const fist=[...arm.querySelectorAll('path')].find(p=>(p.getAttribute('fill')||'').toLowerCase()==='#fff0d2');
        if(!fist||arm.querySelector('.fist-outline'))return;
        const outline=fist.cloneNode(true);
        outline.setAttribute('class','fist-outline');
        outline.setAttribute('fill','#67483d');
        outline.setAttribute('stroke','#67483d');
        outline.setAttribute('stroke-width','4');
        outline.setAttribute('stroke-linejoin','miter');
        outline.setAttribute('stroke-linecap','square');
        arm.insertBefore(outline,fist);
      });
    }
    async function init(){try{for(const stage of STAGES){const[front,back]=await Promise.all([loadStageFace(stage,'front'),loadStageFace(stage,'back')]);addFistOutlines(front);addFistOutlines(back);document.getElementById(`${stage}-front`).replaceChildren(front);document.getElementById(`${stage}-back`).replaceChildren(back)}}catch(error){console.error(error);document.getElementById('error').style.display='block'}}
    init();
  </script>
</body>
</html>
