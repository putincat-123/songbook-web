ir=1,last=0,auto=null,flowToken=0,pendingSong='',copyOK=false;const blind={x:900,y:-8};const songs=['春','借','善','默','骁','唯一','如愿','崇拜'];function zone(){if(x<360)return'休息区';if(x<730)return'客厅';if(x<1100)return'盲盒区';if(x<1460)return'祈福区';return'花园'}function render(){const vw=viewport.clientWidth,targetScreen=vw*.45,maxCam=Math.max(0,worldW-vw),cam=Math.max(0,Math.min(maxCam,x-targetScreen));world.style.transform=`translateX(${-cam}px)`;cat.style.transform=`translate(${x}px,${y}px)`;cat.classList.toggle('flip',dir<0);zoneName.textContent=zone()}function stopAll(){if(auto)return;hx=0;hy=0;cat.classList.remove('walk')}function lock(v){buttons.left.disabled=v;buttons.right.disabled=v;buttons.up.disabled=v;buttons.down.disabled=v;action.disabled=v}function say(text,ms=1300){speech.textContent=text;speech.classList.add('show');clearTimeout(speech._t);speech._t=setTimeout(()=>speech.classList.remove('show'),ms)}function delay(ms){return new Promise(r=>setTimeout(r,ms))}function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';ta.style.pointerEvents='none';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);return ok}function copyCommand(text){copyOK=false;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>{copyOK=true}).catch(()=>{copyOK=fallbackCopy(text)})}else copyOK=fallbackCopy(text)}async function drawFlow(token){auto='drawing';cat.classList.remove('walk');cat.classList.add('drawing');blindProp.classList.remove('shake');void blindProp.offsetWidth;blindProp.classList.add('shake');say('🎁 摇一摇…',1100);await delay(1100);if(token!==flowToken)return;cat.classList.remove('drawing');blindProp.classList.remove('shake');const song=pendingSong;songName.textContent=song;songCmd.textContent=`点歌 ${song}`;copyStatus.textContent=copyOK?'✓ 已复制':'点歌指令已准备';result.classList.add('show');say(copyOK?`🎵 抽到「${song}」！已复制`:`🎵 抽到「${song}」！`,1700);auto='waiting';await delay(5000);if(token!==flowToken)return;result.classList.remove('show');auto=null;lock(false);say('完成～可以继续走啦！',1200)}function reachBlind(){x=blind.x;y=blind.y;cat.classList.remove('walk');render();drawFlow(flowToken)}function startBlind(){if(auto)return;hx=0;hy=0;result.classList.remove('show');pendingSong=songs[Math.floor(Math.random()*songs.length)];copyCommand(`点歌 ${pendingSong}`);lock(true);flowToken++;auto='walking';say('去抽盲盒啦！',900)}function tick(t){if(!last)last=t;const dt=Math.min(32,t-last);last=t;if(auto==='walking'){const dx=blind.x-x,dy=blind.y-y;if(Math.abs(dx)<=3&&Math.abs(dy)<=2){reachBlind()}else{x+=Math.sign(dx)*Math.min(Math.abs(dx),.145*dt);y+=Math.sign(dy)*Math.min(Math.abs(dy),.08*dt);if(Math.abs(dx)>3)dir=Math.sign(dx);cat.classList.add('walk')}}else if(!auto&&(hx||hy)){x+=hx*.115*dt;y+=hy*.085*dt;x=Math.max(35,Math.min(worldW-catW-30,x));y=Math.max(minY,Math.min(maxY,y));if(hx)dir=hx;cat.classList.add('walk')}else cat.classList.remove('walk');render();requestAnimationFrame(tick)}function bind(btn,axis,val){btn.addEventListener('pointerdown',e=>{if(auto)return;e.preventDefault();stopAll();if(axis==='x')hx=val;else hy=val;if(axis==='x')dir=val});btn.addEventListener('pointerup',stopAll);btn.addEventListener('pointercancel',stopAll)}bind(buttons.left,'x',-1);bind(buttons.right,'x',1);bind(buttons.up,'y',-1);bind(buttons.down,'y',1);window.addEventListener('pointerup',stopAll);window.addEventListener('pointercancel',stopAll);window.addEventListener('blur',stopAll);action.addEventListener('click',startBlind);window.addEventListener('resize',render);render();requestAnimationFrame(tick)})();</script></body></html>
