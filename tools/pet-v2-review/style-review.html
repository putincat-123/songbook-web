<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿宠物小屋 · 横向卷轴 Prototype v8</title><style>*{box-sizing:border-box}body{margin:0;background:#efe7da;color:#58483f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:760px;margin:auto;padding:14px 10px 28px}h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:#78675c;margin:0 0 10px}.game{position:relative;overflow:hidden;border:2px solid #fff8ef;border-radius:20px;background:#d8c7aa;box-shadow:0 8px 24px #725f4a22;touch-action:manipulation}.viewport{position:relative;height:430px;overflow:hidden;background:linear-gradient(#cfe3e5 0 44%,#ead8b9 44% 76%,#b69d76 76%)}.world{position:absolute;left:0;top:0;width:1800px;height:100%;will-change:transform}.skyline{position:absolute;left:0;right:0;top:0;height:44%;background:linear-gradient(#b9d7df,#dbe9e5)}.hill{position:absolute;bottom:56%;width:260px;height:90px;border-radius:50% 50% 0 0;background:#9dbd9c;opacity:.7}.h1{left:100px}.h2{left:680px;width:360px}.h3{left:1320px}.floor{position:absolute;left:0;right:0;bottom:0;height:56%;background:repeating-linear-gradient(90deg,#c4a67b 0 76px,#b9956b 76px 80px)}.zone{position:absolute;bottom:78px;width:250px;height:235px}.zone-title{position:absolute;top:0;left:18px;font-weight:800;font-size:14px;background:#fff8e9cc;padding:5px 10px;border-radius:999px}.bed{left:70px}.living{left:410px}.play{left:780px}.pray{left:1140px}.garden{left:1500px}.prop{position:absolute;bottom:0;left:35px;width:180px;height:120px;display:grid;place-items:end center;font-size:72px;filter:drop-shadow(0 5px 0 #69534233);transform-origin:50% 90%}.prop.shake{animation:shake .12s steps(2,end) 8}.marker{position:absolute;bottom:62px;width:8px;height:8px;border-radius:50%;background:#e5b34b;box-shadow:0 0 0 5px #fff1a555}.cat{position:absolute;bottom:55px;left:0;width:78px;height:95px;transform-origin:50% 100%;will-change:transform}.cat.walk{animation:bob .28s steps(2,end) infinite}.cat.flip .cat-svg{transform:scaleX(-1)}@keyframes bob{50%{margin-bottom:3px}}@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}.cat-svg{width:100%;height:100%;image-rendering:pixelated;shape-rendering:crispEdges}.speech{position:absolute;left:50%;bottom:158px;transform:translateX(-50%);background:#fffaf1;border:2px solid #6a5143;border-radius:12px;padding:7px 10px;font-size:12px;font-weight:700;white-space:nowrap;opacity:0;transition:.15s;z-index:3}.speech.show{opacity:1}.result{position:absolute;left:50%;top:72px;transform:translateX(-50%) translateY(-6px);min-width:210px;max-width:78%;background:#fffaf1;border:2px solid #6a5143;border-radius:15px;padding:10px 13px;text-align:center;opacity:0;pointer-events:none;transition:.18s;z-index:5;box-shadow:0 6px 16px #57463c22}.result.show{opacity:1;transform:translateX(-50%) translateY(0)}.result b{display:block;font-size:18px;margin:3px 0 5px}.result small{font-size:12px;color:#7a6558}.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#fff9eddd;border:1px solid #fff;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:9px;background:#fff8ee}.controls button{border:0;border-radius:14px;min-height:48px;font-size:18px;font-weight:800;background:#dfd1bd;color:#57463c;touch-action:none;-webkit-user-select:none;user-select:none}.controls button:active{transform:translateY(1px);background:#cfbea5}.controls button:disabled{opacity:.5}.up{grid-column:2}.left{grid-column:1}.down{grid-column:2}.right{grid-column:3}.action{grid-column:1/4;font-size:14px!important;background:#e8b76b!important;color:#4c3829}.tip{padding:8px 12px 12px;background:#fff8ee;font-size:11px;color:#806d60;line-height:1.55}@media(max-width:560px){main{padding:8px 5px 22px}.viewport{height:410px}.controls{gap:6px;padding:7px}.controls button{min-height:46px}}</style></head><body><main><h1>谜屿宠物小屋 · 横向卷轴测试</h1><p class="sub">抽盲盒流程：自动走过去 → 盲盒摇动 → 抽歌 → 显示点歌指令 → 原地等待 5 秒。</p><section class="game"><div class="viewport" id="viewport"><div class="world" id="world"><div class="skyline"></div><div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div><div class="floor"></div><div class="zone bed"><div class="zone-title">休息区</div><div class="prop">🛏️</div></div><div class="zone living"><div class="zone-title">客厅</div><div class="prop">🛋️</div></div><div class="zone play"><div class="zone-title">盲盒区</div><div class="prop" id="blindProp">🎁</div><i class="marker" style="left:126px"></i></div><div class="zone pray"><div class="zone-title">祈福区</div><div class="prop">🪵</div><i class="marker" style="left:126px"></i></div><div class="zone garden"><div class="zone-title">花园</div><div class="prop">🌳</div></div><div class="cat" id="cat"><div class="speech" id="speech">到这里啦！</div><svg class="cat-svg" viewBox="0 0 48 58" aria-label="Baby橘猫"><g><path d="M34 34h4v1h3v2h2v4h1v5h-2v2h-3v2h-5v-3h4v-2h2v-3h1v-3h-2v-2h-5z" fill="#5a4034"/><path d="M35 35h3v1h2v2h1v6h-2v2h-4v2h-1v-3h3v-2h2v-4h-2v-2h-2z" fill="#d9803f"/></g><path d="M14 42h8v10H12v-4h2zM26 42h8v6h2v4H28l-2-2z" fill="#5a4034"/><path d="M15 43h6v8h-8v-3h1zM27 43h6v5h1v3h-6l-1-2z" fill="#d9803f"/><path d="M13 49h8v3h-8zM27 49h7v3h-7z" fill="#f6d6a3"/><path d="M15 29h18l2 5v10l-3 4H17l-4-4V34z" fill="#5a4034"/><path d="M16 30h16l2 5v9l-3 3H18l-4-3v-9z" fill="#efa75b"/><path d="M20 38h8v8h-8z" fill="#f5c987"/><path d="M13 32H9l-2 3v8l3 4h5l2-6v-7zM35 32h4l2 3v8l-3 4h-5l-2-6v-7z" fill="#5a4034"/><path d="M12 33H9l-1 3v6l3 3h3l1-5v-5zM36 33h3l1 3v6l-3 3h-3l-1-5v-5z" fill="#d9803f"/><path d="M9 41h5v5h-4l-1-2zM34 41h5v3l-1 2h-4z" fill="#f6d6a3"/><path d="M16 29h16v3h-2v5l-2 2h-8l-2-2v-5h-2z" fill="#5a4034"/><path d="M17 30h14v2h-2v4l-2 2h-6l-2-2v-4h-2z" fill="#e982a3"/><path d="M22 36h4v4h-4z" fill="#5a4034"/><path d="M23 36h2v3h-2z" fill="#e9bc49"/><path d="M11 9h1V6h3V4h3l3 3h6l3-3h3v2h3v3h1v2h2v4h1v9l-3 5-8 4H19l-8-4-3-5v-9l3-6z" fill="#5a4034"/><path d="M12 10l2-4h3l4 4h6l4-4h2l3 5 3 5v7l-4 5-8 3H19l-7-3-3-5v-7z" fill="#dd8845"/><path d="M14 8h2l4 4h-6zM34 8h-2l-4 4h6z" fill="#e9a083"/><path d="M12 18h3v-2h6v2h6v-2h6v2h3v6l-3 4-5 2h-8l-5-2-3-4z" fill="#efa75b"/><path d="M17 22h5v-1h4v1h5v5l-3 2h-8l-3-2z" fill="#f7d8aa"/><path d="M20 12h2v4h-2zM23 11h2v5h-2zM26 12h2v4h-2z" fill="#b76636"/><path d="M16 19h1v-1h3v1h1v2h-2v-1h-2v1h-2v-1h1zM28 19h1v-1h3v1h1v1h1v1h1v1h-2v-1h-2v1h-2z" fill="#4b3932"/><path d="M13 23h4v2h-4zM31 23h4v2h-4z" fill="#e78c86"/><path d="M22 23h4v2h-1v1h-2v-1h-1z" fill="#a75f5f"/><path d="M20 26h2v1h1v1h2v-1h1v-1h2v1h-1v1h-2v1h-3v-1h-2z" fill="#5a4034"/><path d="M8 7h3V5h5v2h3v6h-3v2h-5v-2H8z" fill="#5a4034"/><path d="M9 8h3V6h3v2h3v4h-3v2h-3v-2H9z" fill="#df7198"/></svg></div></div><div class="result" id="result"><small>🎵 抽到</small><b id="songName">春</b><small id="songCmd">点歌 春</small></div><div class="hud"><div class="pill" id="zoneName">休息区</div><div class="pill">🐾 Baby</div></div></div><div class="controls"><button type="button" class="up" id="up">▲</button><button type="button" class="left" id="left">◀︎</button><button type="button" class="down" id="down">▼</button><button type="button" class="right" id="right">▶︎</button><button type="button" class="action" id="action">🎁 抽盲盒</button></div><div class="tip">走到盲盒后 Baby 会固定站稳，只让盲盒摇动；结果出现后原地等待 5 秒，再恢复手动操作。</div></section></main><script>(()=>{const viewport=document.getElementById('viewport'),world=document.getElementById('world'),cat=document.getElementById('cat'),speech=document.getElementById('speech'),zoneName=document.getElementById('zoneName'),blindProp=document.getElementById('blindProp'),result=document.getElementById('result'),songName=document.getElementById('songName'),songCmd=document.getElementById('songCmd');const buttons={left:document.getElementById('left'),right:document.getElementById('right'),up:document.getElementById('up'),down:document.getElementById('down')};const action=document.getElementById('action');const worldW=1800,catW=78,minY=-58,maxY=22;let x=145,y=0,hx=0,hy=0,dir=1,last=0,auto=null,flowToken=0;const blind={x:900,y:-8};const songs=['春','借','善','默','骁','唯一','如愿','崇拜'];function zone(){if(x<360)return'休息区';if(x<730)return'客厅';if(x<1100)return'盲盒区';if(x<1460)return'祈福区';return'花园'}function render(){const vw=viewport.clientWidth,targetScreen=vw*.45,maxCam=Math.max(0,worldW-vw),cam=Math.max(0,Math.min(maxCam,x-targetScreen));world.style.transform=`translateX(${-cam}px)`;cat.style.transform=`translate(${x}px,${y}px)`;cat.classList.toggle('flip',dir<0);zoneName.textContent=zone()}function stopAll(){if(auto)return;hx=0;hy=0;cat.classList.remove('walk')}function lock(v){buttons.left.disabled=v;buttons.right.disabled=v;buttons.up.disabled=v;buttons.down.disabled=v;action.disabled=v}function say(text,ms=1300){speech.textContent=text;speech.classList.add('show');clearTimeout(speech._t);speech._t=setTimeout(()=>speech.classList.remove('show'),ms)}function delay(ms){return new Promise(r=>setTimeout(r,ms))}async function drawFlow(token){auto='drawing';cat.classList.remove('walk');blindProp.classList.remove('shake');void blindProp.offsetWidth;blindProp.classList.add('shake');say('🎁 摇一摇…',1100);await delay(1100);if(token!==flowToken)return;blindProp.classList.remove('shake');const song=songs[Math.floor(Math.random()*songs.length)];songName.textContent=song;songCmd.textContent=`点歌 ${song}`;result.classList.add('show');say(`🎵 抽到「${song}」！`,1700);auto='waiting';await delay(5000);if(token!==flowToken)return;result.classList.remove('show');auto=null;lock(false);say('完成～可以继续走啦！',1200)}function reachBlind(){x=blind.x;y=blind.y;cat.classList.remove('walk');render();drawFlow(flowToken)}function startBlind(){if(auto)return;hx=0;hy=0;result.classList.remove('show');lock(true);flowToken++;auto='walking';say('去抽盲盒啦！',900)}function tick(t){if(!last)last=t;const dt=Math.min(32,t-last);last=t;if(auto==='walking'){const dx=blind.x-x,dy=blind.y-y;if(Math.abs(dx)<=3&&Math.abs(dy)<=2){reachBlind()}else{x+=Math.sign(dx)*Math.min(Math.abs(dx),.145*dt);y+=Math.sign(dy)*Math.min(Math.abs(dy),.08*dt);if(Math.abs(dx)>3)dir=Math.sign(dx);cat.classList.add('walk')}}else if(!auto&&(hx||hy)){x+=hx*.115*dt;y+=hy*.085*dt;x=Math.max(35,Math.min(worldW-catW-30,x));y=Math.max(minY,Math.min(maxY,y));if(hx)dir=hx;cat.classList.add('walk')}else cat.classList.remove('walk');render();requestAnimationFrame(tick)}function bind(btn,axis,val){btn.addEventListener('pointerdown',e=>{if(auto)return;e.preventDefault();stopAll();if(axis==='x')hx=val;else hy=val;if(axis==='x')dir=val});btn.addEventListener('pointerup',stopAll);btn.addEventListener('pointercancel',stopAll)}bind(buttons.left,'x',-1);bind(buttons.right,'x',1);bind(buttons.up,'y',-1);bind(buttons.down,'y',1);window.addEventListener('pointerup',stopAll);window.addEventListener('pointercancel',stopAll);window.addEventListener('blur',stopAll);action.addEventListener('click',startBlind);window.addEventListener('resize',render);render();requestAnimationFrame(tick)})();</script></body></html>
