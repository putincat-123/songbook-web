<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Baby Character Rig Prototype v4</title><style>*{box-sizing:border-box}body{margin:0;background:#eee7dc;color:#51443c;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}main{max-width:520px;margin:auto;padding:12px}.card{background:#fffaf2;border-radius:20px;padding:14px;box-shadow:0 10px 28px #6e594522}h2{font-size:20px;margin:2px 0 10px}.stage{height:330px;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#d7e8e9 0 58%,#ead9bc 58% 78%,#c3a276 78%)}.stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:72px;background:repeating-linear-gradient(90deg,#c5a77e 0 78px,#b9956b 78px 82px);z-index:1}.avatar{position:absolute;left:72px;bottom:58px;width:150px;height:190px;z-index:4;transform-origin:50% 100%}.shadow{position:absolute;left:27px;right:27px;bottom:0;height:15px;border-radius:50%;background:#6b5b4a24;filter:blur(1px);z-index:0}.babySvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.babySvg *{vector-effect:non-scaling-stroke}.boxprop{position:absolute;right:46px;bottom:66px;font-size:72px;z-index:3;transform-origin:50% 90%}.label{position:absolute;right:47px;bottom:44px;font-size:12px;font-weight:800;background:#fff8;padding:3px 8px;border-radius:12px;z-index:6}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.controls button{border:0;border-radius:12px;padding:13px 8px;background:#ddd0bd;color:#52443b;font-weight:800;font-size:14px}.controls button:last-child{background:#efbb6c}.note{font-size:12px;line-height:1.6;color:#806d60;margin:10px 2px 0}.idle .bodyGroup{animation:idleBody 2s ease-in-out infinite;transform-origin:75px 150px}.idle .headGroup{animation:idleHead 2s ease-in-out infinite;transform-origin:75px 64px}.idle .tailGroup{animation:tail 1.7s ease-in-out infinite;transform-origin:34px 142px}.walking .bodyGroup{animation:walkBody .34s ease-in-out infinite;transform-origin:75px 150px}.walking .headGroup{animation:walkHead .34s ease-in-out infinite;transform-origin:75px 64px}.walking .armL{animation:armL .34s ease-in-out infinite;transform-origin:54px 112px}.walking .armR{animation:armR .34s ease-in-out infinite;transform-origin:96px 112px}.walking .legL{animation:legL .34s ease-in-out infinite;transform-origin:62px 151px}.walking .legR{animation:legR .34s ease-in-out infinite;transform-origin:88px 151px}.walking .tailGroup{animation:walkTail .34s ease-in-out infinite;transform-origin:34px 142px}.interact .bodyGroup{animation:lean .6s ease-in-out 2;transform-origin:75px 150px}.interact .armL{animation:reachL .6s ease-in-out 2;transform-origin:54px 112px}.interact .armR{animation:reachR .6s ease-in-out 2;transform-origin:96px 112px}.interact .headGroup{animation:look .6s ease-in-out 2;transform-origin:75px 64px}.boxprop.shake{animation:shake .11s steps(2,end) 10}@keyframes idleBody{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes idleHead{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.5deg) translateY(-1px)}}@keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}@keyframes walkBody{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-4px) rotate(.7deg)}}@keyframes walkHead{0%,100%{transform:rotate(1deg)}50%{transform:translateY(-2px) rotate(-1deg)}}@keyframes armL{0%,100%{transform:rotate(8deg)}50%{transform:rotate(-10deg)}}@keyframes armR{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}@keyframes legL{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-8deg) translateY(-3px)}}@keyframes legR{0%,100%{transform:rotate(-8deg) translateY(-3px)}50%{transform:rotate(5deg)}}@keyframes walkTail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg)}}@keyframes lean{0%,100%{transform:rotate(0) translateX(0)}50%{transform:rotate(4deg) translateX(8px)}}@keyframes reachL{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg) translate(10px,4px)}}@keyframes reachR{0%,100%{transform:rotate(0)}50%{transform:rotate(20deg) translate(12px,3px)}}@keyframes look{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg) translateX(3px)}}@keyframes shake{25%{transform:rotate(-8deg) translateX(-2px)}75%{transform:rotate(8deg) translateX(2px)}}@media(max-width:420px){.stage{height:310px}.avatar{width:136px;height:172px;bottom:58px}.boxprop{font-size:64px;right:32px}.label{right:32px}}</style></head><body><main><h2>Baby Character Rig Prototype</h2><div class="card"><div class="stage" id="stage"><div class="avatar idle" id="avatar"><div class="shadow"></div><svg class="babySvg" viewBox="0 0 150 190" aria-label="Baby orange cat" role="img"><defs><linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7a64a"/><stop offset="1" stop-color="#e9842e"/></linearGradient><linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4d8"/><stop offset="1" stop-color="#f3d3a1"/></linearGradient></defs><g class="tailGroup"><path d="M43 143 C24 135 18 149 28 158 C34 164 42 158 37 152 C34 149 37 147 44 150" fill="none" stroke="#d36d24" stroke-width="12" stroke-linecap="round"/><path d="M42 143 C27 137 22 148 29 154" fill="none" stroke="#f5a34a" stroke-width="7" stroke-linecap="round"/></g><g class="bodyGroup"><g class="legL"><path d="M55 145 Q49 158 53 174 Q58 180 66 175 L69 150 Z" fill="url(#fur)" stroke="#8b4c2b" stroke-width="2"/><ellipse cx="60" cy="174" rx="10" ry="7" fill="url(#cream)" stroke="#8b4c2b" stroke-width="2"/><path d="M56 173 q4 3 8 0" fill="none" stroke="#d88f76" stroke-width="1.4"/></g><g class="legR"><path d="M81 150 L84 175 Q93 181 99 174 Q102 158 95 145 Z" fill="url(#fur)" stroke="#8b4c2b" stroke-width="2"/><ellipse cx="91" cy="174" rx="10" ry="7" fill="url(#cream)" stroke="#8b4c2b" stroke-width="2"/><path d="M87 173 q4 3 8 0" fill="none" stroke="#d88f76" stroke-width="1.4"/></g><path d="M45 99 Q75 87 105 99 Q113 119 103 156 Q75 169 47 156 Q37 120 45 99Z" fill="url(#fur)" stroke="#8b4c2b" stroke-width="2"/><ellipse cx="75" cy="133" rx="24" ry="26" fill="url(#cream)" opacity=".95"/><g class="armL"><path d="M52 107 Q39 118 45 137 Q50 145 59 137 Q61 123 63 112Z" fill="url(#fur)" stroke="#8b4c2b" stroke-width="2"/><ellipse cx="51" cy="136" rx="9" ry="8" fill="url(#cream)" stroke="#8b4c2b" stroke-width="2"/></g><g class="armR"><path d="M98 107 Q111 118 105 137 Q100 145 91 137 Q89 123 87 112Z" fill="url(#fur)" stroke="#8b4c2b" stroke-width="2"/><ellipse cx="99" cy="136" rx="9" ry="8" fill="url(#cream)" stroke="#8b4c2b" stroke-width="2"/></g><path d="M50 96 Q75 108 100 96 L96 116 Q75 124 54 116Z" fill="#f3a9b7" stroke="#9e5c65" stroke-width="2"/><circle cx="75" cy="116" r="7" fill="#e4b24c" stroke="#8a652d" stroke-width="2"/><circle cx="73" cy="114" r="2" fill="#fff3b0"/></g><g class="headGroup"><path d="M37 46 L45 17 L62 37 Q75 31 88 37 L106 17 L113 48 Q119 59 113 75 Q106 94 75 98 Q44 94 37 75 Q31 59 37 46Z" fill="url(#fur)" stroke="#8b4c2b" stroke-width="2.4" stroke-linejoin="round"/><path d="M45 25 L49 39 L58 35Z" fill="#f5c0a8"/><path d="M105 25 L101 39 L92 35Z" fill="#f5c0a8"/><path d="M60 40 l5 10 M75 37 v12 M90 40 l-5 10" stroke="#b85f28" stroke-width="3" stroke-linecap="round"/><ellipse cx="56" cy="62" rx="8" ry="10" fill="#3d302c"/><ellipse cx="94" cy="62" rx="8" ry="10" fill="#3d302c"/><circle cx="53" cy="58" r="2" fill="#fff"/><circle cx="91" cy="58" r="2" fill="#fff"/><path d="M69 75 Q75 79 81 75" fill="none" stroke="#6f4539" stroke-width="2" stroke-linecap="round"/><path d="M75 70 q-4 0 -4 3 q4 5 8 0 q0-3-4-3Z" fill="#e78d87" stroke="#8b4c2b" stroke-width="1.2"/><path d="M39 70 L18 66 M40 76 L17 76 M41 81 L21 86 M111 70 L132 66 M110 76 L133 76 M109 81 L129 86" stroke="#9b6d50" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="48" cy="79" rx="7" ry="4" fill="#f39fa2" opacity=".55"/><ellipse cx="102" cy="79" rx="7" ry="4" fill="#f39fa2" opacity=".55"/><g class="bow"><circle cx="103" cy="31" r="6" fill="#e47d98" stroke="#925263" stroke-width="1.6"/><path d="M102 31 Q90 18 84 28 Q87 39 102 33Z" fill="#f29ab2" stroke="#925263" stroke-width="1.6"/><path d="M104 31 Q117 18 124 29 Q120 40 105 33Z" fill="#f29ab2" stroke="#925263" stroke-width="1.6"/></g></g></svg></div><div class="boxprop" id="box">🎁</div><div class="label">盲盒</div></div><div class="controls"><button id="idle">待機</button><button id="left">← 往左走</button><button id="right">往右走 →</button><button id="draw">走去抽盲盒</button></div><p class="note">v4｜Baby 完全由 inline SVG code 繪製，不讀取任何外部圖片。頭、身體、雙手、雙腳、尾巴都是可動畫元件。</p></div></main><script>const avatar=document.getElementById('avatar'),stage=document.getElementById('stage'),box=document.getElementById('box');let x=72,raf=0;function setMode(m){avatar.className='avatar '+m}function stop(){cancelAnimationFrame(raf);setMode('idle')}function walkTo(target,dir,done){cancelAnimationFrame(raf);setMode('walking');avatar.style.transform=dir<0?'scaleX(-1)':'scaleX(1)';const start=x,t0=performance.now(),dist=Math.abs(target-start),dur=Math.max(450,dist/0.12);function tick(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,2);x=start+(target-start)*e;avatar.style.left=x+'px';if(p<1)raf=requestAnimationFrame(tick);else{setMode('idle');done&&done()}}raf=requestAnimationFrame(tick)}document.getElementById('idle').onclick=()=>{stop();avatar.style.transform='scaleX(1)'};document.getElementById('left').onclick=()=>walkTo(Math.max(10,x-120),-1);document.getElementById('right').onclick=()=>walkTo(Math.min(stage.clientWidth-155,x+120),1);document.getElementById('draw').onclick=()=>{const target=Math.max(90,stage.clientWidth-245);walkTo(target,1,()=>{setMode('interact');box.classList.add('shake');setTimeout(()=>{box.classList.remove('shake');setMode('idle')},1350)})};</script></body></html>
