<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Baby Character Rig Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#eee7dc;color:#51443c;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}main{max-width:520px;margin:auto;padding:12px}.card{background:#fffaf2;border-radius:20px;padding:14px;box-shadow:0 10px 28px #6e594522}h2{font-size:20px;margin:2px 0 10px}.stage{height:330px;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#d7e8e9 0 58%,#ead9bc 58% 78%,#c3a276 78%)}.stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:72px;background:repeating-linear-gradient(90deg,#c5a77e 0 78px,#b9956b 78px 82px)}.avatar{position:absolute;left:72px;bottom:60px;width:151px;height:180px;z-index:4;transform-origin:50% 100%;transition:filter .2s}.rig{position:absolute;inset:0;transform-origin:50% 100%}.part{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}.tail{clip-path:polygon(0 55%,42% 55%,43% 94%,0 94%);transform-origin:29% 72%;z-index:0}.legL{clip-path:polygon(20% 72%,53% 72%,53% 100%,18% 100%);transform-origin:38% 76%;z-index:1}.legR{clip-path:polygon(48% 72%,82% 72%,84% 100%,48% 100%);transform-origin:64% 76%;z-index:1}.body{clip-path:polygon(18% 51%,83% 51%,89% 91%,12% 91%);transform-origin:50% 84%;z-index:2}.armL{clip-path:polygon(18% 54%,50% 54%,50% 83%,14% 83%);transform-origin:34% 61%;z-index:4}.armR{clip-path:polygon(49% 54%,84% 54%,88% 83%,49% 83%);transform-origin:67% 61%;z-index:4}.head{clip-path:polygon(0 0,100% 0,100% 66%,0 66%);transform-origin:50% 62%;z-index:5}.shadow{position:absolute;left:24px;right:24px;bottom:0;height:16px;border-radius:50%;background:#6b5b4a24;filter:blur(1px);z-index:-1}.boxprop{position:absolute;right:46px;bottom:66px;font-size:72px;z-index:3;transform-origin:50% 90%}.label{position:absolute;right:47px;bottom:44px;font-size:12px;font-weight:800;background:#fff8;padding:3px 8px;border-radius:12px;z-index:6}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.controls button{border:0;border-radius:12px;padding:13px 8px;background:#ddd0bd;color:#52443b;font-weight:800;font-size:14px}.controls button:last-child{background:#efbb6c}.note{font-size:12px;line-height:1.6;color:#806d60;margin:10px 2px 0}.idle .rig{animation:idleBody 2.2s ease-in-out infinite}.idle .head{animation:idleHead 2.2s ease-in-out infinite}.idle .tail{animation:tail 1.5s ease-in-out infinite}.walking .rig{animation:walkBody .34s ease-in-out infinite}.walking .head{animation:walkHead .34s ease-in-out infinite}.walking .armL{animation:armL .34s ease-in-out infinite}.walking .armR{animation:armR .34s ease-in-out infinite}.walking .legL{animation:legL .34s ease-in-out infinite}.walking .legR{animation:legR .34s ease-in-out infinite}.walking .tail{animation:walkTail .34s ease-in-out infinite}.interact .rig{animation:lean .6s ease-in-out 2}.interact .armL{animation:reachL .6s ease-in-out 2}.interact .armR{animation:reachR .6s ease-in-out 2}.interact .head{animation:look .6s ease-in-out 2}.boxprop.shake{animation:shake .11s steps(2,end) 10}@keyframes idleBody{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(.995,1.008)}}@keyframes idleHead{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.5deg) translateY(-1px)}}@keyframes tail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}@keyframes walkBody{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-4px) rotate(.7deg)}}@keyframes walkHead{0%,100%{transform:translateY(0) rotate(1deg)}50%{transform:translateY(-2px) rotate(-1deg)}}@keyframes armL{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-9deg)}}@keyframes armR{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(7deg)}}@keyframes legL{0%,100%{transform:rotate(5deg) translateY(0)}50%{transform:rotate(-7deg) translateY(-3px)}}@keyframes legR{0%,100%{transform:rotate(-7deg) translateY(-3px)}50%{transform:rotate(5deg) translateY(0)}}@keyframes walkTail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(11deg)}}@keyframes lean{0%,100%{transform:rotate(0) translateX(0)}50%{transform:rotate(4deg) translateX(7px)}}@keyframes reachL{0%,100%{transform:rotate(0) translate(0)}50%{transform:rotate(-16deg) translate(9px,3px)}}@keyframes reachR{0%,100%{transform:rotate(0) translate(0)}50%{transform:rotate(18deg) translate(11px,2px)}}@keyframes look{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg) translateX(3px)}}@keyframes shake{25%{transform:rotate(-8deg) translateX(-2px)}75%{transform:rotate(8deg) translateX(2px)}}@media(max-width:420px){.stage{height:310px}.avatar{width:136px;height:162px;bottom:58px}.boxprop{font-size:64px;right:32px}.label{right:32px}}</style></head><body><main><h2>Baby Character Rig Prototype</h2><div class="card"><div class="stage" id="stage"><div class="avatar idle" id="avatar"><div class="rig"><img class="part tail" src="assets/baby-idle.png?v=3"><img class="part legL" src="assets/baby-idle.png?v=3"><img class="part legR" src="assets/baby-idle.png?v=3"><img class="part body" src="assets/baby-idle.png?v=3"><img class="part armL" src="assets/baby-idle.png?v=3"><img class="part armR" src="assets/baby-idle.png?v=3"><img class="part head" src="assets/baby-idle.png?v=3"></div><div class="shadow"></div></div><div class="boxprop" id="box">🎁</div><div class="label">盲盒</div></div><div class="controls"><button id="idle">待機</button><button id="left">← 往左走</button><button id="right">往右走 →</button><button id="draw">走去抽盲盒</button></div><p class="note">P0 角色驗證：同一張 Baby 母版拆成頭、身體、雙手、雙腳、尾巴，由骨架式動畫驅動。這頁只驗角色，不做捲軸。</p></div></main><script>const avatar=document.getElementById('avatar'),stage=document.getElementById('stage'),box=document.getElementById('box');let x=72,raf=0;function setMode(m){avatar.className='avatar '+m}function stop(){cancelAnimationFrame(raf);setMode('idle')}function walkTo(target,dir,done){cancelAnimationFrame(raf);setMode('walking');avatar.style.transform=dir<0?'scaleX(-1)':'scaleX(1)';const start=x,t0=performance.now(),dist=Math.abs(target-start),dur=Math.max(450,dist/0.12);function tick(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,2);x=start+(target-start)*e;avatar.style.left=x+'px';if(p<1)raf=requestAnimationFrame(tick);else{setMode('idle');done&&done()}}raf=requestAnimationFrame(tick)}document.getElementById('idle').onclick=()=>{stop();avatar.style.transform='scaleX(1)'};document.getElementById('left').onclick=()=>walkTo(Math.max(10,x-120),-1);document.getElementById('right').onclick=()=>walkTo(Math.min(stage.clientWidth-155,x+120),1);document.getElementById('draw').onclick=()=>{const target=Math.max(90,stage.clientWidth-245);walkTo(target,1,()=>{setMode('interact');box.classList.add('shake');setTimeout(()=>{box.classList.remove('shake');setMode('idle')},1350)})};</script></body></html>
