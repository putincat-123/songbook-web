<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Baby Character CSS Prototype v5</title><style>*{box-sizing:border-box}body{margin:0;background:#eee7dc;color:#51443c;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}main{max-width:520px;margin:auto;padding:12px}.card{background:#fffaf2;border-radius:20px;padding:14px;box-shadow:0 10px 28px #6e594522}h2{font-size:20px;margin:2px 0 10px}.stage{height:330px;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#d7e8e9 0 58%,#ead9bc 58% 78%,#c3a276 78%)}.floor{position:absolute;left:0;right:0;bottom:0;height:72px;background:repeating-linear-gradient(90deg,#c5a77e 0 78px,#b9956b 78px 82px)}.avatar{position:absolute;left:78px;bottom:58px;width:150px;height:190px;z-index:4}.shadow{position:absolute;left:26px;right:26px;bottom:0;height:15px;border-radius:50%;background:#6b5b4a24;filter:blur(1px)}.cat{position:absolute;left:0;top:0;width:150px;height:180px}.tail{position:absolute;left:18px;top:120px;width:42px;height:22px;border:10px solid #e88932;border-top-color:transparent;border-right-color:transparent;border-radius:50%;transform:rotate(-18deg);z-index:0}.body{position:absolute;left:43px;top:90px;width:66px;height:68px;border:3px solid #8b4c2b;border-radius:48% 48% 42% 42%;background:#ee953d;z-index:2}.belly{position:absolute;left:14px;top:24px;width:38px;height:36px;border-radius:50%;background:#ffe8bd}.leg{position:absolute;top:146px;width:28px;height:30px;border:3px solid #8b4c2b;border-radius:44% 44% 50% 50%;background:#ef983f;z-index:1}.leg:after{content:"";position:absolute;left:3px;bottom:-2px;width:18px;height:11px;border:2px solid #8b4c2b;border-radius:50%;background:#ffe8bd}.legL{left:48px}.legR{left:78px}.arm{position:absolute;top:108px;width:25px;height:44px;border:3px solid #8b4c2b;border-radius:50%;background:#ef983f;z-index:4}.arm:after{content:"";position:absolute;left:2px;bottom:-4px;width:17px;height:15px;border:2px solid #8b4c2b;border-radius:50%;background:#ffe8bd}.armL{left:37px;transform:rotate(18deg)}.armR{left:90px;transform:rotate(-18deg)}.bib{position:absolute;left:47px;top:92px;width:58px;height:30px;background:#f2a0b4;border:3px solid #9b5d69;border-radius:8px 8px 25px 25px;z-index:3}.bell{position:absolute;left:68px;top:113px;width:17px;height:17px;border:2px solid #8b682e;border-radius:50%;background:#e7b84f;z-index:5}.head{position:absolute;left:28px;top:22px;width:96px;height:82px;border:3px solid #8b4c2b;border-radius:46% 46% 48% 48%;background:#f09a43;z-index:6}.ear{position:absolute;top:-15px;width:32px;height:38px;background:#f09a43;border:3px solid #8b4c2b;transform:rotate(45deg);z-index:-1}.ear:after{content:"";position:absolute;inset:8px;background:#f6b5a8;border-radius:4px}.earL{left:8px}.earR{right:8px}.stripe{position:absolute;top:5px;width:4px;height:16px;background:#bd652b;border-radius:4px}.s1{left:36px;transform:rotate(-12deg)}.s2{left:47px}.s3{left:58px;transform:rotate(12deg)}.eye{position:absolute;top:34px;width:14px;height:18px;border-radius:50%;background:#3c2e2a}.eye:after{content:"";position:absolute;left:3px;top:3px;width:4px;height:4px;border-radius:50%;background:#fff}.eyeL{left:23px}.eyeR{right:23px}.nose{position:absolute;left:43px;top:54px;width:10px;height:7px;border-radius:50% 50% 60% 60%;background:#df8785}.mouth{position:absolute;left:39px;top:61px;width:18px;height:10px;border-bottom:2px solid #74463c;border-radius:50%}.cheek{position:absolute;top:57px;width:15px;height:7px;border-radius:50%;background:#f19ba0aa}.cheekL{left:10px}.cheekR{right:10px}.whisker{position:absolute;top:58px;width:27px;height:2px;background:#9a6a4d;border-radius:2px}.w1{left:-21px;transform:rotate(8deg)}.w2{left:-23px;top:66px}.w3{right:-21px;transform:rotate(-8deg)}.w4{right:-23px;top:66px}.bow{position:absolute;right:-8px;top:-12px;width:30px;height:24px;z-index:10}.bow:before,.bow:after{content:"";position:absolute;top:4px;width:16px;height:16px;background:#ef98af;border:2px solid #925665;border-radius:60% 20% 60% 20%}.bow:before{left:0;transform:rotate(28deg)}.bow:after{right:0;transform:rotate(62deg)}.bow i{position:absolute;left:10px;top:8px;width:10px;height:10px;background:#df7895;border:2px solid #925665;border-radius:50%;z-index:2}.boxprop{position:absolute;right:46px;bottom:66px;font-size:72px;z-index:3}.label{position:absolute;right:47px;bottom:44px;font-size:12px;font-weight:800;background:#fff8;padding:3px 8px;border-radius:12px}.note{font-size:12px;line-height:1.6;color:#806d60;margin:10px 2px 0}</style></head><body><main><h2>Baby Character CSS Prototype</h2><div class="card"><div class="stage"><div class="floor"></div><div class="avatar"><div class="shadow"></div><div class="cat"><div class="tail"></div><div class="leg legL"></div><div class="leg legR"></div><div class="body"><div class="belly"></div></div><div class="bib"></div><div class="arm armL"></div><div class="arm armR"></div><div class="bell"></div><div class="head"><div class="ear earL"></div><div class="ear earR"></div><div class="stripe s1"></div><div class="stripe s2"></div><div class="stripe s3"></div><div class="eye eyeL"></div><div class="eye eyeR"></div><div class="nose"></div><div class="mouth"></div><div class="cheek cheekL"></div><div class="cheek cheekR"></div><div class="whisker w1"></div><div class="whisker w2"></div><div class="whisker w3"></div><div class="whisker w4"></div><div class="bow"><i></i></div></div></div></div><div class="boxprop">🎁</div><div class="label">盲盒</div></div><p class="note">v5｜最小驗證：Baby 完全由 HTML + CSS div 繪製，不用 PNG、SVG、Canvas，也暫時不加動畫。先確認角色能穩定顯示。</p></div></main></body></html>
