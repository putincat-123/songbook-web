<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿宠物小屋 V2 · 动作验收</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center;background:#a38ab8}.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}.scene-layer,.pet-layer,.ui-layer{position:absolute;inset:0}.scene-layer{z-index:10}.pet-layer{z-index:30;pointer-events:none}.ui-layer{z-index:40}.scene-layer svg{width:100%;height:100%;display:block}.pet-anchor{position:absolute;left:45%;top:78%;width:22%;aspect-ratio:96/120;transform:translate(-50%,-88.3%)}.pixel-pet{width:100%;height:100%;display:block;shape-rendering:crispEdges;transform-origin:50% 88.3%}.pet-anchor[data-dir="left"] .pixel-pet{transform:scaleX(-1)}.pet-anchor.walking .pixel-pet{animation:bob .38s steps(2,end) infinite}@keyframes bob{50%{translate:0 -1.5px}}.pad{position:absolute;left:50%;bottom:max(14px,calc(env(safe-area-inset-bottom) + 8px));transform:translateX(-50%);display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:40px 40px 40px;gap:5px;padding:7px;background:#fff9;border-radius:20px}.pad button{border:0;border-radius:12px;background:#fff;color:#66546d;font-size:18px;font-weight:900}.up{grid-column:2}.left{grid-column:1;grid-row:2}.stop{grid-column:2;grid-row:2;font-size:11px!important}.right{grid-column:3;grid-row:2}.down{grid-column:2;grid-row:3}.status{position:absolute;left:50%;top:42%;transform:translateX(-50%);padding:5px 9px;border-radius:10px;background:#fff9;color:#6c5772;font-size:10px;font-weight:800;white-space:nowrap}.stagebar{position:absolute;left:10px;top:max(10px,env(safe-area-inset-top));display:flex;gap:5px;padding:5px;background:#fff9;border-radius:16px}.stagebar button{border:0;border-radius:11px;padding:6px 8px;background:#fff;color:#66546d;font-size:11px;font-weight:800}.stagebar button.on{outline:2px solid #765d82}
</style></head><body><main class="scene"><div class="scene-layer" id="sceneLayer"></div><div class="pet-layer"><div class="pet-anchor" id="petAnchor" data-dir="front"></div></div><div class="ui-layer"><div class="stagebar"><button data-stage="baby" class="on">Baby</button><button data-stage="teen">Teen</button><button data-stage="adult">Adult</button></div><div class="status" id="status">loading</div><div class="pad"><button class="up" data-act="back">↑</button><button class="left" data-act="left">←</button><button class="stop" data-act="stop">停止</button><button class="right" data-act="right">→</button><button class="down" data-act="front">↓</button></div></div></main>
<script type="module">
import{loadStageFace}from'./stage-sprites.js?rev=15';
const sceneLayer=document.getElementById('sceneLayer'),anchor=document.getElementById('petAnchor'),status=document.getElementById('status');
const source='../miyu_pet_room_v2.html';let stage='baby',direction='front',state='idle',x=45,y=78,raf=0,last=0;const speedX=9,speedY=6.3,bounds={minX:15,maxX:85,minY:54,maxY:84};const obstacles=[{x1:5,x2:42,y1:58,y2:72.5},{x1:13,x2:31,y1:68,y2:78},{x1:38,x2:46,y1:67,y2:76},{x1:3,x2:27,y1:77,y2:86}];
async function loadScene(){const html=await fetch(source,{cache:'no-store'}).then(r=>r.text()),doc=new DOMParser().parseFromString(html,'text/html'),svg=doc.querySelector('svg.room');svg.querySelector('#pet-character-layer')?.remove();svg.querySelector('#gbody')?.closest('g')?.remove();svg.querySelector('#rug1')?.closest('g')?.remove();const cabinet=[...svg.querySelectorAll('rect')].find(r=>r.getAttribute('x')==='278'&&r.getAttribute('y')==='326');cabinet?.closest('g')?.remove();sceneLayer.replaceChildren(document.importNode(svg,true))}
function inside(o,px,py){return px>=o.x1&&px<=o.x2&&py>=o.y1&&py<=o.y2}
function depth(o,px,py){return Math.min(px-o.x1,o.x2-px,py-o.y1,o.y2-py)}
function blocked(fromX,fromY,toX,toY){return obstacles.some(o=>{const fromInside=inside(o,fromX,fromY),toInside=inside(o,toX,toY);if(!toInside)return false;if(!fromInside)return true;return depth(o,toX,toY)>depth(o,fromX,fromY)+0.0001})}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
async function renderSprite(){const face=direction==='back'?'back':'front',svg=await loadStageFace(stage,face);anchor.replaceChildren(svg);anchor.dataset.dir=direction;anchor.style.width=stage==='baby'?'22%':stage==='teen'?'23%':'24%'}
function render(){anchor.style.left=x+'%';anchor.style.top=y+'%';anchor.dataset.dir=direction;anchor.classList.toggle('walking',state==='walk');status.textContent=`${stage} · ${state} · ${direction}`}
function stop(){state='idle';if(raf)cancelAnimationFrame(raf);raf=0;render()}
function tick(now){const dt=Math.min(.04,(now-last)/1000);last=now;const nx=clamp(x+(direction==='left'?-speedX:direction==='right'?speedX:0)*dt,bounds.minX,bounds.maxX),ny=clamp(y+(direction==='back'?-speedY:direction==='front'?speedY:0)*dt,bounds.minY,bounds.maxY),ox=x,oy=y;if(!blocked(x,y,nx,y))x=nx;if(!blocked(x,y,x,ny))y=ny;render();if((x===ox&&y===oy)||(x===bounds.minX&&direction==='left')||(x===bounds.maxX&&direction==='right')||(y===bounds.minY&&direction==='back')||(y===bounds.maxY&&direction==='front'))stop();else if(state==='walk')raf=requestAnimationFrame(tick)}
async function move(dir){direction=dir;state='walk';await renderSprite();render();if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>b.dataset.act==='stop'?stop():move(b.dataset.act));document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=async()=>{stage=b.dataset.stage;document.querySelectorAll('[data-stage]').forEach(i=>i.classList.toggle('on',i===b));stop();await renderSprite();render()});
await loadScene();await renderSprite();render();
</script></body></html>
