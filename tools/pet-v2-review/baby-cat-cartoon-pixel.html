<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby 猫 · 精致卡通像素风</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#161620;color:#f7f3ee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
  .wrap{width:min(94vw,620px);padding:22px}
  .title{font-weight:800;font-size:22px;margin:0 0 6px}.sub{margin:0 0 16px;color:#b8b4c2;font-size:14px;line-height:1.6}
  .card{background:#242432;border:2px solid #454559;border-radius:18px;padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
  .stage{height:min(68vh,560px);display:grid;place-items:center;background:linear-gradient(#38364a 0 62%,#2d2a39 62%);border-radius:14px;overflow:hidden;position:relative}
  .stage:after{content:"";position:absolute;left:8%;right:8%;bottom:11%;height:14px;background:#11111a;opacity:.3;filter:blur(7px);border-radius:50%}
  svg{width:min(78vw,390px);height:auto;position:relative;z-index:1;image-rendering:pixelated;shape-rendering:crispEdges}
  .note{margin:14px 2px 0;color:#aaa6b5;font-size:13px;line-height:1.65}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">Baby 猫 · 精致卡通像素风</h1>
  <p class="sub">单角色正面验收。重点是像素轮廓、表情辨识度、粉红围兜＋铃铛、明显蝴蝶结，以及后续可拆手脚做动作的结构。</p>
  <div class="card">
    <div class="stage">
      <svg viewBox="0 0 32 38" aria-label="Baby orange cat pixel character">
        <!-- palette: outline #4b3428, deep fur #c86f31, fur #ef9950, light #ffc77b, cream #ffe5b5, pink #ee779c -->
        <g id="tail">
          <rect x="25" y="22" width="3" height="2" fill="#4b3428"/><rect x="27" y="20" width="3" height="2" fill="#4b3428"/><rect x="28" y="17" width="3" height="4" fill="#4b3428"/>
          <rect x="25" y="23" width="4" height="2" fill="#4b3428"/><rect x="27" y="22" width="3" height="2" fill="#ef9950"/><rect x="29" y="18" width="1" height="3" fill="#ef9950"/>
        </g>
        <g id="legs">
          <rect x="8" y="30" width="7" height="5" fill="#4b3428"/><rect x="17" y="30" width="7" height="5" fill="#4b3428"/>
          <rect x="9" y="30" width="5" height="4" fill="#ef9950"/><rect x="18" y="30" width="5" height="4" fill="#ef9950"/>
          <rect x="8" y="34" width="7" height="2" fill="#4b3428"/><rect x="17" y="34" width="7" height="2" fill="#4b3428"/>
          <rect x="9" y="33" width="5" height="2" fill="#ffe5b5"/><rect x="18" y="33" width="5" height="2" fill="#ffe5b5"/>
          <rect x="10" y="33" width="1" height="1" fill="#d69a6d"/><rect x="12" y="33" width="1" height="1" fill="#d69a6d"/><rect x="19" y="33" width="1" height="1" fill="#d69a6d"/><rect x="21" y="33" width="1" height="1" fill="#d69a6d"/>
        </g>
        <g id="body">
          <rect x="9" y="20" width="14" height="12" fill="#4b3428"/>
          <rect x="8" y="23" width="16" height="6" fill="#4b3428"/>
          <rect x="10" y="20" width="12" height="11" fill="#ef9950"/>
          <rect x="9" y="23" width="14" height="5" fill="#ef9950"/>
          <rect x="11" y="21" width="10" height="7" fill="#ffc77b"/>
        </g>
        <g id="arms">
          <rect x="5" y="22" width="5" height="8" fill="#4b3428"/><rect x="22" y="22" width="5" height="8" fill="#4b3428"/>
          <rect x="6" y="23" width="3" height="6" fill="#ef9950"/><rect x="23" y="23" width="3" height="6" fill="#ef9950"/>
          <rect x="5" y="27" width="5" height="4" fill="#4b3428"/><rect x="22" y="27" width="5" height="4" fill="#4b3428"/>
          <rect x="6" y="28" width="3" height="2" fill="#ffe5b5"/><rect x="23" y="28" width="3" height="2" fill="#ffe5b5"/>
          <rect x="6" y="29" width="1" height="1" fill="#d69a6d"/><rect x="8" y="29" width="1" height="1" fill="#d69a6d"/><rect x="23" y="29" width="1" height="1" fill="#d69a6d"/><rect x="25" y="29" width="1" height="1" fill="#d69a6d"/>
        </g>
        <g id="bib">
          <rect x="11" y="20" width="10" height="2" fill="#4b3428"/><rect x="10" y="21" width="12" height="5" fill="#4b3428"/>
          <rect x="12" y="20" width="8" height="2" fill="#ee779c"/><rect x="11" y="22" width="10" height="3" fill="#f39ab5"/>
          <rect x="15" y="24" width="3" height="3" fill="#4b3428"/><rect x="16" y="24" width="1" height="2" fill="#ffd45f"/><rect x="15" y="25" width="3" height="1" fill="#ffd45f"/>
        </g>
        <g id="head">
          <!-- ears -->
          <rect x="6" y="6" width="6" height="7" fill="#4b3428"/><rect x="20" y="6" width="6" height="7" fill="#4b3428"/>
          <rect x="7" y="5" width="4" height="6" fill="#4b3428"/><rect x="21" y="5" width="4" height="6" fill="#4b3428"/>
          <rect x="8" y="7" width="2" height="3" fill="#f2a07d"/><rect x="22" y="7" width="2" height="3" fill="#f2a07d"/>
          <!-- head silhouette -->
          <rect x="7" y="9" width="18" height="11" fill="#4b3428"/><rect x="6" y="12" width="20" height="6" fill="#4b3428"/>
          <rect x="8" y="9" width="16" height="10" fill="#ef9950"/><rect x="7" y="12" width="18" height="5" fill="#ef9950"/>
          <rect x="9" y="17" width="14" height="3" fill="#4b3428"/><rect x="10" y="17" width="12" height="2" fill="#ffc77b"/>
          <!-- forehead stripes -->
          <rect x="13" y="9" width="2" height="2" fill="#b9622e"/><rect x="17" y="9" width="2" height="2" fill="#b9622e"/><rect x="15" y="10" width="2" height="2" fill="#b9622e"/>
        </g>
        <g id="face">
          <!-- eyes -->
          <rect x="10" y="12" width="4" height="4" fill="#4b3428"/><rect x="18" y="12" width="4" height="4" fill="#4b3428"/>
          <rect x="11" y="12" width="2" height="3" fill="#2e2524"/><rect x="19" y="12" width="2" height="3" fill="#2e2524"/>
          <rect x="11" y="12" width="1" height="1" fill="#fff7df"/><rect x="19" y="12" width="1" height="1" fill="#fff7df"/>
          <!-- cheeks + muzzle -->
          <rect x="8" y="16" width="3" height="1" fill="#f08d83"/><rect x="21" y="16" width="3" height="1" fill="#f08d83"/>
          <rect x="12" y="15" width="8" height="4" fill="#ffe5b5"/><rect x="11" y="16" width="10" height="2" fill="#ffe5b5"/>
          <rect x="15" y="15" width="2" height="2" fill="#4b3428"/><rect x="15" y="15" width="2" height="1" fill="#c65f5f"/>
          <rect x="14" y="17" width="1" height="1" fill="#4b3428"/><rect x="17" y="17" width="1" height="1" fill="#4b3428"/><rect x="15" y="18" width="2" height="1" fill="#4b3428"/>
          <!-- whiskers -->
          <rect x="5" y="15" width="4" height="1" fill="#4b3428"/><rect x="23" y="15" width="4" height="1" fill="#4b3428"/>
          <rect x="6" y="17" width="3" height="1" fill="#4b3428"/><rect x="23" y="17" width="3" height="1" fill="#4b3428"/>
        </g>
        <g id="bow">
          <rect x="4" y="5" width="5" height="5" fill="#4b3428"/><rect x="8" y="6" width="4" height="4" fill="#4b3428"/>
          <rect x="5" y="6" width="3" height="3" fill="#ee779c"/><rect x="9" y="7" width="2" height="2" fill="#f39ab5"/><rect x="8" y="6" width="2" height="3" fill="#d95d87"/>
        </g>
      </svg>
    </div>
    <div class="note">这版完全用网页里的 SVG 像素块绘制，不依赖外部图片。后续如果方向成立，正背面会共用身体比例与配件规则，再接走路动画。</div>
  </div>
</div>
</body>
</html>
