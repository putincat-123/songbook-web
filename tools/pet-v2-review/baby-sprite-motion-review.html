<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baby Sprite 动作 Review v2</title><style>*{box-sizing:border-box}body{margin:0;background:#efe7da;color:#58483f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:520px;margin:auto;padding:12px}.card{background:#fff8ee;border-radius:20px;padding:14px;box-shadow:0 8px 24px #725f4a22}.stage{height:330px;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#cfe3e5 0 44%,#ead8b9 44% 76%,#b69d76 76%)}.floor{position:absolute;left:0;right:0;bottom:0;height:56%;background:repeating-linear-gradient(90deg,#c4a67b 0 76px,#b9956b 76px 80px)}.cat{position:absolute;left:46%;bottom:58px;width:108px;height:108px;transform:translateX(-50%);transform-origin:50% 100%}.baby{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 4px 0 #6d53352b)}.cat.walk{animation:walk .34s steps(2,end) infinite}.cat.box{animation:box .5s steps(2,end) 3}.boxprop{position:absolute;left:67%;bottom:63px;font-size:70px;transform-origin:50% 90%}.boxprop.shake{animation:shake .12s steps(2,end) 8}@keyframes walk{0%,100%{translate:-6px 0;scale:.98 1.02}50%{translate:6px -3px;scale:1.02 .98}}@keyframes box{0%,100%{translate:0 0}50%{translate:7px -2px;rotate:3deg}}@keyframes shake{25%{rotate:-7deg}75%{rotate:7deg}}.controls{display:flex;gap:8px;margin-top:10px}.controls button{flex:1;border:0;border-radius:12px;padding:13px 8px;background:#dfd1bd;color:#57463c;font-weight:800}.controls button:last-child{background:#e8b76b}.note{font-size:12px;line-height:1.55;color:#806d60;margin:10px 2px 0}</style><script src="baby-sprites.js?v=1"></script></head><body><main><h2>Baby 动作接入测试</h2><div class="card"><div class="stage"><div class="floor"></div><div class="cat" id="cat"><img class="baby" id="baby" alt="Baby"></div><div class="boxprop" id="box">🎁</div></div><div class="controls"><button id="idle">待机</button><button id="walk">走路</button><button id="draw">抽盲盒</button></div><p class="note">这一版已经使用实际 Baby PNG sprite。先验证角色在网页里的尺寸、落地感与动作节奏，再同步进卷轴主测试页。</p></div></main><script>const cat=document.getElementById('cat'),box=document.getElementById('box'),baby=document.getElementById('baby');const sprite=window.BABY_SPRITES.walk1;baby.src=sprite;document.getElementById('idle').onclick=()=>{cat.className='cat';box.className='boxprop'};document.getElementById('walk').onclick=()=>{cat.className='cat walk';box.className='boxprop'};document.getElementById('draw').onclick=()=>{cat.className='cat box';box.className='boxprop shake';setTimeout(()=>{cat.className='cat';box.className='boxprop'},1600)};</script></body></html>
