<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baby Cat Paperdoll Review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efe9e2;color:#5c4b43;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:520px;margin:auto;padding:18px 14px 30px}h1{font-size:21px;margin:0 0 6px}.sub{font-size:12px;line-height:1.65;color:#86766d;margin:0 0 14px}.card{background:#fffaf5;border:1px solid #e9ddd2;border-radius:22px;padding:14px;box-shadow:0 8px 26px rgba(82,65,54,.08)}.stage{height:520px;border-radius:18px;background:linear-gradient(#fffdf9,#f0e6dc);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.floor{position:absolute;left:14%;right:14%;bottom:48px;height:36px;border-radius:50%;background:rgba(92,75,67,.08)}svg{width:340px;max-width:94%;height:auto;image-rendering:pixelated}.note{margin-top:12px;font-size:12px;line-height:1.7;color:#786860}.note b{color:#59473f}
</style>
</head>
<body>
<main>
<h1>Baby 猫 · 精致像素纸偶风</h1>
<p class="sub">只看角色造型。用 SVG code 做成容易拆分、转身和做动作的块面角色，但避免“纸箱占位图”的粗糙感。</p>
<section class="card"><div class="stage"><div class="floor"></div>
<svg viewBox="0 0 260 340" aria-label="baby cat paperdoll">
<defs>
 <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="0" flood-color="#4f3f38" flood-opacity=".18"/></filter>
</defs>
<g filter="url(#shadow)" stroke="#5b463d" stroke-width="7" stroke-linejoin="round" stroke-linecap="square">
 <!-- tail -->
 <path d="M173 232h25v-12h18v-18h16v55h-16v16h-18v14h-25z" fill="#d89452"/>
 <path d="M198 220h18v-18h16v18h-16v18h-18z" fill="#f0ae61" stroke="none"/>

 <!-- body -->
 <path d="M88 181h84v18h12v73h-12v20h-24v15h-36v-15H88v-20H76v-73h12z" fill="#e6a45c"/>
 <path d="M96 196h68v64H96z" fill="#efb66e" stroke="none"/>

 <!-- legs -->
 <path d="M94 260h34v41h-9v14H87v-15h7z" fill="#e0a05a"/>
 <path d="M132 260h34v40h7v15h-32v-14h-9z" fill="#e0a05a"/>
 <path d="M87 296h41v20H87z" fill="#fff0d2"/>
 <path d="M132 296h41v20h-41z" fill="#fff0d2"/>
 <path d="M96 301v9M108 301v9M144 301v9M156 301v9" fill="none" stroke-width="4"/>

 <!-- arms -->
 <path d="M80 207H62v14H51v44h12v13h24v-16H75v-42h13z" fill="#e3a259"/>
 <path d="M180 207h18v14h11v44h-12v13h-24v-16h12v-42h-13z" fill="#e3a259"/>
 <path d="M51 253h31v28H51z" fill="#fff0d2"/>
 <path d="M178 253h31v28h-31z" fill="#fff0d2"/>
 <path d="M58 263h17M185 263h17" fill="none" stroke-width="4"/>

 <!-- head silhouette -->
 <path d="M70 85V52h18V34h24l18 19 18-19h24v18h18v33h15v63h-15v17h-22v13H92v-13H70v-17H55V85z" fill="#e7a65f"/>
 <!-- inner ears -->
 <path d="M78 57V45h14l17 21H89zM182 57V45h-14l-17 21h20z" fill="#eda0a3" stroke="none"/>
 <!-- face cream -->
 <path d="M83 92h94v14h11v39h-12v15h-23v12h-46v-12H84v-15H72v-39h11z" fill="#ffe9c6" stroke="none"/>
 <!-- forehead stripes -->
 <path d="M111 68v18M130 64v24M149 68v18" fill="none" stroke="#b96f42" stroke-width="6"/>
 <!-- eyes -->
 <path d="M96 112h19v12H96zM145 112h19v12h-19z" fill="#4d3b34" stroke="none"/>
 <path d="M101 114h5v5h-5zM150 114h5v5h-5z" fill="#fff" stroke="none"/>
 <!-- nose + mouth -->
 <path d="M122 132h16v9h-4v6h-8v-6h-4z" fill="#c77b7f" stroke="none"/>
 <path d="M130 147v7M130 154h-11v8M130 154h11v8" fill="none" stroke-width="4"/>
 <!-- cheeks -->
 <path d="M89 139h14v7H89zM157 139h14v7h-14z" fill="#efaaa8" stroke="none"/>
 <!-- whiskers -->
 <path d="M83 131H62M83 142H58M177 131h21M177 142h25" fill="none" stroke-width="4"/>

 <!-- head bow -->
 <path d="M69 60H54V46H39V71h15v-6h15z" fill="#ef9eb9"/>
 <path d="M69 60h15V46h15V71H84v-6H69z" fill="#f6b0c7"/>
 <path d="M64 55h12v12H64z" fill="#e981a7"/>

 <!-- bib -->
 <path d="M91 181h78v17h-9v24h-20l-10 11-10-11h-20v-24h-9z" fill="#f3a9c0"/>
 <path d="M103 190h54v11h-54z" fill="#ffd1de" stroke="none"/>
 <!-- bell -->
 <path d="M118 219h24v20h-24z" fill="#f4c95c"/>
 <path d="M124 225h12v8h-12z" fill="#ffe889" stroke="none"/>
</g>
</svg>
</div>
<div class="note"><b>这版的重点：</b>脸和身体仍然是块面，但不再是简单方盒；手、脚、尾巴、围兜、蝴蝶结都已经按以后动画拆层来画。优先判断它有没有比之前更“像游戏角色”，同时又保持纸偶风好做动作的优势。</div>
</section>
</main>
</body>
</html>
