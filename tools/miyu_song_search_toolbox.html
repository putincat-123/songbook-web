<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿歌单查询</title><style>:root{--b:#2563eb;--m:#6b7280;--l:#e5e7eb;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#eff6ff,#fff);color:#1f2937}.app{max-width:900px;margin:auto;padding:16px}.hero,.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:18px;box-shadow:0 6px 20px rgba(15,23,42,.06)}.hero{margin-bottom:12px}.eyebrow{font-size:12px;font-weight:900;color:var(--b);letter-spacing:.12em}.hero h1{margin:6px 0;font-size:28px}.hint{color:var(--m);font-size:13px;line-height:1.6}.toolbar{position:sticky;top:0;z-index:3;background:rgba(248,250,252,.95);padding:10px 0}.search{display:grid;grid-template-columns:1fr auto auto;gap:8px}input,button{font:inherit}input{min-width:0;border:1px solid var(--l);border-radius:14px;padding:12px;font-size:16px}button{border:1px solid var(--l);background:#fff;border-radius:14px;padding:11px 13px;font-weight:800}.primary{background:var(--b);color:#fff;border-color:var(--b)}.meta{margin:10px 2px;color:var(--m);font-size:13px}.list{display:grid;gap:9px}.song{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--l);border-radius:16px;padding:11px}.seq{width:40px;height:40px;display:grid;place-items:center;background:#f1f5f9;border-radius:12px;color:#64748b;font-size:12px;font-weight:900}.name{font-weight:900;line-height:1.35}.artist{color:var(--m);font-size:13px;margin-top:3px}.copy{border-color:#bae6fd;background:#f0f9ff;color:#0284c7;padding:7px 10px;border-radius:999px}.empty{padding:28px;text-align:center;color:var(--m);background:#fff;border:1px dashed var(--l);border-radius:16px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:999px;padding:10px 16px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:560px){.app{padding:12px}.hero h1{font-size:25px}.song{grid-template-columns:38px 1fr auto}.seq{width:36px;height:36px}.search{grid-template-columns:1fr auto auto}}</style></head><body><main class="app"><section class="hero"><div class="eyebrow">MIYU SONGBOOK</div><h1>谜屿歌单查询</h1><div class="hint">主播工具箱模式 · 查询与小耳朵共用同一份曲库；复制只复制歌名。</div></section><section class="toolbar"><div class="search"><input id="q" type="search" placeholder="搜歌名 / 歌手" disabled><button id="clear" disabled>清空</button><button class="primary" id="random" disabled>随机</button></div><div id="meta" class="meta">载入中…</div></section><section id="list" class="list"><div class="empty">正在载入歌单…</div></section></main><div id="toast" class="toast"></div><script>(()=>{const $=id=>document.getElementById(id),q=$('q'),list=$('list'),meta=$('meta');let songs=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>e.classList.remove('show'),1200)}async function copy(t){try{await navigator.clipboard.writeText(t)}catch{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast('已复制：'+t)}function norm(s,i){const name=String(s?.name||s?.songName||'').trim();if(!name)return null;return{seq:s?.seq||i+1,name,artist:String(s?.artist||'').trim(),key:(name+' '+(s?.artist||'')).toLowerCase()}}function render(){const k=q.value.trim().toLowerCase();const rows=(k?songs.filter(s=>s.key.includes(k)):songs).slice(0,k?300:200);meta.textContent=`共 ${songs.length} 首 · 当前显示 ${rows.length} 首`;list.innerHTML=rows.length?rows.map(s=>`<article class="song"><div class="seq">${esc(s.seq)}</div><div><div class="name">${esc(s.name)}</div><div class="artist">${esc(s.artist||'未知歌手')}</div></div><button class="copy" data-copy="${esc(s.name)}">复制</button></article>`).join(''):'<div class="empty">找不到符合的歌曲</div>';list.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy))}async function load(){try{const urls=['../data/miyu/songs.json?t='+Date.now(),'https://raw.githubusercontent.com/putincat-123/songbook-web/main/data/miyu/songs.json?t='+Date.now()];let raw=null,err=null;for(const u of urls){try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),8000),r=await fetch(u,{cache:'no-store',signal:c.signal});clearTimeout(tm);if(!r.ok)throw new Error('HTTP '+r.status);raw=await r.json();break}catch(e){err=e}}if(!raw)throw err||new Error('load failed');const arr=Array.isArray(raw)?raw:(raw.songs||raw.data||[]);songs=arr.map(norm).filter(Boolean);q.disabled=false;$('clear').disabled=false;$('random').disabled=false;render()}catch(e){console.error(e);meta.textContent='载入失败';list.innerHTML='<div class="empty">歌单载入失败，请重新整理再试。</div>'}}q.addEventListener('input',render);$('clear').onclick=()=>{q.value='';render()};$('random').onclick=()=>{if(!songs.length)return;const s=songs[Math.floor(Math.random()*songs.length)];q.value=s.name;render()};load()})();</script></body></html>
