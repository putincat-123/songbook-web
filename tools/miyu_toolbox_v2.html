<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>miyu工具箱 V2</title><link rel="stylesheet" href="./miyu_toolbox_v2.css?v=1"></head><body><main class="app"><div class="title">miyu工具箱</div><div class="subtitle">点歌与直播辅助工具 · V2</div><nav class="tabs"><button class="tab-btn active" data-tab="daily">每日推荐</button><button class="tab-btn" data-tab="songSearch">曲库查询</button><button class="tab-btn" data-tab="blind">盲盒点歌</button><button class="tab-btn" data-tab="hot">热门推荐</button><button class="tab-btn" data-tab="data">资料工具</button></nav><section id="daily" class="panel active"><div class="card daily-hero"><div class="daily-date" id="dailyDate">TODAY</div><h2>🎧 今日推荐歌单</h2><div class="hint">每天自动排一组约 10 首，同一天固定。</div><div class="hint daily-summary" id="dailySummary">载入中…</div></div><div id="dailyGroups" class="daily-flow"><div class="daily-empty">正在准备今日直播歌单…</div></div><div class="topic-section"><div class="topic-title">💬 今日话题卡</div><div class="hint">直播时可直接拿来开聊的话题。</div><div id="dailyTopics" class="topic-grid"><div class="daily-empty">载入中…</div></div></div></section><section id="songSearch" class="panel"><div class="card"><h2>曲库查询</h2><div class="hint">与小耳朵使用的歌曲查询共用同一套歌单。</div></div><div class="frame-wrap"><iframe id="songSearchFrame" data-src="../?streamer=miyu&toolbox=1" title="曲库查询"></iframe></div></section><section id="blind" class="panel"><div class="card artist-box"><h2>🎤 歌手盲盒</h2><div class="hint">选歌手开盒，同一轮不重复。</div><div class="artist-chips" id="artistChips"><span class="hint">载入中…</span></div><div class="artist-form"><input id="artistBoxInput" list="artistOptions" placeholder="输入歌手，例如：周杰伦"><datalist id="artistOptions"></datalist><button class="tool-btn primary" id="artistOpenBtn">🎁 开盒</button><button class="tool-btn" id="randomArtistBtn">✨ 随机歌手</button></div><div class="artist-status" id="artistBoxStatus">尚未载入曲库</div><div class="artist-result" id="artistBoxResult"><div class="song" id="artistBoxSong">—</div><div id="artistBoxSinger"></div><div id="artistBoxRound"></div><div class="blind-actions"><button class="tool-btn primary" id="artistAgainBtn">🎲 再抽一首</button><button class="tool-btn" id="artistCopyBtn">复制歌名</button><button class="tool-btn" id="artistChangeBtn">换歌手</button></div></div></div><div class="frame-wrap"><iframe id="blindFrame" data-src="./miyu_toolbox_legacy.html?embed=1#blindPanel" title="盲盒点歌"></iframe></div></section><section id="hot" class="panel"><div class="frame-wrap"><iframe id="hotFrame" data-src="./miyu_toolbox_legacy.html?embed=1#hotRecommendPanel" title="热门推荐"></iframe></div></section><section id="data" class="panel"><div class="frame-wrap"><iframe id="dataFrame" data-src="./miyu_toolbox_legacy.html?embed=1#dataPanel" title="资料工具"></iframe></div></section></main><div id="toast" class="toast"></div><script src="./miyu_toolbox_v2.js?v=1"></script></body></html>
