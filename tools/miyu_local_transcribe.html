<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Miyu 本机转录</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--ok:#16a34a;--warn:#d97706;--danger:#dc2626;--shadow:0 6px 20px rgba(15,23,42,.08);--radius:16px}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}.app{max-width:920px;margin:0 auto;padding:16px 16px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:28px;font-weight:800}.sub,.hint{color:var(--muted);line-height:1.6}.sub{font-size:14px;margin:8px 0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}.card h3{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;background:#fff;color:var(--text)}textarea{min-height:280px;resize:vertical;line-height:1.55}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:none;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}.status{display:flex;align-items:center;gap:8px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%;background:#94a3b8}.dot.live{background:var(--ok);box-shadow:0 0 0 5px rgba(22,163,74,.12)}.dot.warn{background:#f59e0b;box-shadow:0 0 0 5px rgba(245,158,11,.12)}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:12px}.progress>div{height:100%;width:0;background:var(--brand);transition:width .2s}.notice{background:#fffbeb;color:#92400e;border:1px solid #fde68a;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55}.okbox{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55}.back{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:12px;font-weight:800;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.metric{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fafafa}.metric small{display:block;color:var(--muted);margin-bottom:6px}.metric strong{font-size:20px}@media(max-width:720px){.app{padding:12px 10px 72px}.title{font-size:23px}.grid{grid-template-columns:1fr}.c12,.c6,.c4,.c8{grid-column:1/-1}.metrics{grid-template-columns:1fr}.btns{flex-direction:column}.btns button{width:100%;min-height:48px}input,select,textarea{font-size:16px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="title">📝 本机 Whisper 转录</div><button class="back" onclick="location.href='./miyu_ai_listener.html'">← 回 AI 旁听</button></div>
  <div class="sub">V0.2：改用 WebCodecs 解码，不再用浏览器一次性 decodeAudioData 读取整场录音，比较适合 1～3 小时长音频。</div>

  <div class="card">
    <h3>1. 选择录音</h3>
    <div class="grid">
      <div class="c8"><label>音频文件</label><input id="audioFile" type="file" accept="audio/*,.webm,.mp3,.wav,.m4a,.ogg,.mp4"></div>
      <div class="c4"><label>模型</label><select id="model"><option value="whisper-tiny">Tiny｜约 64 MB，先测试</option><option value="whisper-base" selected>Base｜约 136 MB，建议</option><option value="whisper-small">Small｜约 510 MB，更准</option></select></div>
      <div class="c6"><label>语言</label><select id="language"><option value="zh" selected>中文</option><option value="en">英文</option><option value="ja">日文</option><option value="ko">韩文</option></select></div>
      <div class="c6"><label>运行方式</label><input id="deviceTextTop" value="自动：优先 WebGPU，必要时回退" disabled></div>
    </div>
    <div class="btns"><button id="startBtn" class="primary">▶ 开始转录</button><button id="stopBtn" class="ghost" disabled>停止</button></div>
    <div id="notice" class="notice" style="margin-top:12px">第一次会下载模型。建议先拿 5～10 分钟录音测试；确认可用后再跑两小时整场。</div>
  </div>

  <div class="card">
    <h3>2. 转录状态</h3>
    <div class="status"><span id="dot" class="dot"></span><span id="status">待机</span></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="metrics"><div class="metric"><small>文件</small><strong id="fileName">-</strong></div><div class="metric"><small>已识别段落</small><strong id="segments">0</strong></div><div class="metric"><small>浏览器能力</small><strong id="deviceText">检测中</strong></div></div>
  </div>

  <div class="card">
    <h3>3. 结果</h3>
    <textarea id="result" placeholder="转录过程中会逐段显示"></textarea>
    <div class="btns"><button id="srtBtn" class="ghost" disabled>⬇ 下载 SRT</button><button id="txtBtn" class="ghost" disabled>⬇ 下载 TXT</button><button id="copyBtn" class="ghost" disabled>复制全文</button></div>
    <div class="hint">给 AI 找高光时请下载 SRT，这样每段都有时间码。</div>
  </div>

  <div class="okbox">🔒 录音在浏览器本机解码与转录；模型文件来自 Hugging Face，录音本身不会上传到本站服务器。</div>
</div>
<script type="module">
const $=id=>document.getElementById(id);
let controller=null,lastSrt='',lastTxt='';
const segs=[];
function fmt(s){s=Math.max(0,Number(s)||0);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60),ms=Math.round((s-Math.floor(s))*1000);return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')},${String(ms).padStart(3,'0')}`}
function fmtShort(s){s=Math.max(0,Math.floor(Number(s)||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function save(text,name,type='text/plain'){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function setStatus(text,state=''){ $('status').textContent=text;$('dot').className='dot'+(state?' '+state:'') }
function buildSrt(list){return list.map((c,i)=>`${i+1}\n${fmt(c.start)} --> ${fmt(c.end)}\n${String(c.text||'').trim()}\n`).join('\n')}
function refresh(){ $('segments').textContent=segs.length;$('result').value=segs.map(c=>`[${fmtShort(c.start)}] ${String(c.text||'').trim()}`).join('\n');$('result').scrollTop=$('result').scrollHeight }
const gpu=('gpu' in navigator);$('deviceText').textContent=gpu?'WebGPU ✓':'WebGPU 无';
if(!crossOriginIsolated){$('notice').textContent+=' 当前页面不是 cross-origin isolated；WebGPU 通常仍可用，但部分 WASM 多线程回退可能受限。'}
$('audioFile').onchange=()=>{const f=$('audioFile').files?.[0];$('fileName').textContent=f?f.name.slice(0,26):'-'};
$('startBtn').onclick=async()=>{
  const file=$('audioFile').files?.[0];if(!file)return alert('请先选择录音文件。');
  controller=new AbortController();segs.length=0;lastSrt=lastTxt='';refresh();
  $('startBtn').disabled=true;$('stopBtn').disabled=false;$('srtBtn').disabled=$('txtBtn').disabled=$('copyBtn').disabled=true;
  try{
    setStatus('正在载入转录引擎…','warn');$('bar').style.width='3%';
    const { BrowserWhisper }=await import('https://esm.sh/browser-whisper@0.8.1?bundle');
    const whisper=new BrowserWhisper({model:$('model').value,language:$('language').value});
    setStatus('正在解码并转录…','live');
    const stream=whisper.transcribe(file,{
      signal:controller.signal,
      onProgress:p=>{const v=Math.max(0,Math.min(1,Number(p?.progress)||0));$('bar').style.width=Math.max(5,Math.round(v*95))+'%';if(p?.stage)setStatus(`处理中：${p.stage} ${Math.round(v*100)}%`,p.stage==='transcribing'?'live':'warn')},
      onSegment:s=>{if(!s)return;const x={text:s.text||'',start:Number(s.start)||0,end:Number(s.end)||Number(s.start)||0};if(!segs.some(a=>a.start===x.start&&a.end===x.end&&a.text===x.text)){segs.push(x);refresh()}}
    });
    for await(const s of stream){if(controller.signal.aborted)throw new DOMException('Aborted','AbortError');if(s){const x={text:s.text||'',start:Number(s.start)||0,end:Number(s.end)||Number(s.start)||0};if(!segs.some(a=>a.start===x.start&&a.end===x.end&&a.text===x.text)){segs.push(x);refresh()}}}
    lastTxt=segs.map(x=>String(x.text||'').trim()).filter(Boolean).join('\n');lastSrt=buildSrt(segs);$('bar').style.width='100%';setStatus(`转录完成 ✓ 共 ${segs.length} 段`,'live');$('srtBtn').disabled=$('txtBtn').disabled=$('copyBtn').disabled=!segs.length;
  }catch(e){console.error(e);if(e?.name==='AbortError'){setStatus('已停止','')}else{setStatus('转录失败','');$('notice').textContent='失败：'+(e?.message||e)+'。请截图这行错误给我，我会继续修。'}}finally{$('startBtn').disabled=false;$('stopBtn').disabled=true;controller=null}
};
$('stopBtn').onclick=()=>controller?.abort();
$('srtBtn').onclick=()=>save(lastSrt,`miyu_transcript_${Date.now()}.srt`,'application/x-subrip');
$('txtBtn').onclick=()=>save(lastTxt,`miyu_transcript_${Date.now()}.txt`);
$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('result').value);$('copyBtn').textContent='已复制 ✓';setTimeout(()=>$('copyBtn').textContent='复制全文',1200)};
</script>
</body>
</html>
