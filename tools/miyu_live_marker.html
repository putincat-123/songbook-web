<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Miyu 直播标记器</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--blue:#2563eb;--pink:#db2777;--gold:#d97706;--shadow:0 8px 28px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:640px;margin:0 auto;padding:14px 12px calc(28px + env(safe-area-inset-bottom))}.title{font-size:25px;font-weight:800}.sub{font-size:13px;color:var(--muted);line-height:1.55;margin:6px 0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}.clock{font-size:38px;font-weight:900;letter-spacing:.5px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.muted{color:var(--muted);font-size:13px}.state{font-size:20px;font-weight:800;margin-top:8px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:18px;padding:22px 10px;font-size:21px;font-weight:900;box-shadow:0 4px 14px rgba(15,23,42,.08);background:#fff;cursor:pointer}.btn:active{transform:scale(.985)}.chat{background:#eff6ff;color:#1d4ed8;border:2px solid #bfdbfe}.song{background:#fdf2f8;color:#be185d;border:2px solid #fbcfe8}.highlight{grid-column:1/-1;background:#fffbeb;color:#b45309;border:2px solid #fde68a;font-size:23px}.smallBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.small{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:800;font-size:15px}.timeline{max-height:330px;overflow:auto;border-top:1px solid var(--line);margin-top:10px;padding-top:6px}.item{display:grid;grid-template-columns:80px 1fr auto;gap:8px;align-items:center;padding:10px 2px;border-bottom:1px solid #f0f1f3}.tag{font-weight:800}.note{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px}.danger{color:#b91c1c}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#f3f4f6;color:#4b5563}.activeChat{box-shadow:0 0 0 4px rgba(37,99,235,.12)}.activeSong{box-shadow:0 0 0 4px rgba(219,39,119,.12)}
</style>
</head>
<body>
<div class="app">
  <div class="title">🎙️ Miyu 直播标记器</div>
  <div class="sub">手机听直播时只做轻量时间标记，不跑 AI、不分析音频。下播后再把聊天段交给 ASR。</div>

  <div class="card">
    <div class="row"><span class="pill" id="sessionState">尚未开始</span><span class="muted" id="startText">-</span></div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="state" id="currentState">当前：未标记</div>
  </div>

  <div class="card">
    <div class="buttons">
      <button id="chatBtn" class="btn chat">💬 聊天</button>
      <button id="songBtn" class="btn song">🎵 唱歌</button>
      <button id="highlightBtn" class="btn highlight">⭐ 高光</button>
    </div>
    <div style="margin-top:10px"><input id="note" class="note" placeholder="可选备注，例如：讲小时候、冷笑话、练歌经历"></div>
    <div class="smallBtns">
      <button id="undoBtn" class="small">↩ 撤销上一步</button>
      <button id="endBtn" class="small">⏹ 结束本场</button>
    </div>
  </div>

  <div class="card">
    <div class="row"><strong>时间轴</strong><span class="muted" id="count">0 条</span></div>
    <div id="timeline" class="timeline"><div class="muted" style="padding:14px 2px">按下聊天／唱歌后，这里会记录切换时间。</div></div>
  </div>

  <div class="card">
    <div class="smallBtns">
      <button id="exportBtn" class="small">⬇ 导出 JSON</button>
      <button id="copyBtn" class="small">📋 复制时间轴</button>
    </div>
    <div class="smallBtns">
      <button id="newBtn" class="small">🆕 新开一场</button>
      <button id="clearBtn" class="small danger">🗑 清空</button>
    </div>
    <div class="muted" style="margin-top:10px">数据保存在当前手机浏览器 localStorage。刷新页面不会丢，但清除浏览器网站数据会消失。</div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const KEY='miyu_live_marker_v1';
let data=load()||{version:1,startedAt:null,endedAt:null,current:null,events:[]};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function pad(n){return String(n).padStart(2,'0')}
function fmtElapsed(ms){ms=Math.max(0,ms||0);const s=Math.floor(ms/1000);return `${pad(Math.floor(s/3600))}:${pad(Math.floor((s%3600)/60))}:${pad(s%60)}`}
function fmtClock(ts){const d=new Date(ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function elapsedAt(ts){return data.startedAt?fmtElapsed(ts-data.startedAt):'00:00:00'}
function ensureStarted(){if(!data.startedAt){data.startedAt=Date.now();data.endedAt=null}}
function addState(type){ensureStarted();const now=Date.now();if(data.current===type)return;data.current=type;data.events.push({type,ts:now,elapsedMs:now-data.startedAt,note:$('note').value.trim()||''});$('note').value='';save();if(navigator.vibrate)navigator.vibrate(30)}
function addHighlight(){ensureStarted();const now=Date.now();data.events.push({type:'highlight',ts:now,elapsedMs:now-data.startedAt,state:data.current,note:$('note').value.trim()||''});$('note').value='';save();if(navigator.vibrate)navigator.vibrate([40,40,40])}
function render(){const now=data.endedAt||Date.now();$('clock').textContent=data.startedAt?fmtElapsed(now-data.startedAt):'00:00:00';$('sessionState').textContent=data.endedAt?'已结束':data.startedAt?'进行中':'尚未开始';$('startText').textContent=data.startedAt?`开始 ${fmtClock(data.startedAt)}`:'-';$('currentState').textContent='当前：'+(data.current==='chat'?'💬 聊天':data.current==='song'?'🎵 唱歌':'未标记');$('chatBtn').classList.toggle('activeChat',data.current==='chat');$('songBtn').classList.toggle('activeSong',data.current==='song');$('count').textContent=`${data.events.length} 条`;const tl=$('timeline');if(!data.events.length){tl.innerHTML='<div class="muted" style="padding:14px 2px">按下聊天／唱歌后，这里会记录切换时间。</div>';return}tl.innerHTML=[...data.events].reverse().map((e,ri)=>{const i=data.events.length-ri;const label=e.type==='chat'?'💬 聊天':e.type==='song'?'🎵 唱歌':'⭐ 高光';const extra=e.note?`<div class="muted">${escapeHtml(e.note)}</div>`:'';return `<div class="item"><span class="muted">${elapsedAt(e.ts)}</span><div><div class="tag">${label}</div>${extra}</div><span class="muted">${fmtClock(e.ts)}</span></div>`}).join('')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function buildSegments(){const states=data.events.filter(e=>e.type==='chat'||e.type==='song');const out=[];for(let i=0;i<states.length;i++){const e=states[i];const end=states[i+1]?.ts||data.endedAt||Date.now();out.push({type:e.type,startTs:e.ts,endTs:end,startElapsedMs:e.ts-data.startedAt,endElapsedMs:end-data.startedAt,note:e.note||''})}return out}
function exportData(){const payload={...data,segments:buildSegments(),exportedAt:Date.now()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`miyu_marker_${new Date(data.startedAt||Date.now()).toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function copyTimeline(){const lines=data.events.map(e=>`${elapsedAt(e.ts)} ${e.type==='chat'?'💬聊天':e.type==='song'?'🎵唱歌':'⭐高光'}${e.note?'｜'+e.note:''}`);navigator.clipboard.writeText(lines.join('\n')).then(()=>{const b=$('copyBtn');const old=b.textContent;b.textContent='已复制 ✓';setTimeout(()=>b.textContent=old,1200)})}
$('chatBtn').onclick=()=>addState('chat');$('songBtn').onclick=()=>addState('song');$('highlightBtn').onclick=addHighlight;
$('undoBtn').onclick=()=>{if(!data.events.length)return;data.events.pop();const last=[...data.events].reverse().find(e=>e.type==='chat'||e.type==='song');data.current=last?.type||null;save()};
$('endBtn').onclick=()=>{if(!data.startedAt)return;data.endedAt=Date.now();save()};$('exportBtn').onclick=exportData;$('copyBtn').onclick=copyTimeline;
$('newBtn').onclick=()=>{if(!confirm('开始新的一场？当前记录会被清空，请先导出需要保留的数据。'))return;data={version:1,startedAt:Date.now(),endedAt:null,current:null,events:[]};save()};
$('clearBtn').onclick=()=>{if(!confirm('确定清空当前记录？'))return;data={version:1,startedAt:null,endedAt:null,current:null,events:[]};save()};
setInterval(()=>render(),1000);render();
</script>
</body>
</html>
