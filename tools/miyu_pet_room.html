<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>临海居宠物小屋</title>
<style>
:root{--bg:#f5efe6;--text:#2f241f;--line:#d8c6b2;--brand:#6b4a39}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:680px;margin:0 auto;padding:12px 10px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.title{font-size:21px;font-weight:950}.back{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:999px;padding:8px 12px;font-weight:900;text-decoration:none}.tabs{display:none}.panel{display:none}.panel.active{display:block}.loading{padding:40px 18px;text-align:center;font-weight:900;color:#765c4f}.error{display:none;margin:16px auto;max-width:580px;padding:16px;border:2px solid #d07b68;background:#fff4ee;border-radius:14px;line-height:1.6;font-weight:800}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="title">🐾 临海居宠物小屋</div><a class="back" href="./miyu_toolbox.html?streamer=miyu">← 返回工具箱</a></div>
  <nav class="tabs" aria-label="宠物工具"></nav>
  <div id="loading" class="loading">正在打开宠物小屋…</div>
  <div id="petError" class="error">宠物页面载入失败，请重新整理一次页面。</div>
</div>
<script>
(function(){
  const stamp='20260826-0915';
  function load(src,done){const s=document.createElement('script');s.src=src+'?v='+stamp;s.onload=done;s.onerror=()=>{document.getElementById('loading').style.display='none';document.getElementById('petError').style.display='block'};document.head.appendChild(s)}
  load('./miyu_pet_pixel.js',function(){
    document.getElementById('loading').style.display='none';
    const btn=document.querySelector('[data-tab="petGame"]');
    const panel=document.getElementById('petGame');
    if(btn) btn.click(); else if(panel) panel.classList.add('active');
    load('./miyu_pet_merit.js',function(){});
  });
})();
</script>
</body>
</html>
