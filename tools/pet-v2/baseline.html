<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>谜屿宠物小屋 V2 · Clean Baseline</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { display: flex; justify-content: center; background: #a38ab8; }
    .scene { position: relative; width: 100%; max-width: 430px; height: 100svh; overflow: hidden; }
    .scene-layer, .pet-layer, .ui-layer { position: absolute; inset: 0; }
    .scene-layer { z-index: 10; }
    .pet-layer { z-index: 30; pointer-events: none; }
    .ui-layer { z-index: 40; }
    .scene-layer svg { width: 100%; height: 100%; display: block; }
    .pet-anchor { position: absolute; left: 45%; top: 78%; width: 22%; aspect-ratio: 96/120; transform: translate(-50%, -88.3%); }
    .pixel-pet { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; transform-origin: 50% 88.3%; }
    .pet-anchor[data-dir="left"] .pixel-pet { transform: scaleX(-1); }
    .pet-anchor.walking .motion-bob,
    .pet-anchor.walking #pixel-head,
    .pet-anchor.walking #pixel-body,
    .pet-anchor.walking #pixel-clothes,
    .pet-anchor.walking #pixel-accessory { animation: bob .44s steps(2,end) infinite; }
    @keyframes bob { 50% { transform: translateY(-1.5px); } }
    .themes { position: absolute; left: 12px; top: max(12px, env(safe-area-inset-top)); display: flex; gap: 6px; padding: 5px; background: #fff9; border-radius: 18px; }
    .themes button { border: 0; border-radius: 13px; padding: 7px 10px; font-size: 12px; font-weight: 700; background: #fff; color: #554b54; }
    .themes button.on { outline: 2px solid #765d82; }
    .pad { position: absolute; left: 50%; bottom: max(14px, calc(env(safe-area-inset-bottom) + 8px)); transform: translateX(-50%); display: grid; grid-template-columns: 48px 48px 48px; grid-template-rows: 40px 40px 40px; gap: 5px; padding: 7px; background: #fff9; border-radius: 20px; }
    .pad button { border: 0; border-radius: 12px; background: #fff; color: #66546d; font-size: 18px; font-weight: 900; }
    .pad .up { grid-column: 2; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .stop { grid-column: 2; grid-row: 2; font-size: 11px; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 3; }
    .status { position: absolute; left: 50%; top: 46%; transform: translateX(-50%); padding: 5px 9px; border-radius: 10px; background: #fff8; color: #6c5772; font-size: 10px; font-weight: 800; white-space: nowrap; }
  </style>
</head>
<body>
  <main class="scene">
    <div class="scene-layer" id="scene-layer"></div>
    <div class="pet-layer">
      <div class="pet-anchor" id="petAnchor" data-dir="front" data-action="idle"></div>
    </div>
    <div class="ui-layer">
      <div class="themes" aria-label="场景风格">
        <button data-theme="purple" class="on">梦幻紫粉</button>
        <button data-theme="muji">无印清新</button>
        <button data-theme="sea">蓝绿海风</button>
      </div>
      <div class="status" id="status">baseline loading</div>
      <div class="pad">
        <button class="up" data-act="back">↑</button>
        <button class="left" data-act="left">←</button>
        <button class="stop" data-act="stop">停止</button>
        <button class="right" data-act="right">→</button>
        <button class="down" data-act="front">↓</button>
      </div>
    </div>
  </main>
  <script type="module">
    import { loadScene, applyTheme } from './scene.js';
    import { loadBabyCat, setFacing } from './pet-sprite.js';
    import { createMovementController } from './movement.js';

    const sceneMount = document.getElementById('scene-layer');
    const petAnchor = document.getElementById('petAnchor');
    const status = document.getElementById('status');

    try {
      await loadScene({ mount: sceneMount });
      const cat = await loadBabyCat();
      petAnchor.replaceChildren(cat);

      const controller = createMovementController({
        anchor: petAnchor,
        onFacingChange(direction) {
          setFacing(cat, direction);
        },
        onStateChange({ state, direction }) {
          status.textContent = `${state} · ${direction} · clean baseline`;
        }
      });

      document.querySelectorAll('[data-act]').forEach((button) => {
        button.addEventListener('click', () => {
          const action = button.dataset.act;
          if (action === 'stop') controller.stop();
          else controller.move(action);
        });
      });

      document.querySelectorAll('[data-theme]').forEach((button) => {
        button.addEventListener('click', () => {
          const theme = button.dataset.theme;
          applyTheme(sceneMount, theme);
          document.querySelectorAll('[data-theme]').forEach((item) => item.classList.toggle('on', item === button));
        });
      });

      applyTheme(sceneMount, 'purple');
      controller.stop();
      status.textContent = 'idle · front · clean baseline';
    } catch (error) {
      console.error(error);
      status.textContent = `load failed: ${error.message}`;
    }
  </script>
</body>
</html>
