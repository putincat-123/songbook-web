<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>谜屿宠物小屋 V2 · SVG角色层验收</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}body{display:flex;justify-content:center;background:#a38ab8}.scene{position:relative;width:100%;max-width:430px;height:100svh;overflow:hidden}.scene-layer,.object-layer,.pet-layer,.ui-layer{position:absolute;inset:0}.scene-layer{z-index:10}.object-layer{z-index:20;pointer-events:none}.pet-layer{z-index:30;pointer-events:none}.ui-layer{z-index:40;pointer-events:none}.scene-layer svg{display:block;width:100%;height:100%}.pet-slot{position:absolute;left:54.1%;top:51.6%;width:18.2%;height:15.2%;transform:translateX(-50%);transform-origin:50% 100%}.pet-rig{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 2px rgba(78,57,78,.18))}.themes{position:absolute;left:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:6px;padding:5px;background:#fff9;border:1px solid #fff8;border-radius:18px;backdrop-filter:blur(8px);box-shadow:0 3px 14px #44334a25;pointer-events:auto}.themes button{border:0;border-radius:13px;padding:7px 10px;font-size:12px;font-weight:700;color:#554b54;background:#fff9}.themes button.on{background:#fff;color:#765d82;box-shadow:0 2px 8px #5e46632a}.load-error{display:none;position:absolute;z-index:50;left:50%;top:56%;transform:translate(-50%,-50%);padding:8px 12px;border-radius:12px;background:#fff9;color:#765d82;font-size:12px;font-weight:700}@media(min-width:431px){body{padding:18px}.scene{height:auto;aspect-ratio:375/667;border-radius:24px;box-shadow:0 20px 55px #3e285755}}
</style>
</head>
<body>
<main class="scene" id="scene">
  <div class="scene-layer" id="scene-layer" aria-label="房间场景"></div>
  <div class="object-layer" id="object-layer" aria-hidden="true"></div>
  <div class="pet-layer" id="pet-layer" data-pet="ragdoll" data-stage="baby" data-action="idle">
    <div class="pet-slot" id="pet-slot">
      <svg class="pet-rig" id="ragdoll-baby-rig" viewBox="0 0 100 130" role="img" aria-label="布偶小奶猫">
        <defs>
          <linearGradient id="furCream" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#f3e9df"/></linearGradient>
          <linearGradient id="pointTaupe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a8a88"/><stop offset="1" stop-color="#746767"/></linearGradient>
          <radialGradient id="eyeBlue"><stop offset="0" stop-color="#b7edff"/><stop offset=".45" stop-color="#68c8ee"/><stop offset=".8" stop-color="#377dad"/><stop offset="1" stop-color="#214a70"/></radialGradient>
          <linearGradient id="pinkCollar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e8a0bb"/><stop offset="1" stop-color="#cf6f9f"/></linearGradient>
        </defs>
        <ellipse id="pet-shadow" cx="50" cy="119" rx="29" ry="6" fill="#58475b" opacity=".15"/>
        <g id="tail" transform-origin="76px 91px"><path d="M72 91c11 1 20-2 23-9 3-7 0-14-6-15-5-1-8 3-7 7 1 4-1 8-6 9-3 1-6 0-9-1Z" fill="url(#pointTaupe)" stroke="#6d6062" stroke-width="2" stroke-linejoin="round"/><path d="M77 87c7 0 12-2 15-6" fill="none" stroke="#b9aaa7" stroke-width="4" stroke-linecap="round" opacity=".7"/></g>
        <g id="body" transform-origin="50px 90px"><path d="M28 74c-6 9-8 25-4 35 4 10 13 13 25 8 12 5 22 2 27-8 4-10 2-26-4-35-5-8-13-12-22-12s-17 4-22 12Z" fill="url(#furCream)" stroke="#8c7f80" stroke-width="2"/><path id="chest-fluff" d="M38 72c2 7 4 11 8 12l4 9 4-9c4-1 7-5 9-12-4 2-8 2-13-1-4 3-8 3-12 1Z" fill="#fffefa"/><path d="M29 88l-5 4 6 3-5 5 7 2M71 88l5 4-6 3 5 5-7 2" fill="#fffefa" stroke="#e8ded9" stroke-width="1.2" stroke-linejoin="round"/></g>
        <g id="back-legs" transform-origin="50px 111px"><ellipse cx="35" cy="111" rx="13" ry="8" fill="#fffaf5" stroke="#8c7f80" stroke-width="1.6"/><ellipse cx="65" cy="111" rx="13" ry="8" fill="#fffaf5" stroke="#8c7f80" stroke-width="1.6"/><path d="M29 112c4 2 8 2 12 0M59 112c4 2 8 2 12 0" stroke="#dbc9c6" stroke-width="1" stroke-linecap="round"/></g>
        <g id="front-legs" transform-origin="50px 102px"><path d="M37 84c-5 9-5 18-2 26 1 4 4 6 8 5 4-1 6-4 6-8V86Z" fill="#fffaf5" stroke="#8c7f80" stroke-width="1.4"/><path d="M63 84c5 9 5 18 2 26-1 4-4 6-8 5-4-1-6-4-6-8V86Z" fill="#fffaf5" stroke="#8c7f80" stroke-width="1.4"/></g>
        <g id="head" transform-origin="50px 51px"><g id="ears"><path id="ear-left" d="M24 39l3-24 16 11Z" fill="url(#pointTaupe)" stroke="#6d6062" stroke-width="2" stroke-linejoin="round"/><path id="ear-right" d="M76 39l-3-24-16 11Z" fill="url(#pointTaupe)" stroke="#6d6062" stroke-width="2" stroke-linejoin="round"/><path d="M29 31l2-10 8 7Z" fill="#d8b7b9"/><path d="M71 31l-2-10-8 7Z" fill="#d8b7b9"/></g><path id="head-fur" d="M20 46c0-15 12-27 30-27s30 12 30 27c0 20-13 34-30 34S20 66 20 46Z" fill="url(#furCream)" stroke="#8c7f80" stroke-width="2"/><g id="face-points"><path d="M26 43c3-10 10-17 19-20 1 7 3 12 5 17-4 1-8 5-10 11-6-1-11-4-14-8Z" fill="#aea19f" opacity=".9"/><path d="M74 43c-3-10-10-17-19-20-1 7-3 12-5 17 4 1 8 5 10 11 6-1 11-4 14-8Z" fill="#aea19f" opacity=".9"/><path d="M45 22c1 8 3 14 5 18 2-4 4-10 5-18l3 22-8 7-8-7Z" fill="#fffdf8"/></g><g id="eyes" transform-origin="50px 48px"><ellipse id="eye-left" cx="37" cy="48" rx="7" ry="8.5" fill="url(#eyeBlue)" stroke="#5d5660" stroke-width="1.6"/><ellipse id="eye-right" cx="63" cy="48" rx="7" ry="8.5" fill="url(#eyeBlue)" stroke="#5d5660" stroke-width="1.6"/><circle cx="34.8" cy="45" r="2.4" fill="#fff" opacity=".95"/><circle cx="60.8" cy="45" r="2.4" fill="#fff" opacity=".95"/><circle cx="39.5" cy="51.5" r="1.2" fill="#dff7ff" opacity=".9"/><circle cx="65.5" cy="51.5" r="1.2" fill="#dff7ff" opacity=".9"/></g><g id="muzzle"><path d="M30 62c5 7 12 10 20 10s15-3 20-10c-4 2-8 2-12 0-2 4-5 6-8 6s-6-2-8-6c-4 2-8 2-12 0Z" fill="#fffefa"/><path id="nose" d="M45.5 59q4.5-3 9 0-4.5 5-9 0Z" fill="#e8a0a7"/><path d="M50 63c-2 3-5 4-8 2m8-2c2 3 5 4 8 2" fill="none" stroke="#8d696e" stroke-width="1.5" stroke-linecap="round"/><path d="M33 61l-12-3m12 7-13 1m47-5 12-3m-12 7 13 1" stroke="#c8b5b2" stroke-width="1.1" stroke-linecap="round"/></g></g>
        <g id="accessories" transform-origin="50px 78px"><path d="M34 77q16 6 32 0" fill="none" stroke="url(#pinkCollar)" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="80" r="4" fill="#ffd36c" stroke="#a8784f" stroke-width="1.2"/><circle cx="48.5" cy="78.5" r="1" fill="#fff1b0"/></g>
      </svg>
    </div>
  </div>
  <div class="ui-layer" id="ui-layer" aria-hidden="true"></div>
  <div class="load-error" id="load-error">场景载入失败</div>
</main>
<script>
const state={pet:'ragdoll',stage:'baby',action:'idle'};window.petState=state;
window.setPetAction=function(action){state.action=action;document.getElementById('pet-layer').dataset.action=action};
window.petParts={head:()=>document.getElementById('head'),ears:()=>document.getElementById('ears'),eyes:()=>document.getElementById('eyes'),body:()=>document.getElementById('body'),frontLegs:()=>document.getElementById('front-legs'),backLegs:()=>document.getElementById('back-legs'),tail:()=>document.getElementById('tail'),accessories:()=>document.getElementById('accessories')};
const themes={purple:{body:'#a38ab8',w:['#aa8ac2','#c29bbd','#d5a6ae'],f:['#9b80b2','#bd8fae','#d9a493'],so:['#9eb5d7','#778bc2'],cab:['#9c75b8','#72589d'],cur:'#dba4d2',lamp:'#d77ba7',rug:['#f4b9bd','#f6d1c5'],g:'#ee819c',top:'#75d1cb'},muji:{body:'#d9d1bf',w:['#d8dfd4','#e8e2d5','#f2e7d7'],f:['#c9b28f','#d8c4a3','#ead8ba'],so:['#c8d6c8','#aebfae'],cab:['#c9a976','#a8875e'],cur:'#eee5d5',lamp:'#c9b47e',rug:['#e5d8bd','#f2ead8'],g:'#d2c4aa',top:'#a9bdb3'},sea:{body:'#8eb4b3',w:['#9fc6c5','#b9d5cf','#d7e4d7'],f:['#8eb8b5','#a7c8bd','#c6d7c2'],so:['#9ccdcc','#75aaa9'],cab:['#c8aa72','#a88b5c'],cur:'#bde2df',lamp:'#84b8ac',rug:['#d8dfc9','#f0ead6'],g:'#e58b72',top:'#73bbb9'}};
function applyTheme(key,nav){const target=document.querySelector('#scene-layer svg'),t=themes[key];if(!target||!t)return;document.body.style.background=t.body;[['w1',t.w[0]],['w2',t.w[1]],['w3',t.w[2]],['f1',t.f[0]],['f2',t.f[1]],['f3',t.f[2]],['so1',t.so[0]],['so2',t.so[1]],['c1',t.cab[0]],['c2',t.cab[1]]].forEach(([id,c])=>target.querySelector('#'+id)?.setAttribute('stop-color',c));target.querySelector('#curL')?.setAttribute('fill',t.cur);target.querySelector('#curR')?.setAttribute('fill',t.cur);target.querySelector('#lamp')?.setAttribute('fill',t.lamp);target.querySelector('#rug1')?.setAttribute('fill',t.rug[0]);target.querySelector('#rug2')?.setAttribute('fill',t.rug[1]);target.querySelector('#gbody')?.setAttribute('fill',t.g);target.querySelector('#gtop')?.setAttribute('fill',t.top);nav?.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.theme===key));localStorage.setItem('miyu-v2-theme',key)}
async function mountScene(){const host=document.getElementById('scene-layer');try{const html=await fetch('miyu_pet_room_v2.html?v=layer1-locked-2',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('scene '+r.status);return r.text()});const doc=new DOMParser().parseFromString(html,'text/html');const svg=doc.querySelector('svg.room');if(!svg)throw new Error('scene svg missing');svg.querySelector('#pet-character-layer')?.remove();svg.removeAttribute('class');svg.setAttribute('aria-hidden','true');host.replaceChildren(document.importNode(svg,true));const sourceNav=doc.querySelector('nav.themes');if(sourceNav){const nav=document.importNode(sourceNav,true);nav.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>applyTheme(btn.dataset.theme,nav)));document.getElementById('ui-layer').appendChild(nav);applyTheme(localStorage.getItem('miyu-v2-theme')||'purple',nav)}}catch(err){console.error(err);document.getElementById('load-error').style.display='block'}}
mountScene();
</script>
</body>
</html>
