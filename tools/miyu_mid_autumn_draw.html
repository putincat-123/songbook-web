<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>谜屿中秋抽取</title><style>
:root{--bg:#20182f;--card:#302440;--line:#59486c;--text:#fff8ef;--muted:#cdbed9;--gold:#f2c982}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#2c2140,#171122);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:980px;margin:auto;padding:16px}.hero,.box{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}.hero h1{font-size:24px;margin:0 0 6px}.hero p,.hint{color:var(--muted);font-size:13px;line-height:1.6}.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cat{border:1px solid var(--line);background:#382b49;color:var(--text);border-radius:15px;padding:12px;text-align:left}.cat.active{border-color:var(--gold);background:#493952}.cat b{display:block;font-size:15px}.cat span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{font:inherit}.draw,.reset{border:0;border-radius:13px;padding:11px 14px;font-weight:700}.draw{background:var(--gold);color:#402c16}.reset{background:#4a3a5d;color:#fff}.result{min-height:180px;display:flex;flex-direction:column;justify-content:center}.tag{color:var(--gold);font-size:13px;font-weight:700}.title{font-size:28px;font-weight:800;margin:8px 0}.meta{color:var(--muted);margin-bottom:10px}.content{line-height:1.8;background:rgba(255,255,255,.05);padding:12px;border-radius:13px}.stats{margin-top:10px;color:var(--muted);font-size:13px}.history{display:flex;flex-direction:column;gap:7px;max-height:240px;overflow:auto}.h{padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.05);font-size:13px}.h b{color:var(--gold)}@media(max-width:540px){main{padding:10px}.cats{grid-template-columns:1fr 1fr}.hero h1{font-size:21px}.title{font-size:24px}}
</style></head><body><main><section class="hero"><h1>🌕 中秋限定抽取</h1><p>选择食物后抽取。同一类别不重复，全部抽完才会自动开启下一轮；抽取进度会保存在这台装置。</p></section><section class="box"><div class="cats" id="cats"></div><div class="actions"><button class="draw" id="draw" disabled>请选择食物</button><button class="reset" id="reset" disabled>重置当前类别</button><button class="reset" id="resetAll">重置全部</button></div><div class="stats" id="stats">尚未选择</div></section><section class="box result" id="result"><div class="hint">选择一个食物，开始抽取。</div></section><section class="box"><b>最近抽取</b><div class="history" id="history" style="margin-top:10px"></div></section></main><script>
const D={"奶黄月饼｜甜蜜心动":[["情非得已","庾澄庆"],["暖暖","梁静茹"],["心愿便利贴","元若藍+吳忠明"],["专属天使","Tank"],["我愿意","王菲"],["恋爱ing","五月天"],["慢慢喜欢你","莫文蔚"],["最浪漫的事","赵咏华"],["有点甜","汪苏泷"],["爱很简单","陶喆"],["甜甜的","周杰伦"],["当爱在靠近","刘若英"],["简单爱","周杰伦"],["小酒窝","林俊杰"],["告白气球","周杰伦"],["就是爱你","陶喆"]],"抹茶月饼｜苦涩遗憾":[["一路向北","周杰伦"],["成全","林宥嘉"],["十年","陈奕迅"],["说好的幸福呢","周杰伦"],["演员","薛之谦"],["爱人错过","告五人"],["红玫瑰","陈奕迅"],["飞鸟和蝉","任然"],["慢冷","梁静茹"],["阴天","莫文蔚"],["我怀念的","孙燕姿"],["说散就散","陈咏桐"],["搁浅","周杰伦"],["雨爱","杨丞琳"],["体面","于文文"],["晴天","周杰伦"],["后来","刘若英"],["淘汰","陈奕迅"],["花海","周杰伦"],["后来的我们","五月天"],["可惜没如果","林俊杰"]],"冰皮月饼｜清新轻快":[["起风了","买辣椒也用券"],["日不落","蔡依林"],["小幸运","田馥甄"],["稻香","周杰伦"],["奔赴星空","尹昔眠"],["小城夏天","LBI 利比"],["七里香","周杰伦"],["夏天的风","温岚"],["星晴","周杰伦"],["想去海边","夏日入侵企画"],["NEW BOY","朴树"],["有何不可","许嵩"],["遇见","孙燕姿"],["小手拉大手","梁静茹"],["小情歌","苏打绿"]],"桂花乌龙｜温柔治愈":[["温柔","五月天"],["追光者","岑宁儿"],["如愿","王菲"],["风吹麦浪","李健"],["这世界那么多人","莫文蔚"],["世间美好与你环环相扣","柏松"],["平凡的一天","毛不易"],["陪你度过漫长岁月","陈奕迅"],["贝加尔湖畔","李健"],["稳稳的幸福","陈奕迅"],["知足","五月天"],["大鱼","周深"],["世界赠予我的","王菲"],["阿婆说","暗槓"],["给你给我","毛不易"],["我会等","承桓"]],"黑糖珍奶｜浓烈上头":[["易燃易爆炸","陈粒"],["天下","张杰"],["天外来物","薛之谦"],["我管你","华晨宇"],["光年之外","邓紫棋"],["江南","林俊杰"],["破茧","张韶涵"],["孤勇者","陈奕迅"],["倒数","邓紫棋"],["左手指月","萨顶顶"],["王妃","萧敬腾"],["泡沫","邓紫棋"],["曹操","林俊杰"],["山海","华晨宇"],["着魔","张杰"],["逆战","张杰"]],"五仁月饼｜百味故事":[["漠河舞厅","柳爽"],["消愁","毛不易"],["成都","赵雷"],["父亲写的散文诗","许飞"],["南山南","马頔"],["一荤一素","毛不易"],["董小姐","宋冬野"],["那些花儿","朴树"],["像我这样的人","毛不易"],["同桌的你","老狼"],["春风十里","鹿先森乐队"],["安和桥","宋冬野"],["曾经的你","许巍"],["山丘","李宗盛"],["平凡之路","朴树"],["斑马斑马","宋冬野"]],"草莓气泡饮｜惊喜彩蛋":[["月下读文","《今晚的月亮》","如果今晚你刚好抬头看月亮，那我们大概看的是同一片光。距离其实没有想象中那么远。有些陪伴，不一定要站在身边。"],["月下读文","《慢一点》","你不用一直赶路。有人走得快，有人走得慢，都没有关系。真正属于你的东西，不会因为你晚一点到，就突然消失。所以累的时候，就慢一点。"],["真心话","真心话","最近最想被别人理解的一件事是什么？"],["声线台词","克制心动音","你再靠近一点，我可能就藏不住了。"],["大冒险","大冒险","随机挑一位小耳朵，帮他取一个中秋限定昵称。"],["大冒险","大冒险","随机挑一位小耳朵，认真夸他一句，但不能说「可爱、温柔、好听」。"],["真心话","真心话","如果只能用一句话形容现在的自己，你会说什么？"],["真心话","真心话","最近有没有一首歌，一听就会想到某个人？"],["声线台词","淡淡治愈音","冬天总会过去的，你不用急着逞强。"],["红包","小红包","发一个小红包。"],["大冒险","大冒险","让公屏出三个关键词，现场编一句话，三个词都要用进去。"],["红包","超级彩蛋","小红包 + 加唱一小段。"],["声线台词","温柔认真音","如果一定要有一个人先动心，那就算我输。"],["大冒险","大冒险","随机连一位主播，认真夸他三句。"],["月下读文","《秋天》","秋天很奇怪。风一凉，很多记忆就会自己跑出来。明明已经很久没想起的人，忽然又会出现在脑海里。大概不是还放不下，只是季节替你记得。"],["真心话","真心话","如果现在可以立刻去一个地方，你最想去哪里？"],["月下读文","《晚安》","今天如果没有发生什么特别好的事，也没关系。你已经把今天过完了。剩下的情绪，先放在门外吧。今晚先好好睡一觉，明天再继续。"],["月下读文","《回家》","有时候想回去的，不是某个地方。只是想回到那个有人等你、有人问你累不累的时刻。如果今晚你也有点累，就早点回家吧。哪怕只是回到自己的房间，也算回家。"],["声线台词","嘴硬警告音","别再招我，不然后果你自己负责。"],["声线台词","低沉命令音","周五见，这次不准缺席。"]],"流心月饼｜主播自由发挥":[["自由发挥","主播自由发挥","想唱什么就唱什么，想聊什么就聊什么，想玩什么就玩什么。"]]};const K="miyu_midautumn_2026_v2";const order=Object.keys(D);
const names=Object.fromEntries(order.map(x=>[x,x.split("｜")[0]]));
function fresh(){let remaining={};order.forEach(c=>remaining[c]=D[c].map((_,i)=>i));return{selected:"",remaining,history:[]}}
function load(){try{let s=JSON.parse(localStorage.getItem(K)||"null"),b=fresh();if(!s)return b;if(order.includes(s.selected))b.selected=s.selected;order.forEach(c=>{if(Array.isArray(s.remaining?.[c]))b.remaining[c]=s.remaining[c].filter(i=>i>=0&&i<D[c].length)});if(Array.isArray(s.history))b.history=s.history.slice(0,30);return b}catch(e){return fresh()}}
let S=load();const save=()=>localStorage.setItem(K,JSON.stringify(S));
function render(){let cats=document.getElementById("cats");cats.innerHTML="";order.forEach(c=>{let b=document.createElement("button");b.className="cat"+(S.selected===c?" active":"");let rem=c.startsWith("流心")?"∞":S.remaining[c].length;b.innerHTML="<b>"+names[c]+"</b><span>"+c.split("｜")[1]+" · 剩余 "+rem+"</span>";b.onclick=()=>{S.selected=c;save();render()};cats.appendChild(b)});let d=document.getElementById("draw"),r=document.getElementById("reset"),st=document.getElementById("stats");d.disabled=!S.selected;r.disabled=!S.selected;d.textContent=S.selected?"抽取 "+names[S.selected]:"请选择食物";st.textContent=S.selected?(names[S.selected]+"｜"+(S.selected.startsWith("流心")?"主播自由发挥":("剩余 "+S.remaining[S.selected].length+" / "+D[S.selected].length))):"尚未选择";document.getElementById("history").innerHTML=S.history.length?S.history.map(x=>'<div class="h"><b>'+x.cat+'</b> · '+x.title+(x.meta?" / "+x.meta:"")+'</div>').join(""):'<div class="hint">还没有抽取记录。</div>'}
function show(c,item,n){let isSong=item.length===2,typ=isSong?"歌曲":item[0],title=isSong?item[0]:item[1],meta=isSong?item[1]:"",body=isSong?"":item[2];document.getElementById("result").innerHTML='<div class="tag">'+names[c]+' · '+c.split("｜")[1]+'</div><div class="title">'+title+'</div><div class="meta">'+(n===null?"自由发挥":"编号 "+n)+" · "+typ+(meta?" · "+meta:"")+'</div>'+(body?'<div class="content">'+body+'</div>':'');S.history.unshift({cat:names[c],title,meta});S.history=S.history.slice(0,30);save();render()}
document.getElementById("draw").onclick=()=>{let c=S.selected;if(!c)return;if(c.startsWith("流心"))return show(c,D[c][0],null);if(!S.remaining[c].length){S.remaining[c]=D[c].map((_,i)=>i);alert(names[c]+" 已全部抽完，自动开启新一轮。")}let a=S.remaining[c],p=Math.floor(Math.random()*a.length),idx=a.splice(p,1)[0];show(c,D[c][idx],idx+1)};
document.getElementById("reset").onclick=()=>{let c=S.selected;if(!c)return;if(confirm("重置 "+names[c]+"？")){S.remaining[c]=D[c].map((_,i)=>i);save();render()}};
document.getElementById("resetAll").onclick=()=>{if(confirm("重置全部抽取进度？")){S=fresh();save();document.getElementById("result").innerHTML='<div class="hint">选择一个食物，开始抽取。</div>';render()}};
render();
</script></body></html>
