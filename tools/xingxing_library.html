<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>星星曲庫管理</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--brand:#2563eb;--chip:#eff6ff;--danger:#dc2626;--shadow:0 6px 20px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text)}.app{max-width:1080px;margin:0 auto;padding:18px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.title{font-size:28px;font-weight:900;margin:8px 0 4px}.subtitle{color:var(--muted);font-size:14px;margin-bottom:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}.c8{grid-column:span 8}.c4{grid-column:span 4}.c12{grid-column:span 12}@media(max-width:720px){.c8,.c4,.c12{grid-column:span 12}}label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:6px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}button,a.btn{border:none;border-radius:12px;padding:10px 13px;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:var(--brand);color:#fff}.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.summary,.tag-row{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--chip);color:#1e3a8a;border-radius:999px;padding:8px 10px;font-size:13px;font-weight:800}.empty{padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center;background:#fff}.song-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;margin-bottom:10px}.song-title{font-size:16px;font-weight:900;margin-bottom:4px}.song-meta{font-size:13px;color:var(--muted);line-height:1.5}.tag-btn{background:#f8fafc;color:#334155;border:1px solid #cbd5e1;padding:7px 10px;border-radius:999px;font-size:13px}.tag-btn.active{background:#fff7ed;color:#c2410c;border-color:#fdba74}.tag-pill{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:800}.filter-btn{background:#fff;color:#334155;border:1px solid #cbd5e1;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:800}.filter-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}.dirty{color:var(--danger);font-size:12px;font-weight:800;margin-top:6px}.pager{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:12px 0}.sticky-save{position:sticky;bottom:10px;padding-top:10px;background:linear-gradient(transparent,var(--bg) 45%)}
</style>
</head>
<body><div class="app">
<div class="top"><a class="btn ghost" href="./xingxing_toolbox.html?streamer=xingxing">← 回星星工具箱</a><span class="chip">曲庫管理</span></div>
<div class="title">🎵 星星曲庫管理</div><div class="subtitle">搜尋、分類、自訂標籤與曲庫維護</div>
<div class="card"><div class="summary" id="poolSummary"><span class="chip">曲庫載入中...</span></div></div>
<div class="card"><h3 style="margin-top:0">搜尋與分類</h3><div class="grid"><div class="c8"><label>搜尋歌名 / 歌手 / 標籤</label><input id="searchInput" placeholder="例如：周杰倫 / 甜歌 / 開嗓" /></div><div class="c4"><label>&nbsp;</label><button class="ghost" id="reloadBtn" style="width:100%">重新載入曲庫</button></div><div class="c12"><div id="categoryFilterWrap" class="tag-row"></div></div></div></div>
<div class="card"><h3 style="margin-top:0">自訂標籤</h3><div id="tagPoolWrap" class="tag-row"><div class="empty">尚未建立標籤池</div></div><div class="grid" style="margin-top:12px"><div class="c8"><label>新增標籤</label><input id="newTagInput" placeholder="例如：熱歌、拿手、甜歌、開嗓" /></div><div class="c4"><label>&nbsp;</label><button class="ghost" id="addTagBtn" style="width:100%">新增標籤</button></div></div></div>
<div class="card"><h3 style="margin-top:0">歌曲清單</h3><div class="pager"><button class="ghost" id="prevPageBtn">上一頁</button><span class="chip" id="pageInfo"></span><button class="ghost" id="nextPageBtn">下一頁</button></div><div id="songList"></div><div class="pager"><button class="ghost" id="prevPageBtnBottom">上一頁</button><span class="chip" id="pageInfoBottom"></span><button class="ghost" id="nextPageBtnBottom">下一頁</button></div><div class="sticky-save"><button class="primary" id="saveBtn" style="width:100%">儲存變更到 Supabase</button></div></div>
</div>
<script>
const API_BASE_URL='https://streamer-songbook.vercel.app',STREAMER=new URLSearchParams(location.search).get('streamer')||'xingxing',$=id=>document.getElementById(id);let songPool=[],tagPool=[],activeCategoryTag='__ALL__',currentPage=1;const PAGE_SIZE=100,dirtySongIds=new Set();function esc(s=''){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function normalizeSong(s,i){return{id:s.id||'',seq:s.seq??i+1,songName:s.songName||s.name||s.displayName||s.display_name||s.sharedName||'',artist:s.artist||s.displayArtist||s.display_artist||s.sharedArtist||'',customTags:Array.isArray(s.customTags)?s.customTags:Array.isArray(s.custom_tags)?s.custom_tags:[]}}async function loadSongs(){dirtySongIds.clear();currentPage=1;for(const path of [`../data/${STREAMER}/songs.json?v=${Date.now()}`,`./data/${STREAMER}/songs.json?v=${Date.now()}`]){try{const r=await fetch(path);if(!r.ok)continue;const d=await r.json();if(!Array.isArray(d))continue;songPool=d.map(normalizeSong).filter(x=>x.id&&x.songName);tagPool=[...new Set(songPool.flatMap(x=>x.customTags||[]))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));renderAll();return}catch(e){console.warn(e)}}$('poolSummary').innerHTML='<span class="chip">曲庫載入失敗</span>'}function renderAll(){const artists=new Set(songPool.map(x=>x.artist).filter(Boolean)),tagged=songPool.filter(x=>x.customTags.length).length;$('poolSummary').innerHTML=`<span class="chip">曲庫 ${songPool.length} 首</span><span class="chip">歌手 ${artists.size} 位</span><span class="chip">已標籤 ${tagged} 首</span><span class="chip">待儲存 ${dirtySongIds.size} 首</span>`;$('tagPoolWrap').innerHTML=tagPool.length?tagPool.map(t=>`<button class="tag-pill" data-action="delete" data-tag="${esc(t)}">${esc(t)} ×</button>`).join(''):'<div class="empty">尚未建立標籤池</div>';$('categoryFilterWrap').innerHTML=`<button class="filter-btn ${activeCategoryTag==='__ALL__'?'active':''}" data-action="filter" data-tag="__ALL__">全部歌曲</button>${tagPool.map(t=>`<button class="filter-btn ${activeCategoryTag===t?'active':''}" data-action="filter" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}<button class="filter-btn ${activeCategoryTag==='__UNTAGGED__'?'active':''}" data-action="filter" data-tag="__UNTAGGED__">未標籤</button>`;renderSongList()}function filtered(){const k=$('searchInput').value.trim().toLowerCase();return songPool.filter(s=>{const tags=s.customTags||[],cat=activeCategoryTag==='__ALL__'||(activeCategoryTag==='__UNTAGGED__'?tags.length===0:tags.includes(activeCategoryTag));return cat&&(!k||[s.songName,s.artist,...tags].join(' ').toLowerCase().includes(k))})}function renderSongList(){const f=filtered(),pages=Math.max(1,Math.ceil(f.length/PAGE_SIZE));currentPage=Math.min(Math.max(1,currentPage),pages);const start=(currentPage-1)*PAGE_SIZE,list=f.slice(start,start+PAGE_SIZE),info=`第 ${currentPage} / ${pages} 頁｜共 ${f.length} 首`;$('pageInfo').textContent=info;$('pageInfoBottom').textContent=info;$('prevPageBtn').disabled=$('prevPageBtnBottom').disabled=currentPage<=1;$('nextPageBtn').disabled=$('nextPageBtnBottom').disabled=currentPage>=pages;$('songList').innerHTML=list.map(s=>`<div class="song-card"><div class="song-title">${esc(s.seq)}. ${esc(s.songName)}</div><div class="song-meta">歌手：${esc(s.artist||'未知歌手')}</div>${dirtySongIds.has(s.id)?'<div class="dirty">● 尚未儲存</div>':''}<div class="tag-row" style="margin-top:10px">${tagPool.map(t=>`<button class="tag-btn ${(s.customTags||[]).includes(t)?'active':''}" data-action="toggle" data-id="${esc(s.id)}" data-tag="${esc(t)}">${(s.customTags||[]).includes(t)?'✓ ':'+ '}${esc(t)}</button>`).join('')}</div></div>`).join('')||'<div class="empty">查無符合歌曲</div>'}function addTag(){const t=$('newTagInput').value.trim();if(!t)return;if(!tagPool.includes(t))tagPool.push(t);$('newTagInput').value='';renderAll()}async function save(){for(const id of [...dirtySongIds]){const s=songPool.find(x=>x.id===id);const r=await fetch(`${API_BASE_URL}/api/admin/pool-songs/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({custom_tags:s.customTags||[]})});if(!r.ok)throw new Error(`PATCH failed ${r.status}`)}dirtySongIds.clear();renderAll();alert('已儲存變更')}document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;if(a==='filter'){activeCategoryTag=b.dataset.tag;currentPage=1;renderAll()}else if(a==='toggle'){const s=songPool.find(x=>x.id===b.dataset.id);const t=b.dataset.tag;s.customTags=(s.customTags||[]).includes(t)?s.customTags.filter(x=>x!==t):[...(s.customTags||[]),t];dirtySongIds.add(s.id);renderAll()}else if(a==='delete'){const t=b.dataset.tag;tagPool=tagPool.filter(x=>x!==t);songPool.forEach(s=>{if((s.customTags||[]).includes(t)){s.customTags=s.customTags.filter(x=>x!==t);dirtySongIds.add(s.id)}});renderAll()}});$('addTagBtn').onclick=addTag;$('searchInput').oninput=()=>{currentPage=1;renderSongList()};$('reloadBtn').onclick=loadSongs;$('saveBtn').onclick=()=>save().catch(e=>alert(e.message));$('prevPageBtn').onclick=$('prevPageBtnBottom').onclick=()=>{currentPage--;renderSongList()};$('nextPageBtn').onclick=$('nextPageBtnBottom').onclick=()=>{currentPage++;renderSongList()};loadSongs();
</script></body></html>
