name: Add Miyu calculator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-miyu-calculator.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load calculator module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/miyu_toolbox.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="./miyu_calculator.js"></script>'
          if tag in text:
              raise SystemExit('calculator module already loaded')
          if text.count('</body>') != 1:
              raise SystemExit('body anchor mismatch')
          p.write_text(text.replace('</body>', tag+'\n</body>', 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- tools/miyu_toolbox.html
      - name: Commit loader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/miyu_toolbox.html
          git commit -m 'Load calculator in Miyu toolbox'
          git push
