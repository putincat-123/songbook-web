name: Patch Miyu listener v0.2
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-miyu-listener-v02.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch file
        run: |
          echo ' vYnV0dG9uPgogICAgICA8YnV0dG9uIGlkPSJkb3dubG9hZEZ1bGxCdG4iIGNsYXNzPSJnaG9zdCIgZGlzYWJsZWQ+4oaTIOS4i+i8ieaVtOWgtOW9j+iLsTw 整場錄音...')
      return;
    }
    try{
      fullFileHandle = await window.showSaveFilePicker({
        suggestedName:`miyu_full_${stamp()}.webm`,
        types:[{description:'WebM 音訊',accept:{'audio/webm':['.webm']}}]
      });
      $('fullRecHint').textContent='已選擇保存位置。開始旁聽後，整場錄音會每 10 秒寫入本機檔案，適合長時間直播。';
    }catch(err){ if(err?.name!=='AbortError') alert('選擇檔案失敗：'+(err.message||err)); }
  }
  $('pickFullFileBtn').onclick=pickFullFile;

  async function startFullRecording(){
    if($('fullRecordEnabled').value!=='1'){
      setFullRecStatus(false,'整場錄音：已關閉');
      return;
    }
    if(!window.MediaRecorder){
      setFullRecStatus(false,'整場錄音：瀏覽器不支援');
      return;
    }
    fullParts=[]; fullBlob=null; fullStartedAt=Date.now(); fullMime=chooseRecorderMime();
    $('downloadFullBtn').disabled=true; $('analysisPackBtn').disabled=true;
    if(fullFileHandle){
      try{ fullWritable = await fullFileHandle.createWritable(); }
      catch(err){ fullWritable=null; alert('無法寫入所選檔案，將改為暫存在瀏覽器記憶體。'); }
    }
    const audioOnly = new MediaStream(displayStream.getAudioTracks());
    fullRecorder = fullMime ? new MediaRecorder(audioOnly,{mimeType:fullMime,audioBitsPerSecond:96000}) : new MediaRecorder(audioOnly);
    fullRecorder.ondataavailable = async e => {
      if(!e.data || !e.data.size) return;
      if(fullWritable){
        try{ await fullWritable.write(e.data); }
        catch(err){ console.error('full recording write failed',err); fullParts.push(e.data); }
      }else fullParts.push(e.data);
    };
    fullRecorder.onerror = e => console.error('MediaRecorder error',e.error||e);
    fullRecorder.start(10000);
    setFullRecStatus(true,'整場錄音：錄製中');
  }

  async function stopFullRecording(){
    if(!fullRecorder || fullRecorder.state==='inactive'){
      if(fullWritable){ try{await fullWritable.close();}catch{} fullWritable=null; }
      return;
    }
    await new Promise(resolve=>{
      fullRecorder.addEventListener('stop',resolve,{once:true});
      try{fullRecorder.stop();}catch{resolve();}
    });
    if(fullWritable){
      try{ await fullWritable.close(); }catch{}
      fullWritable=null;
      setFullRecStatus(false,'整場錄音：已保存至本機');
      $('downloadFullBtn').disabled=true;
    }else if(fullParts.length){
      fullBlob = new Blob(fullParts,{type:fullMime||'audio/webm'});
      setFullRecStatus(false,`整場錄音：已完成（${Math.round(fullBlob.size/1024/1024)} MB）`);
      $('downloadFullBtn').disabled=false;
    }else setFullRecStatus(false,'整場錄音：沒有可保存資料');
    $('analysisPackBtn').disabled=false;
    fullRecorder=null;
  }

  $('downloadFullBtn').onclick=()=>{
    if(!fullBlob)return;
    downloadBlob(fullBlob,`miyu_full_${stamp()}.webm`);
  };

  function analysisPayload(){
    const end=Date.now();
    return {
      version:'miyu-listener-v0.2',
      streamer:'miyu',
      session:{
        startedAt: fullStartedAt ? new Date(fullStartedAt).toISOString() : null,
        endedAt: new Date(end).toISOString(),
        durationSec: fullStartedAt ? Math.round((end-fullStartedAt)/1000) : 0,
        fullRecording: $('fullRecordEnabled').value==='1',
        recordingFileSelected: !!fullFileHandle,
        mimeType: fullMime || 'audio/webm'
      },
      focuses: focuses.map(x=>({...x})),
      candidates: candidates.map(c=>({
        id:c.id,time:c.time.toISOString(),durationSec:Math.round(c.duration),tag:c.tag,filename:c.filename,feedback:c.feedback
      })),
      aiInstructions:{
        goal:'從整場直播中找出值得剪輯與對外曝光的高光，不需平均分配類型；沒有好素材可以不選。',
        priority:'優先參考 enabled=true 的關注點及 weight；同時探索新的高光類型。',
        feedback:'feedback=1 代表值得發，-1 代表不值得發，0 代表未評分。'
      }
    };
  }
  $('analysisPackBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(analysisPayload(),null,2)],{type:'application/json'});
    downloadBlob(blob,`miyu_analysis_${stamp()}.json`);
  };

  async function start(){
    if(!navigator.mediaDevices?.getDisplayMedia)'''
assert start_needle in s, 'start target not found'
s = s.replace(start_needle, helpers, 1)

start_hook = '''      chunks=[]; totalSamples=0; startedAt=Date.now(); setLive(true,'正在旁聽');
      timer=setInterval(updateClock,500); meterTimer=setInterval(updateMeter,100);'''
start_hook_add = '''      chunks=[]; totalSamples=0; startedAt=Date.now(); setLive(true,'正在旁聽');
      await startFullRecording();
      timer=setInterval(updateClock,500); meterTimer=setInterval(updateMeter,100);'''
assert start_hook in s, 'start hook not found'
s = s.replace(start_hook, start_hook_add, 1)

stop_needle = '''  async function stop(){
    setLive(false,'已停止'); clearInterval(timer);clearInterval(meterTimer);timer=meterTimer=null; $('meterBar').style.width='0%';
    try{processor&&(processor.onaudioprocess=null);processor?.disconnect();sourceNode?.disconnect();analyser?.disconnect();silentGain?.disconnect();displayStream?.getTracks().forEach(t=>t.stop());await audioCtx?.close();}catch{}'''
stop_add = '''  async function stop(){
    setLive(false,'已停止'); clearInterval(timer);clearInterval(meterTimer);timer=meterTimer=null; $('meterBar').style.width='0%';
    await stopFullRecording();
    try{processor&&(processor.onaudioprocess=null);processor?.disconnect();sourceNode?.disconnect();analyser?.disconnect();silentGain?.disconnect();displayStream?.getTracks().forEach(t=>t.stop());await audioCtx?.close();}catch{}'''
assert stop_needle in s, 'stop target not found'
s = s.replace(stop_needle, stop_add, 1)

live_needle = '''  function setLive(live,msg){ $('liveDot').classList.toggle('live',live); $('statusText').textContent=msg; $('startBtn').disabled=live; $('stopBtn').disabled=!live; $('saveBtn').disabled=!live; }'''
live_add = '''  function setLive(live,msg){ $('liveDot').classList.toggle('live',live); $('statusText').textContent=msg; $('startBtn').disabled=live; $('stopBtn').disabled=!live; $('saveBtn').disabled=!live; $('fullRecordEnabled').disabled=live; $('pickFullFileBtn').disabled=live; }'''
assert live_needle in s, 'setLive target not found'
s = s.replace(live_needle, live_add, 1)

p.write_text(s, encoding='utf-8')
print('patched', p)
