          python /tmp/patch.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/miyu_ai_listener.html
          git commit -m "add full-session recording and analysis pack to Miyu listener"
          git push
