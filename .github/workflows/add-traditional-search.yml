          }
          Path('tools').mkdir(exist_ok=True)
          Path('tools/zh_t2s_map.js').write_text('window.ZH_T2S_MAP='+json.dumps(pairs,ensure_ascii=False,separators=(',',':'))+';\n',encoding='utf-8')
          print('mappings',len(pairs))
          PY
      - name: Patch songbook search normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          if './tools/zh_t2s_map.js' not in text:
              old='<div id="toast" class="toast"></div>\n<script>'
              new='<div id="toast" class="toast"></div>\n<script src="./tools/zh_t2s_map.js"></script>\n<script>'
              if text.count(old)!=1: raise SystemExit(f'script anchor mismatch: {text.count(old)}')
              text=text.replace(old,new,1)
          old_fn='function normalizeText(v){return String(v==null?"":v).toLowerCase().normalize("NFKC").replace(/[\\s\\u3000]+/g,"").trim()}\nfunction searchKey(v){return normalizeText(v)}'
          new_fn='function toSimplified(v){const map=window.ZH_T2S_MAP||{};return Array.from(String(v==null?"":v),ch=>map[ch]||ch).join("")}\nfunction normalizeText(v){return toSimplified(String(v==null?"":v).toLowerCase().normalize("NFKC")).replace(/[\\s\\u3000]+/g,"").trim()}\nfunction searchKey(v){return normalizeText(v)}'
          if 'function toSimplified(v)' not in text:
              if text.count(old_fn)!=1: raise SystemExit(f'normalize anchor mismatch: {text.count(old_fn)}')
              text=text.replace(old_fn,new_fn,1)
          p.write_text(text,encoding='utf-8')
          PY
          git diff --check
          grep -n 'zh_t2s_map\|toSimplified' index.html
      - name: Commit support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tools/zh_t2s_map.js
          git commit -m 'Support Traditional Chinese song search'
          git push
