name: Materialize Baby PNG
on:
  push:
    paths:
      - '.github/workflows/materialize-baby-png.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify Baby PNG
        run: |
          python - <<'PY'
          import base64, pathlib, re, struct
          src = pathlib.Path('tools/pet-v2-review/baby-walk-fixed.b64').read_text()
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', src)
          clean += '=' * ((4 - len(clean) % 4) % 4)
          data = base64.b64decode(clean, validate=False)
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG signature'
          assert data[-12:].endswith(b'IEND\xaeB`\x82'), 'PNG appears truncated'
          out = pathlib.Path('tools/pet-v2-review/assets/baby-idle.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(data)
          print('PNG bytes:', len(data))
          PY
          file tools/pet-v2-review/assets/baby-idle.png
      - name: Commit PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pet-v2-review/assets/baby-idle.png
          git diff --cached --quiet || git commit -m 'Add verified Baby idle PNG asset'
          git push
