name: Materialize Baby PNG
on:
  push:
    paths:
      - '.github/workflows/materialize-baby-png.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Baby PNG
        run: |
          mkdir -p tools/pet-v2-review/assets
          tr -d '\r\n ' < tools/pet-v2-review/baby-walk-fixed.b64 | base64 -d > tools/pet-v2-review/assets/baby-idle.png
          file tools/pet-v2-review/assets/baby-idle.png
      - name: Commit PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/pet-v2-review/assets/baby-idle.png
          git diff --cached --quiet || git commit -m 'Add Baby idle PNG asset'
          git push
