name: Patch Miyu screenlist logic
on:
  push:
    paths:
      - '.github/workflows/patch-miyu-screenlist.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/miyu_toolbox.html')
          s=p.read_text()
          old="""  function getNewestSongs(count=5){return [...songPool].sort((a,b)=>{const ad=a.sourceDate||a.createdAt||'',bd=b.sourceDate||b.createdAt||'';if(ad!==bd)return bd.localeCompare(ad);return (b.seq||0)-(a.seq||0)}).slice(0,count)}
  function getScreenArtists(count=5){return [...artistMap.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'zh-Hans-CN')).slice(0,count).map(([name])=>name)}
  function getScreenRecommendations(count=32){const newest=new Set(getNewestSongs(6).map(s=>s.id)),dailyIds=new Set(dailySongs.map(s=>s.id));const base=songPool.filter(s=>!newest.has(s.id));const daily=seededShuffle(base.filter(s=>dailyIds.has(s.id)),seedFrom(streamer+'|screen-daily|'+localDateKey()+'|'+screenListNonce));const rest=seededShuffle(base.filter(s=>!dailyIds.has(s.id)),seedFrom(streamer+'|screen-rest|'+localDateKey()+'|'+screenListNonce));const result=[],artistCounts=new Map();for(const s of [...daily,...rest]){const key=s.artist||'__';const used=artistCounts.get(key)||0;if(key!=='__'&&used>=3)continue;result.push(s);artistCounts.set(key,used+1);if(result.length>=count)break}return result}
  function buildScreenList(){if(!songPool.length||!artistMap.size){$('screenListText').value='';$('screenListMeta').textContent='曲库尚未载入';return}const newest=getNewestSongs(5),artists=getScreenArtists(5),recommended=getScreenRecommendations(32);const parts=[];parts.push('🎲盲盒点歌');parts.push('数字 1-'+songPool.length+'｜歌手：'+artists.join('｜'));parts.push('');parts.push('❥新学');parts.push(...compactLines(newest.map(s=>s.name),32));parts.push('');parts.push('❥推荐');parts.push(...compactLines(recommended.map(s=>s.name),34));$('screenListText').value=parts.join('\\n');$('screenListMeta').textContent='标准版｜新学 '+newest.length+' 首｜推荐 '+recommended.length+' 首｜歌手盲盒 '+artists.length+' 位｜可直接编辑'}
"""
          new="""  function getNewestSongs(count=5){return [...songPool].sort((a,b)=>{const ad=a.sourceDate||a.createdAt||'',bd=b.sourceDate||b.createdAt||'';if(ad!==bd)return bd.localeCompare(ad);return (b.seq||0)-(a.seq||0)}).slice(0,count)}
  function getScreenNewSongs(count=5,poolSize=10){const recent=getNewestSongs(poolSize);return seededShuffle(recent,seedFrom(streamer+'|screen-new|'+localDateKey()+'|'+screenListNonce)).slice(0,count)}
  function getScreenArtists(count=5){return [...artistMap.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],'zh-Hans-CN')).slice(0,count).map(([name])=>name)}
  function getScreenRecommendations(count=32){const recentIds=new Set(getNewestSongs(10).map(s=>s.id));const base=songPool.filter(s=>!recentIds.has(s.id));const shuffled=seededShuffle(base,seedFrom(streamer+'|screen-recommend|'+localDateKey()+'|'+screenListNonce));const result=[],artistCounts=new Map();for(const s of shuffled){const key=s.artist||'__';const used=artistCounts.get(key)||0;if(key!=='__'&&used>=3)continue;result.push(s);artistCounts.set(key,used+1);if(result.length>=count)break}return result}
  function buildScreenList(){if(!songPool.length||!artistMap.size){$('screenListText').value='';$('screenListMeta').textContent='曲库尚未载入';return}const newest=getScreenNewSongs(5,10),artists=getScreenArtists(5),recommended=getScreenRecommendations(32);const parts=[];parts.push('🎲盲盒点歌');parts.push('数字 1-'+songPool.length+'｜歌手：'+artists.join('｜'));parts.push('');parts.push('❥新学');parts.push(...compactLines(newest.map(s=>s.name),32));parts.push('');parts.push('❥推荐');parts.push(...compactLines(recommended.map(s=>s.name),34));$('screenListText').value=parts.join('\\n');$('screenListMeta').textContent='标准版｜新学 '+newest.length+' 首（近期10首随机）｜推荐 '+recommended.length+' 首｜歌手盲盒 '+artists.length+' 位｜可直接编辑'}
"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/miyu_toolbox.html
          git commit -m "Refine Miyu public-screen songlist selection"
          git push
