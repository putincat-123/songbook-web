name: Patch Miyu Toolbox Copy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-miyu-toolbox-copy.yml'

jobs:
  patch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch toolbox
        run: python scripts/patch-miyu-toolbox-copy.py

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tools/miyu_toolbox.html
          git diff --cached --quiet || git commit -m "add copy buttons to Miyu blind-box results"
          git push
