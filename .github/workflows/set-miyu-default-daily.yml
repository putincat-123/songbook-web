name: Set Miyu default daily tab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/set-miyu-default-daily.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch default tab only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/miyu_toolbox.html')
          text = p.read_text(encoding='utf-8')
          old = "loadSongPool();loadDailyTopics();const initial=qs.get('tool');if(initial&&document.getElementById(initial))showMain(initial);"
          new = "loadSongPool();loadDailyTopics();const initial=qs.get('tool');if(initial&&document.getElementById(initial))showMain(initial);else showMain('daily');"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one initialization match, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- tools/miyu_toolbox.html
      - name: Commit precise fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/miyu_toolbox.html
          git commit -m 'Open Miyu toolbox on daily recommendations by default'
          git push
