name: Update Miyu Daily Topics

on:
  workflow_dispatch:
  schedule:
    # 06:10 Asia/Taipei (UTC+8)
    - cron: '10 22 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh daily topics
        run: node scripts/update-daily-topics.js

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/miyu/daily_topics.json
          git diff --cached --quiet || git commit -m "update miyu daily topics"
          git push
