name: Add Dayu export to toolboxes

on:
  push:
    paths:
      - '.github/workflows/add-dayu-to-tools.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch toolboxes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Miyu toolbox: add a fixed miyu Dayu export entry in Data Tools.
          p = Path('tools/miyu_toolbox.html')
          s = p.read_text(encoding='utf-8')
          marker = '''    <button class="ghost" id="checkHotSyncBtn">\n      檢查 QQ 熱歌同步\n    </button>'''
          addition = '''    <button class="ghost" onclick="location.href='./dayu_export.html?streamer=miyu&lock=1'">\n      🐟 匯出大魚歌單\n    </button>'''
          if addition not in s:
              if marker not in s:
                  raise SystemExit('miyu marker not found')
              s = s.replace(marker, marker + '\n\n' + addition, 1)
          p.write_text(s, encoding='utf-8')

          # Xingxing toolbox: add a fixed xingxing Dayu export card.
          p = Path('tools/xingxing_toolbox.html')
          s = p.read_text(encoding='utf-8')
          marker = '''  <div class="card">\n    <div class="pager" id="topPager">'''
          card = '''  <div class="card">\n    <h3>大魚直播助手</h3>\n    <div class="small" style="margin-bottom:10px">僅匯出星星自己的線上曲庫，格式為「歌名 歌手」。</div>\n    <button class="ghost" style="width:100%" onclick="location.href='./dayu_export.html?streamer=xingxing&lock=1'">🐟 匯出大魚歌單</button>\n  </div>\n\n'''
          if card not in s:
              if marker not in s:
                  raise SystemExit('xingxing marker not found')
              s = s.replace(marker, card + marker, 1)
          p.write_text(s, encoding='utf-8')

          # Lock Dayu export page to the streamer passed by each toolbox.
          p = Path('tools/dayu_export.html')
          s = p.read_text(encoding='utf-8')
          old = "  $('streamer').addEventListener('change', loadSongs);\n  $('reloadBtn').addEventListener('click', loadSongs);\n  $('downloadBtn').addEventListener('click', download);\n  loadSongs();"
          new = "  const params = new URLSearchParams(location.search);\n  const requestedStreamer = params.get('streamer');\n  const locked = params.get('lock') === '1';\n  if (requestedStreamer && config[requestedStreamer]) $('streamer').value = requestedStreamer;\n  if (locked) {\n    $('streamer').disabled = true;\n    $('streamer').title = '已鎖定目前主播，避免匯出到其他主播歌單';\n  }\n  $('streamer').addEventListener('change', loadSongs);\n  $('reloadBtn').addEventListener('click', loadSongs);\n  $('downloadBtn').addEventListener('click', download);\n  loadSongs();"
          if new not in s:
              if old not in s:
                  raise SystemExit('dayu marker not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add tools/miyu_toolbox.html tools/xingxing_toolbox.html tools/dayu_export.html
          git diff --cached --quiet || git commit -m "add streamer-specific Dayu export to toolboxes"
          git push
