name: Patch Miyu listener entry
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-miyu-listener-entry.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add listener entry to Miyu toolbox
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/miyu_toolbox.html')
          s = p.read_text(encoding='utf-8')
          if "miyu_ai_listener.html" in s:
              print('entry already exists')
              raise SystemExit(0)
          needle = """    <button class=\"ghost\" onclick=\"location.href='./dayu_export.html?streamer=miyu&lock=1'\">\n      🐟 匯出大魚歌單\n    </button>"""
          addition = needle + """\n\n    <button class=\"ghost\" onclick=\"location.href='./miyu_ai_listener.html'\">\n      🎧 AI 直播旁聽\n    </button>"""
          if needle not in s:
              raise SystemExit('target button not found')
          p.write_text(s.replace(needle, addition, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/miyu_toolbox.html
          git commit -m "add AI live listener to Miyu toolbox"
          git push
